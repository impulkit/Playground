- {year: 1784, title: Mesmer put to the test, text: "A French commission including Benjamin Franklin uses blindfold tests and finds Mesmer's cures come from imagination.", article: placebo}
- {year: 1978, title: Placebo painkillers explained, text: A drug that blocks the body's own painkillers is shown to block placebo pain relief too., article: placebo}
- {year: 2022, title: Tele-MANAS launched, text: India opens a free national mental health helpline on 14416., article: mental-health}
- {year: 1979, title: Mindfulness enters medicine, text: Jon Kabat-Zinn starts Mindfulness-Based Stress Reduction at a US medical school., article: mindfulness}
- {year: 2009, title: Measuring habits, text: A London study finds new habits take about 66 days on average to become automatic., article: habits}
- {year: 1973, title: The drawing experiment, text: Stanford psychologists find that expected rewards can reduce children's interest in drawing., article: motivation}
- {year: 1974, title: First Tommy John surgery, text: Surgeon Frank Jobe replaces a pitcher's torn elbow ligament with a tendon., article: sports-injuries}
- {year: 1902, title: Modern air conditioning, text: Willis Carrier builds a machine to control humidity in a Brooklyn printing plant., article: air-conditioning}
- {year: 1882, title: Electric ceiling fan, text: Philip Diehl fits a sewing-machine motor with blades and hangs it from the ceiling., article: ceiling-fans}
- {year: 1831, title: Faraday discovers induction, text: Michael Faraday shows a changing magnetic field can make electricity flow., article: induction-stoves}
- {year: 1901, title: Horse-drawn vacuum cleaner, text: Hubert Cecil Booth builds a powered vacuum cleaner in London., article: vacuum-cleaners}
- {year: 1752, title: Lightning rods proven, text: French scientists follow Benjamin Franklin's plan and draw sparks from a storm cloud., article: lightning-rods}
- {year: 1797, title: Early balloon parachute jump, text: André-Jacques Garnerin drops above Paris under a silk canopy., article: parachutes}
- {year: 2000, title: Leonardo's parachute flies, text: Adrian Nicholas jumps with a parachute built from Leonardo da Vinci's sketch., article: parachutes}
- {year: 1851, title: First America's Cup race, text: A sailing race off England starts a contest still held today., article: boats-sail}
- {year: 1998, title: Airbags required in the USA, text: All new US cars must have front airbags for both front seats., article: airbags}
- {year: 1959, title: Three-point seatbelt, text: Nils Bohlin at Volvo designs the seatbelt used in almost every car today., article: seatbelts}
- {year: 1869, title: Railway air brake, text: George Westinghouse patents an air brake that works on every carriage at once., article: brakes}
- {year: 1676, title: Hooke's spring anagram, text: Robert Hooke publishes his law of springs as a scrambled set of letters., article: springs}
- {year: 1945, title: The Slinky goes on sale, text: Richard and Betty James demonstrate the Slinky in a Philadelphia store., article: springs}
- {year: 1610, title: Galileo sees Jupiter's moons, text: Through his home-made telescope Galileo spots four moons orbiting Jupiter., article: telescopes-make}
- {year: 1816, title: Kaleidoscope invented, text: Scottish scientist David Brewster invents and names the kaleidoscope., article: kaleidoscopes}
- {year: 1947, title: Holography invented, text: Dennis Gabor comes up with the idea of the hologram., article: holograms}
- {year: 1838, title: The stereoscope, text: Charles Wheatstone shows a different drawing to each eye to create depth., article: 3d-glasses}
- {year: 1984, title: India's first 3D film, text: The Malayalam film My Dear Kuttichathan opens in 3D., article: 3d-glasses}
- {year: 1889, title: Müller-Lyer illusion, text: Franz Müller-Lyer publishes his famous drawing of two equal lines., article: optical-illusions}
- {year: 1656, title: Gol Gumbaz completed, text: The great domed tomb of Muhammad Adil Shah is finished in Bijapur., article: echoes}
- {year: 1949, title: Oobleck gets its name, text: Dr. Seuss publishes Bartholomew and the Oobleck., article: non-newtonian}
