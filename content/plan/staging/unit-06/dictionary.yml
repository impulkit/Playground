- {id: biomagnification, word: biomagnification, meaning: "When a poison becomes more concentrated in animals at each step up a food chain.", see: bald-eagle}
- {id: cephalopod, word: cephalopod, meaning: "A sea animal with arms around its head, such as an octopus, squid or cuttlefish.", see: octopus-ink}
- {id: plankton, word: plankton, meaning: "Tiny plants and animals that drift in water, carried along by currents.", see: manta-rays}
- {id: filter-feeder, word: filter feeder, meaning: "An animal that eats by sieving tiny bits of food out of the water.", see: manta-rays}
- {id: echinoderm, word: echinoderm, meaning: "A spiny-skinned sea animal, such as a starfish, sea urchin or sea cucumber.", see: starfish}
- {id: keystone-species, word: keystone species, meaning: "A species that holds its whole community together, so that removing it changes everything around it.", see: starfish}
- {id: algae, word: algae, meaning: "Simple living things that make food from sunlight, from single cells to giant seaweeds.", see: kelp-forests}
- {id: pneumatophore, word: pneumatophore, meaning: "A breathing root that pokes up out of the mud, found on some mangrove trees.", see: mangroves}
- {id: gyre, word: gyre, meaning: "A huge, slowly circling system of ocean currents.", see: ocean-currents}
- {id: microplastic, word: microplastic, meaning: "A piece of plastic smaller than 5 mm, often from bigger plastic breaking apart.", see: ocean-plastic}
- {id: intertidal, word: intertidal, meaning: "The part of the shore that is underwater at high tide and uncovered at low tide.", see: tide-pools}
- {id: polyp, word: polyp, meaning: "A tiny, soft animal shaped like a tube with tentacles around its mouth, such as a coral.", see: great-barrier-reef}
- {id: ballast, word: ballast, meaning: "Weight, often water, carried by a ship or submarine to control how it sits or sinks in the water.", see: submarines}
