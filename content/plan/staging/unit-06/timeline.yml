- {year: 1782, title: Eagle on the Great Seal, text: The bald eagle appears on the Great Seal of the United States., article: bald-eagle}
- {year: 1972, title: USA bans DDT, text: "The pesticide that thinned eagle eggshells is banned, and eagles begin to recover.", article: bald-eagle}
- {year: 2007, title: Bald eagle recovers, text: The bald eagle is taken off the US endangered species list., article: bald-eagle}
- {year: 1944, title: Echolocation named, text: Donald Griffin names the way bats find things with echoes., article: echolocation}
- {year: 1783, title: First balloon flight with people, text: Two men float over Paris in a Montgolfier hot-air balloon., article: fly-without-wings}
- {year: 2013, title: Amur falcons tagged, text: Scientists fit satellite tags to Amur falcons in Nagaland., article: migration}
- {year: 1975, title: Monarch forests found, text: Scientists working with Fred Urquhart find the monarchs' winter forests in Mexico., article: monarch-migration}
- {year: 1963, title: Peacock named national bird, text: The Indian peafowl becomes India's national bird., article: peacock-tail}
- {year: 1930, title: Salt March, text: Gandhi walks to Dandi to make salt from seawater., article: why-sea-salty}
- {year: 1995, title: Rogue wave measured, text: A wave about 25.6 m tall is measured at the Draupner platform in the North Sea., article: waves-how}
- {year: 1770, title: Endeavour hits the reef, text: James Cook's ship runs aground on the Great Barrier Reef., article: great-barrier-reef}
- {year: 1981, title: Reef becomes World Heritage, text: The Great Barrier Reef is listed as a UNESCO World Heritage Site., article: great-barrier-reef}
- {year: 1912, title: Titanic sinks, text: The Titanic hits an iceberg and sinks on its first voyage., article: titanic}
- {year: 1985, title: Titanic wreck found, text: The wreck is found about 3.8 km deep in the North Atlantic., article: titanic}
- {year: 1775, title: The Turtle submarine, text: David Bushnell builds a one-person wooden submarine during the American Revolution., article: submarines}
- {year: 2022, title: India bans single-use plastics, text: Many single-use plastic items are banned across India., article: ocean-plastic}
- {year: 1822, title: Fresnel lens invented, text: Augustin-Jean Fresnel's ringed lens makes lighthouse beams far stronger., article: lighthouses}
- {year: 1716, title: Boston Light, text: The first lighthouse in what is now the USA is lit in Boston Harbor., article: lighthouses}
- {year: 1992, title: Bath toys lost at sea, text: Thousands of plastic toys spill into the Pacific and reveal how currents flow., article: ocean-currents}
- {year: 2004, title: Live giant squid photographed, text: Japanese scientists photograph a live giant squid in the deep for the first time., article: giant-squid}
- {year: 1960, title: Deepest dive, text: The Trieste carries two people to the bottom of the Challenger Deep., article: ocean-explorers}
- {year: 1977, title: Deep-sea vents discovered, text: Scientists in Alvin find hot springs full of life near the Galápagos., article: ocean-explorers}
- {year: 1971, title: Whale songs revealed, text: Scientists publish the first study showing humpback whales sing songs., article: whale-songs}
- {year: 1986, title: Whaling pause begins, text: A worldwide pause on commercial whaling comes into force., article: whale-songs}
