- {year: 1895, title: First paid film show, text: The Lumière brothers screen ten short films in Paris., article: hist-first-film}
- {year: 1896, title: Films reach India, text: Lumière films are shown at Watson's Hotel in Bombay., article: hist-first-film}
- {year: 1897, title: First car in India, text: A motor car arrives in Calcutta according to most accounts., article: hist-first-car-india}
- {year: 1899, title: Nairobi begins, text: A railway camp is set up beside a cool stream., article: world-nairobi}
- {year: 1911, title: First official airmail, text: Henri Pequet flies about 6500 letters from Allahabad to Naini., article: hist-first-flight-india}
