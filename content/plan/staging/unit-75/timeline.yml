- {year: -776, title: First Olympic Games, text: "By tradition, the Games at Olympia begin with a single sprint.", article: oddity-ancient-olympics-weird}
- {year: -591, title: Soldiers sign a pharaoh's leg, text: Greek soldiers carve their names on a statue at Abu Simbel., article: oddity-ancient-graffiti}
- {year: -303, title: Elephants for land, text: Chandragupta Maurya gives Seleucus about 500 war elephants., article: oddity-elephants-war}
- {year: -218, title: Hannibal crosses the Alps, text: About 37 elephants march with his army towards Rome., article: oddity-elephants-war}
- {year: 79, title: Pompeii buried, text: "Ash seals the town's snack bars, jars and wall scribbles.", article: oddity-ancient-fast-food}
- {year: 859, title: Al-Qarawiyyin founded, text: Fatima al-Fihri builds a mosque in Fez that grows into a university., article: hist-first-university}
- {year: 969, title: Cairo founded, text: The Fatimid rulers found the city of al-Qahira., article: world-cairo}
- {year: 985, title: Erik the Red settles Greenland, text: Norse farmers arrive on the island's green southern coast., article: world-greenland}
- {year: 1334, title: Ibn Battuta reaches Delhi, text: He describes the sultan's relay post of runners with bells., article: oddity-hindustani-mail}
- {year: 1652, title: Cape Town founded, text: The Dutch set up a supply station at the Cape., article: world-cape-town}
- {year: 1778, title: A warship hairstyle, text: A Paris hairstyle carries a model of the warship La Belle Poule., article: oddity-history-hair}
- {year: 1780, title: India's first newspaper, text: Hicky's Bengal Gazette is printed in Calcutta., article: hist-first-newspaper-india}
- {year: 1852, title: Scinde Dawk issued, text: The first postage stamp in Asia appears in Sindh., article: hist-first-stamp-india}
