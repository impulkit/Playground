- {year: 2008, title: Seed vault opens, text: The Svalbard Global Seed Vault opens in the Arctic., article: world-svalbard}
- {year: 2011, title: Floating Post Office named, text: The Dal Lake post office gets its present name., article: oddity-floating-post-office}
- {year: 2016, title: Philippine islands recounted, text: A mapping survey raises the count to 7641 islands., article: world-philippines}
- {year: 2025, title: Grand Egyptian Museum opens, text: All of Tutankhamun's treasures go on show together., article: world-cairo}
