- {year: -1250, title: Oracle bones, text: Shang priests carve the oldest known Chinese writing onto bones and shells., article: chinese-characters}
- {year: 450, title: Halmidi inscription, text: "A stone in Karnataka is carved with the oldest known Kannada words, by most estimates.", article: kannada-telugu}
- {year: 830, title: Oldest Malayalam inscription, text: The Vazhappally copper plate records a royal gift to a temple., article: malayalam}
- {year: 1066, title: The Norman Conquest, text: French-speaking rulers take over England and bring thousands of new words., article: latin-roots}
- {year: 1290, title: The Dnyaneshwari, text: Dnyaneshwar explains the Bhagavad Gita in Marathi verse for ordinary people., article: marathi-gujarati}
- {year: 1604, title: The Adi Granth, text: Guru Arjan Dev compiles the Sikh holy book in Gurmukhi., article: punjabi-gurmukhi}
- {year: 1727, title: Jaipur founded, text: Sawai Jai Singh II lays out a new city in neat rectangular blocks., article: urban-planning}
- {year: 1786, title: Sanskrit meets Latin, text: William Jones suggests Sanskrit and Latin share a lost common ancestor., article: latin-roots}
- {year: 1834, title: Indenture begins, text: Indian labourers start sailing to Mauritius under work contracts., article: indian-diaspora}
- {year: 1868, title: Little Women, text: Louisa May Alcott publishes the first part of the story of the March sisters., article: little-women}
- {year: 1887, title: Esperanto, text: L. L. Zamenhof publishes his invented language under the name Doktoro Esperanto., article: esperanto}
- {year: 1890, title: How the Other Half Lives, text: Jacob Riis photographs life in New York's crowded tenements., article: slums-housing}
- {year: 1894, title: The Jungle Book, text: Rudyard Kipling publishes his stories of Mowgli and the Seoni jungle., article: jungle-book}
- {year: 1923, title: Abol Tabol, text: Sukumar Ray's book of nonsense poems appears days after his death., article: sukumar-ray}
- {year: 1935, title: Malgudi appears, text: R. K. Narayan's first novel introduces the imaginary town of Malgudi., article: malgudi}
- {year: 1937, title: The Hobbit, text: J.R.R. Tolkien publishes the story of Bilbo Baggins., article: tolkien}
- {year: 1947, title: Chandamama begins, text: The children's magazine is launched in Madras in Telugu and Tamil., article: chandamama}
- {year: 1950, title: Into Narnia, text: The Lion the Witch and the Wardrobe is published., article: cs-lewis}
- {year: 1952, title: Language Movement, text: Students in Dhaka are killed while demanding Bengali as a state language., article: bengali-language}
- {year: 1952, title: Charlotte's Web, text: E. B. White's story of a pig and a spider is published., article: charlottes-web}
- {year: 1960, title: Two states born, text: Bombay State splits into Maharashtra and Gujarat along language lines., article: marathi-gujarati}
- {year: 1965, title: Feluda's first case, text: Satyajit Ray's detective appears in Sandesh magazine., article: satyajit-ray-stories}
- {year: 1978, title: A Contract with God, text: Will Eisner helps popularise the term graphic novel., article: graphic-novels}
- {year: 1980, title: Tinkle launched, text: Anant Pai starts a funny comics magazine full of readers' stories., article: tinkle}
- {year: 1986, title: Malgudi Days on TV, text: Shankar Nag's series of Narayan's stories airs on Doordarshan., article: malgudi}
- {year: 1988, title: Matilda, text: Roald Dahl publishes the story of a book-loving girl with special powers., article: matilda}
- {year: 1997, title: Harry Potter begins, text: Bloomsbury publishes the first Harry Potter book in London., article: harry-potter-effect}
- {year: 2005, title: The Lightning Thief, text: Rick Riordan's first Percy Jackson book is published., article: percy-jackson}
- {year: 2009, title: Silbo Gomero honoured, text: UNESCO recognises the whistled language of La Gomera., article: whistled-languages}
- {year: 2015, title: Global Goals agreed, text: All 193 UN member countries adopt the 17 Sustainable Development Goals., article: sustainable-goals}
- {year: 2015, title: Smart Cities Mission, text: India launches a plan to upgrade 100 cities with technology., article: smart-cities}
