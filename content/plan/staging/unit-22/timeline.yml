# Unit 22 timeline events
- {year: 1955, title: First Guinness book of records, text: The McWhirter twins publish the first edition in London., article: world-records}
- {year: 2009, title: "Bolt runs 9.58 seconds", text: Usain Bolt sets the men's 100 m world record in Berlin., article: world-records}
- {year: 1907, title: First Scout camp, text: Robert Baden-Powell camps with about 20 boys on Brownsea Island., article: scouts-guides}
- {year: 1950, title: Bharat Scouts and Guides formed, text: India's Scout and Guide groups join into one national body., article: scouts-guides}
- {year: 1951, title: You Said It begins, text: R.K. Laxman starts his daily cartoon in The Times of India., article: famous-cartoonists}
- {year: 1884, title: Switchback Railway opens, text: An early American roller coaster opens at Coney Island., article: theme-parks}
- {year: 1752, title: Oldest zoo still open, text: Tiergarten Schönbrunn opens in the palace gardens in Vienna., article: zoos-history}
- {year: 1855, title: India's first public zoo, text: A zoo opens in Madras (now Chennai)., article: zoos-history}
- {year: 1814, title: Indian Museum founded, text: India's oldest museum is set up in Calcutta., article: museums-fun}
- {year: 1846, title: Smithsonian founded, text: Congress founds the Smithsonian with James Smithson's gift., article: museums-fun}
- {ago: 3300000, title: Oldest known stone tools, text: Early humans in Kenya chip stones to make sharp edges., article: stone-age}
- {ago: 1000000, title: Fire in Wonderwerk Cave, text: Ash and burnt bone show fire in a South African cave., article: fire-discovery}
- {ago: 11500, title: Farming begins, text: People in the Fertile Crescent start growing wheat and barley., article: farming-began}
- {year: -7100, title: Çatalhöyük settled, text: A large town of mud-brick houses grows in what is now Turkey., article: first-cities}
- {year: -3200, title: Cuneiform writing, text: Officials in Mesopotamia press marks into clay to keep records., article: mesopotamia}
- {year: -1754, title: Laws of Hammurabi, text: The king of Babylon has about 280 laws carved on stone., article: mesopotamia}
- {year: -3100, title: Egypt united, text: Upper and Lower Egypt come under one king., article: ancient-egypt}
- {year: 1922, title: Tutankhamun's tomb found, text: Howard Carter's team finds the boy king's tomb in the Valley of the Kings., article: mummies}
- {year: 1799, title: Rosetta Stone found, text: French soldiers find the stone near Rashid in Egypt., article: hieroglyphs}
- {year: 1822, title: Hieroglyphs decoded, text: Jean-François Champollion announces how hieroglyphs work., article: hieroglyphs}
- {year: 868, title: Oldest dated printed book, text: The Diamond Sutra is printed from wooden blocks in China., article: ancient-china}
- {year: 105, title: Cai Lun's paper, text: A Chinese official presents an improved way of making paper., article: ancient-china}
- {year: -326, title: Alexander reaches Punjab, text: Alexander the Great fights King Porus near the Jhelum., article: ancient-greece}
- {year: -508, title: Democracy in Athens, text: Cleisthenes gives power to an assembly of citizens., article: democracy-athens}
- {year: -509, title: Roman Republic begins, text: Romans throw out their last king and elect consuls., article: ancient-rome}
- {year: 476, title: Western Roman Empire ends, text: The last western emperor is removed from power., article: ancient-rome}
- {year: -312, title: Via Appia begun, text: Work starts on the road from Rome to Capua., article: roman-roads}
- {year: 80, title: Colosseum opens, text: Emperor Titus opens the arena with 100 days of games., article: colosseum}
