- {year: 1902, title: The first teddy bears, text: "After a cartoon of President Roosevelt sparing a bear, a Brooklyn shop sells \"Teddy's bear\".", article: pop-teddy-bear}
- {year: 1928, title: Bubblegum is born, text: Walter Diemer makes Dubble Bubble in Philadelphia and colours it pink., article: food-why-bubblegum-pink}
- {year: 1959, title: Barbie launches, text: Barbie is first shown at a toy fair in New York., article: pop-barbie-dolls}
- {year: 1979, title: Volcanoes seen on Io, text: Voyager 1 images reveal the first active volcano beyond Earth., article: space-weird-volcano-moon}
- {year: 1303, title: First great siege of Chittorgarh, text: Alauddin Khalji captures the fort after a long siege., article: chittorgarh}
- {year: 1568, title: Akbar takes Chittorgarh, text: "After about four months, the fort falls and Mewar moves its capital to Udaipur.", article: chittorgarh}
- {year: 1518, title: Qutb Shahi kingdom founded, text: Sultan Quli makes Golconda the capital of a new kingdom., article: golconda}
- {year: 1687, title: Golconda falls, text: Aurangzeb captures Golconda after a siege of about eight months., article: golconda}
- {year: 2020, title: Atal Tunnel opens, text: A 9 km road tunnel under the Pir Panjal range opens near Manali., article: india-wonder-atal-tunnel}
- {year: 2025, title: Chenab Rail Bridge opens, text: The world's highest railway arch bridge opens in Jammu and Kashmir., article: india-wonder-chenab-bridge}
- {year: 1971, title: Door to Hell lit (perhaps), text: "By the most common account, gas at the Darvaza crater is set alight.", article: earth-weird-door-to-hell}
- {year: 1963, title: Conshelf II, text: Five men live for a month in Jacques Cousteau's base on the Red Sea floor., article: future-underwater-cities}
- {year: 2005, title: Geysers on Enceladus, text: The Cassini spacecraft spots water spraying from Saturn's moon Enceladus., article: space-weird-oceans-moons}
- {year: 2024, title: Europa Clipper launches, text: NASA's spacecraft sets off to study Europa's hidden ocean., article: space-weird-oceans-moons}
- {year: 1833, title: Ice reaches Calcutta, text: A ship from Boston delivers ice cut from New England lakes., article: how-fridges-cold}
- {year: 1992, title: Bath toys lost at sea, text: About 28,800 plastic bath toys fall into the Pacific and drift for years., article: pop-rubber-duck}
- {year: 1560, title: Children's Games painted, text: Pieter Bruegel paints about 80 children's games in one town square., article: life-games-playground}
- {year: 1930, title: Kerala Kalamandalam founded, text: A school to revive Kathakali is set up in Kerala., article: art-kathakali-makeup}
- {year: 1448, title: Victory Tower finished, text: Rana Kumbha completes the Vijay Stambh at Chittorgarh., article: chittorgarh}
- {year: 2023, title: Chandrayaan-3 lands, text: India's lander touches down near the Moon's south pole after about 40 days., article: maths-speed-time}
