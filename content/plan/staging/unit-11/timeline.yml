- {year: -7000, title: Ancient tooth drilling, text: "At Mehrgarh, people drilled holes in living people's teeth, perhaps the oldest dentistry known.", article: sugar-teeth}
- {year: -1600, title: Edwin Smith Papyrus, text: An Egyptian scribe copies a guide to treating 48 kinds of injury., article: doctors-history}
- {year: 1543, title: Vesalius's anatomy book, text: Andreas Vesalius publishes detailed drawings of the human body from his own dissections., article: doctors-history}
- {year: 1747, title: Lemons beat scurvy, text: James Lind shows that citrus fruit cures sick sailors on HMS Salisbury., article: vitamins}
- {year: 1796, title: First vaccine, text: Edward Jenner uses cowpox to protect a boy from smallpox., article: vaccines}
- {year: 1816, title: First stethoscope, text: René Laennec listens to a patient's heart through a rolled-up tube of paper., article: doctors-history}
- {year: 1822, title: A window into the stomach, text: "A gunshot accident in Michigan lets William Beaumont study digestion through a hole in a man's stomach.", article: stomach-digest}
- {year: 1846, title: Ether in surgery, text: William Morton shows in Boston that ether can put a patient to sleep during an operation., article: pain}
- {year: 1858, title: A handprint contract, text: William Herschel has a businessman in Bengal sign a contract with his handprint., article: fingerprints}
- {year: 1863, title: Red Cross founded, text: Henry Dunant's call for trained volunteers leads to the founding of the Red Cross., article: first-aid}
- {year: 1866, title: Mendel's peas, text: Gregor Mendel publishes the rules of inheritance he found in pea plants., article: genes-family}
- {year: 1873, title: Pollen blamed for hay fever, text: Charles Blackley shows that pollen causes hay fever., article: allergies}
- {year: 1882, title: Germ-eating cells seen, text: Ilya Mechnikov sees cells attacking a thorn inside a starfish larva., article: immune-system}
- {year: 1897, title: First fingerprint bureau, text: The world's first fingerprint bureau opens in Calcutta., article: fingerprints}
- {year: 1899, title: Aspirin goes on sale, text: A painkiller based on a substance from willow bark goes on sale., article: pain}
- {year: 1912, title: Vitamins named, text: Casimir Funk coins the word vitamine for substances the body needs in tiny amounts., article: vitamins}
- {year: 1915, title: Fight or flight, text: Walter Cannon describes the body's alarm response to danger., article: stress}
- {year: 1943, title: First artificial kidney, text: Willem Kolff builds a kidney machine from sausage casings in the Netherlands., article: kidneys}
- {year: 1945, title: Fluoride in tap water, text: "Grand Rapids, Michigan, becomes the first city to add fluoride to its water.", article: sugar-teeth}
- {year: 1953, title: Shape of DNA, text: Scientists work out that DNA is shaped like a twisted ladder., article: genes-family}
- {year: 1954, title: First organ transplant, text: A kidney from Ronald Herrick saves his identical twin brother Richard., article: kidneys}
- {year: 1995, title: First laughter club, text: Madan Kataria starts a laughter yoga club in a Mumbai park., article: laughter}
- {year: 2015, title: NASA twins study, text: Astronaut Scott Kelly begins nearly a year in space while his twin stays on Earth., article: twins}
