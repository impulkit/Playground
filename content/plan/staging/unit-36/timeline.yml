- {year: 1215, title: Magna Carta, text: "An English charter promises judgment by one's peers, an early root of trial by jury.", article: jury}
- {year: 1602, title: Shares for sale, text: The Dutch East India Company starts selling shares to the public in Amsterdam., article: stock-market}
- {year: 1670, title: Bushel's Case, text: An English court rules that jurors cannot be punished for their verdict., article: jury}
- {year: 1766, title: Sweden opens its records, text: Sweden passes one of the first freedom-of-information laws., article: right-to-information}
- {year: 1792, title: Buttonwood Agreement, text: Twenty-four brokers under a tree on Wall Street start what becomes the New York Stock Exchange., article: stock-market}
- {year: 1844, title: Rochdale Pioneers, text: Twenty-eight workers in England open a cooperative shop on Toad Lane., article: cooperatives}
- {year: 1848, title: Seneca Falls Convention, text: Campaigners in New York declare that men and women are created equal., article: womens-rights}
- {year: 1854, title: The Broad Street pump, text: John Snow maps cholera deaths in London and traces them to one water pump., article: public-health}
- {year: 1868, title: First traffic light, text: A gas-lit signal for horse carriages is set up outside Parliament in London., article: road-safety}
- {year: 1875, title: Bombay Stock Exchange, text: Brokers who met under a banyan tree form Asia's oldest stock exchange., article: stock-market}
- {year: 1883, title: Health insurance in Germany, text: Bismarck brings in compulsory health insurance for many workers., article: universal-healthcare}
- {year: 1889, title: Germany's old-age pensions, text: "Germany starts one of the first national pension systems, payable from age 70.", article: pensions-old-age}
- {year: 1890, title: The right to be let alone, text: Samuel Warren and Louis Brandeis publish their essay on privacy., article: privacy}
- {year: 1893, title: New Zealand women vote, text: New Zealand becomes the first self-governing country to give women the vote., article: womens-rights}
- {year: 1894, title: First minimum wage law, text: New Zealand passes the first national minimum wage law., article: minimum-wage}
- {year: 1917, title: I want YOU, text: James Montgomery Flagg's Uncle Sam poster helps recruit American soldiers., article: propaganda}
- {year: 1918, title: Ahmedabad mill strike, text: Gandhi fasts in support of striking textile workers., article: unions}
- {year: 1920, title: AITUC founded, text: "The All India Trade Union Congress is founded in Bombay, with Lala Lajpat Rai as president.", article: unions}
- {year: 1923, title: German hyperinflation, text: Prices in Germany double every few days and savings become worthless., article: inflation}
- {year: 1927, title: Mahad Satyagraha, text: B. R. Ambedkar leads thousands to drink from a public tank they had been barred from., article: caste-history}
- {year: 1935, title: Social Security Act, text: The USA sets up national old-age pensions during the Great Depression., article: pensions-old-age}
- {year: 1938, title: US minimum wage, text: "The Fair Labor Standards Act sets a minimum of 25 cents an hour and limits child labour.", article: minimum-wage}
- {year: 1941, title: First official TV advert, text: A ten-second Bulova watch advert airs in New York., article: advertising}
- {year: 1944, title: Bretton Woods, text: Delegates from 44 countries plan the IMF and the World Bank., article: world-bank-imf}
- {year: 1946, title: Kaira milk union, text: Gujarat dairy farmers register the cooperative that grows into Amul., article: amul}
- {year: 1948, title: NHS founded, text: Britain opens a health service free at the point of use., article: universal-healthcare}
- {year: 1948, title: Costa Rica abolishes its army, text: Costa Rica decides to live without a military., article: military}
- {year: 1948, title: First UN peacekeepers, text: Unarmed UN observers are sent to watch over a truce in the Middle East., article: peacekeepers}
- {year: 1950, title: Election Commission founded, text: "India's Election Commission is set up on 25 January, a day before the republic begins.", article: election-commission}
- {year: 1951, title: India's first general election, text: About 17 crore Indians become eligible to vote in an election lasting into 1952., article: democracy-india}
- {year: 1952, title: Parliament's two houses meet, text: The Lok Sabha and Rajya Sabha hold their first sittings., article: lok-sabha-rajya-sabha}
- {year: 1956, title: States redrawn by language, text: Many Indian state borders are redrawn so people can be governed in their own language., article: governors-states}
- {year: 1959, title: Lijjat Papad, text: Seven women in Mumbai borrow ₹80 and start a papad cooperative., article: cooperatives}
- {year: 1962, title: Consumer rights speech, text: President Kennedy lists four rights for every consumer., article: consumer-rights}
- {year: 1967, title: Sweden switches sides, text: Every driver in Sweden moves from the left side of the road to the right., article: road-safety}
- {year: 1969, title: Tinker v. Des Moines, text: The US Supreme Court rules that students keep free speech rights at school., article: free-speech}
- {year: 1970, title: Operation Flood, text: India launches a national programme to spread Amul-style milk cooperatives., article: amul}
- {year: 1973, title: Basic structure ruling, text: India's Supreme Court rules that Parliament cannot destroy the Constitution's basic structure., article: constitution-amendments}
- {year: 1976, title: Montreal Olympics, text: Montreal hosts the Games and takes about 30 years to pay off the debt., article: olympics-host}
- {year: 1980, title: Smallpox eradicated, text: The World Health Organization declares smallpox wiped out worldwide., article: public-health}
- {year: 1981, title: Infosys founded, text: Seven engineers start a software company in Pune with ₹10,000., article: startups-entrepreneurs}
- {year: 1982, title: First voting machines, text: Electronic voting machines are tried for the first time in Kerala., article: election-commission}
- {year: 1991, title: India's money crisis, text: India pledges gold and borrows from the IMF as it begins big economic reforms., article: world-bank-imf}
- {year: 1992, title: The 27th Amendment, text: A US amendment first proposed in 1789 is finally ratified after a student's campaign., article: constitution-amendments}
- {year: 1992, title: Indra Sawhney judgment, text: India's Supreme Court upholds reservation for Other Backward Classes with a 50% limit., article: reservation-india}
- {year: 1999, title: G20 founded, text: Finance ministers from the biggest economies begin meeting as the G20., article: g20}
- {year: 2005, title: Right to Information Act, text: Indian citizens gain the legal right to ask public offices for information., article: right-to-information}
- {year: 2007, title: All-women peacekeeping unit, text: India sends the first all-women formed police unit to a UN mission in Liberia., article: peacekeepers}
- {year: 2017, title: Privacy is a fundamental right, text: Nine judges of India's Supreme Court rule unanimously that privacy is protected., article: privacy}
- {year: 2023, title: G20 summit in New Delhi, text: The African Union joins the G20 as a permanent member., article: g20}
- {year: 2024, title: India's largest election, text: About 64 crore people vote in seven phases over 44 days., article: democracy-india}
