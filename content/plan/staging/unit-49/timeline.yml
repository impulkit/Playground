- {year: 954, title: Lakshmana temple finished, text: One of the earliest great temples at Khajuraho is completed by the Chandela kings., article: khajuraho}
- {year: 1838, title: Khajuraho reaches the wider world, text: Local guides lead British engineer T. S. Burt to the temples and he writes about them., article: khajuraho}
- {year: 1955, title: The Flash-Matic remote, text: "Zenith sells a wireless TV remote that works with a beam of visible light.", article: remote-control}
- {year: 1956, title: The Space Command clicker, text: Robert Adler's remote uses tiny ringing rods instead of batteries., article: remote-control}
- {year: -1750, title: Hammurabi's Babylon, text: King Hammurabi makes Babylon the capital of a large kingdom., article: babylon}
- {year: -539, title: Babylon falls to Persia, text: Cyrus the Great captures Babylon., article: babylon}
- {year: -1754, title: Hammurabi's laws carved, text: About 282 laws are carved on a black stone slab in Babylon., article: hammurabi}
- {year: 1901, title: Law stone found, text: French archaeologists dig up the Code of Hammurabi at Susa in Iran., article: hammurabi}
- {year: 2015, title: Soil Health Cards, text: India starts testing farm soils and telling farmers what nutrients they lack., article: smart-farming}
- {year: 2008, title: First Olympic boxing medal, text: Vijender Singh wins bronze for India at the Beijing Olympics., article: boxing-india}
- {year: 2012, title: Mary Kom's Olympic bronze, text: Mary Kom wins bronze at London 2012, the first Games with women's boxing., article: boxing-india}
- {year: 1887, title: Jamini Roy born, text: The painter is born in Beliatore village in Bankura district of Bengal., article: jamini-roy}
- {year: 868, title: Oldest dated printed book, text: A copy of the Diamond Sutra is printed in China from carved wooden blocks., article: buddhist-texts}
- {year: -29, title: Buddhist teachings written down, text: "Tradition says the Pali Canon is first written on palm leaves in Sri Lanka, around this time.", article: buddhist-texts}
- {year: 1920, title: The googol is named, text: Nine-year-old Milton Sirotta names a 1 followed by 100 zeros., article: large-numbers-names}
- {year: 2022, title: Ronna and quetta, text: The metric system adds prefixes for 27 and 30 zeros., article: large-numbers-names}
- {year: 2003, title: Rainwater harvesting rule, text: Tamil Nadu makes rainwater harvesting compulsory for buildings., article: groundwater}
- {year: 2011, title: Mumbaikars for SGNP, text: Scientists and residents start a project to help people live safely near Mumbai's leopards., article: leopards-cities}
- {year: 1054, title: A guest star, text: Chinese astronomers record a star explosion that left the Crab Nebula., article: nebulae}
- {year: 1995, title: Pillars of Creation, text: The Hubble Space Telescope photographs towers of gas in the Eagle Nebula., article: nebulae}
- {year: 1932, title: Indian Air Force founded, text: The Indian Air Force is set up on 8 October., article: indian-air-force}
- {year: 2025, title: MiG-21 retires, text: The Indian Air Force flies the MiG-21 for the last time after more than 60 years., article: indian-air-force}
- {year: 1856, title: Neanderthal bones found, text: Quarry workers find bones in the Neander Valley in Germany., article: neanderthals}
- {ago: 40000, title: Neanderthals disappear, text: The last Neanderthals die out in Europe and Asia., article: neanderthals}
- {year: -250, title: Ashoka's stupa at Sanchi, text: Emperor Ashoka begins a brick stupa on Sanchi hill., article: sanchi}
- {year: 1818, title: Sanchi rediscovered, text: A British officer comes across the ruins of the Sanchi stupas., article: sanchi}
- {year: 1908, title: Chlorine in city water, text: Jersey City becomes the first US city to chlorinate its water supply nonstop., article: water-tech}
- {year: 2014, title: Pro Kabaddi League begins, text: The first season starts in Mumbai on 26 July., article: kabaddi-league}
- {year: 2007, title: Indian mangoes reach the USA, text: The United States lifts its ban on mangoes from India., article: mango-varieties}
- {year: 1907, title: Thakurmar Jhuli, text: A collection of Bengali grandmothers' tales is printed., article: indian-folk-tales}
- {year: 1807, title: Laterite named, text: Francis Buchanan names laterite after the Latin word for brick., article: soil-types-india}
- {year: 1911, title: First landing on a ship, text: Eugene Ely lands a plane on the USS Pennsylvania in San Francisco Bay., article: aircraft-carriers}
- {year: 2022, title: INS Vikrant commissioned, text: India's first home-built aircraft carrier joins the navy on 2 September., article: aircraft-carriers}
- {year: 1981, title: Dinosaurs at Raiyoli, text: Geologists find dinosaur bones and eggs near Balasinor in Gujarat., article: fossils-india}
