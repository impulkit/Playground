# Unit 23 new dictionary words
- {id: edict, word: edict, meaning: "An official order or announcement from a ruler. Emperor Ashoka had his edicts carved on rocks and pillars.", see: ashoka}
- {id: dynasty, word: dynasty, meaning: "A family of rulers in which power passes from parents to children, often for many generations.", see: mughals}
- {id: stupa, word: stupa, meaning: "A dome-shaped Buddhist monument, often built over holy relics such as ashes or belongings of the Buddha.", see: buddha}
- {id: ahimsa, word: ahimsa, meaning: "A Sanskrit word for not harming any living being. It is central to Jainism, Buddhism and Hinduism, and to Gandhi's methods.", see: mahavira}
- {id: caravan, word: caravan, meaning: "A group of traders and their animals, such as camels, travelling together for safety on a long journey.", see: silk-road}
- {id: sepoy, word: sepoy, meaning: "An Indian soldier serving in an army run by Europeans, especially the East India Company. It comes from the Persian word sipahi, meaning soldier.", see: revolt-1857}
- {id: granite, word: granite, meaning: "A hard, speckled rock that forms when hot melted rock cools slowly deep underground.", see: hampi}
- {id: satyagraha, word: satyagraha, meaning: "Gandhi's word for resisting injustice without violence. It means holding firmly to truth.", see: gandhi}
- {id: feudalism, word: feudalism, meaning: "A way of organising society in medieval times: lords gave land to followers, who in return fought for them or worked for them.", see: knights-castles}
- {id: monopoly, word: monopoly, meaning: "The sole right to sell something or trade somewhere, with no one else allowed to compete.", see: east-india-company}
- {id: circumnavigation, word: circumnavigation, meaning: "A journey all the way around something, especially around the whole Earth.", see: magellan}
