- {id: axis, word: axis, meaning: "An imaginary line through the middle of a spinning object, which it turns around. Earth's axis runs through the North and South Poles.", see: north-star}
- {id: microgravity, word: microgravity, meaning: "The floating feeling inside a spacecraft that is falling freely around Earth. Gravity is still there, but everything falls together.", see: space-station}
- {id: thrust, word: thrust, meaning: "The push that moves a rocket or jet forward, made by forcing gas out of the back very fast.", see: rockets-how}
- {id: radiation, word: radiation, meaning: "Energy that travels as rays or tiny fast particles. Some kinds, like strong ultraviolet or particles from the Sun, can harm living things.", see: spacesuits}
