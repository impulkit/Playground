- {ago: 521000000, title: First trilobites, text: Trilobites with crystal eyes appear in the seas., article: trilobites}
- {ago: 400000000, title: First ammonites, text: Spiral-shelled relatives of squid start floating in the seas., article: ammonites}
- {ago: 252000000, title: The Great Dying, text: Eruptions in Siberia trigger the worst extinction in Earth's history., article: great-dying}
- {ago: 95000000, title: Argentinosaurus, text: Perhaps the heaviest land animal ever walks across Patagonia., article: argentinosaurus}
- {ago: 75000000, title: Velociraptor, text: Turkey-sized feathered hunters roam the Gobi., article: velociraptor-real}
- {ago: 68000000, title: Triceratops, text: Three-horned plant-eaters share North America with T. rex., article: triceratops-horns}
- {ago: 10000, title: Ice age giants vanish, text: "Smilodon, giant ground sloths and mammoths disappear from the Americas.", article: sabre-tooth}
- {year: 1598, title: Dutch sailors reach Mauritius, text: Europeans see the dodo for the first time., article: dodo}
- {year: 1662, title: Last reliable dodo sighting, text: Within decades the dodo is gone for good., article: dodo}
- {year: 1797, title: Jefferson's great claw, text: Thomas Jefferson describes claws later shown to belong to a giant ground sloth., article: giant-sloths}
- {year: 1802, title: Footprints on a farm, text: Pliny Moody ploughs up three-toed dinosaur tracks in Massachusetts., article: dino-feet-tracks}
- {year: 1811, title: Mary Anning's sea dragon, text: Mary and Joseph Anning begin uncovering an ichthyosaur at Lyme Regis., article: mary-anning}
- {year: 1823, title: First complete plesiosaur, text: Mary Anning finds a long-necked sea reptile., article: mary-anning}
- {year: 1824, title: First dinosaur named, text: William Buckland names Megalosaurus., article: dino-names}
- {year: 1842, title: The word 'dinosaur', text: Richard Owen invents the name Dinosauria., article: dino-names}
- {year: 1877, title: Como Bluff, text: Railway workers tell O.C. Marsh about giant bones in Wyoming., article: bone-wars}
- {year: 1889, title: Triceratops named, text: Marsh names Triceratops after first mistaking its horns for a bison's., article: triceratops-horns}
- {year: 1923, title: Velociraptor found, text: An American expedition digs up the first Velociraptor skull in Mongolia., article: velociraptor-real}
- {year: 1938, title: The Glen Rose trackway, text: Roland T. Bird studies giant dinosaur tracks along the Paluxy River in Texas., article: dino-feet-tracks}
- {year: 1971, title: The fighting dinosaurs, text: A Velociraptor and Protoceratops are found locked in battle., article: velociraptor-real}
- {year: 1975, title: Barapasaurus named, text: India's 'big-leg lizard' is named in honour of Rabindranath Tagore., article: barapasaurus}
- {year: 1978, title: Egg Mountain, text: Nests of baby Maiasaura are found in Montana., article: dino-babies}
- {year: 1987, title: A giant bone in Patagonia, text: A rancher finds the first bone of Argentinosaurus., article: argentinosaurus}
