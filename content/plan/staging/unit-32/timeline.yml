- {year: 1791, title: Haitian Revolution begins, text: Enslaved people in Saint-Domingue rise up against French planters., article: haitian-revolution}
- {year: 1804, title: Haiti declares independence, text: Jean-Jacques Dessalines founds Haiti on 1 January., article: haitian-revolution}
- {year: 1819, title: Bolívar crosses the Andes, text: Victory at Boyacá frees what is now Colombia., article: simon-bolivar}
- {year: 1853, title: Black ships reach Japan, text: Commodore Perry's warships force Japan to open its ports., article: meiji-japan}
- {year: 1868, title: Meiji Restoration, text: Japan's emperor is restored and Edo becomes Tokyo., article: meiji-japan}
- {year: 1839, title: First Opium War begins, text: Britain goes to war after China destroys smuggled opium., article: opium-wars}
- {year: 1842, title: Treaty of Nanjing, text: China hands Hong Kong Island to Britain., article: opium-wars}
- {year: 1912, title: China's last emperor steps down, text: Six-year-old Puyi gives up the throne and China becomes a republic., article: chinese-revolution}
- {year: 1949, title: People's Republic of China founded, text: Mao Zedong announces the new state from Tiananmen., article: chinese-revolution}
- {year: 1929, title: Wall Street Crash, text: Share prices in New York collapse in late October., article: great-depression}
- {year: 1933, title: The New Deal begins, text: "Franklin D. Roosevelt launches programmes to fight the Depression.", article: great-depression}
- {year: 1938, title: Kristallnacht, text: Synagogues and Jewish shops are attacked across Germany and Austria., article: holocaust}
- {year: 1945, title: Auschwitz freed, text: Soviet troops free the camp on 27 January., article: holocaust}
- {year: 1893, title: Gandhi thrown off a train, text: At Pietermaritzburg Gandhi decides to fight colour prejudice., article: gandhi-south-africa}
