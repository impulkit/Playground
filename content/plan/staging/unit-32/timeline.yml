- {year: 1955, title: Bandung Conference, text: Leaders of 29 Asian and African countries meet in Indonesia., article: decolonisation}
- {year: 1948, title: Apartheid becomes law, text: South Africa's new government begins strict racial separation., article: apartheid}
- {year: 1994, title: South Africa's first free election, text: "People of all races vote, and Mandela becomes president.", article: apartheid}
- {year: 1962, title: Katherine Johnson checks Glenn's flight, text: John Glenn orbits Earth after Johnson confirms the numbers by hand., article: moon-race-women}
- {year: 1804, title: Lewis and Clark set off, text: The Corps of Discovery heads up the Missouri River., article: lewis-clark}
- {year: 1805, title: Lewis and Clark reach the Pacific, text: The expedition sees the ocean in November., article: lewis-clark}
- {year: 1848, title: Gold found at Sutter's Mill, text: James Marshall's find starts the California Gold Rush., article: gold-rush}
- {year: 1869, title: Golden spike, text: America's coast-to-coast railroad is joined in Utah., article: transcontinental-railroad}
