- {year: 1838, title: Trail of Tears, text: The Cherokee are forced to leave their homeland in the Southeast., article: native-nations}
- {year: 1620, title: Mayflower crosses the Atlantic, text: 102 passengers sail from England to Cape Cod., article: pilgrims-mayflower}
- {year: 1861, title: American Civil War begins, text: Confederate guns fire on Fort Sumter in April., article: us-civil-war}
- {year: 1865, title: Civil War ends, text: Lee surrenders at Appomattox and slavery is abolished that year., article: us-civil-war}
- {year: 1925, title: The New Negro published, text: Alain Locke's collection gives voice to the Harlem Renaissance., article: harlem-renaissance}
- {year: 1236, title: Razia becomes sultan, text: Razia takes the throne of the Delhi Sultanate., article: womens-history-india}
