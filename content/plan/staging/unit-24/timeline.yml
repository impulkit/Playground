- {year: 1941, title: Bose escapes, text: Subhas Chandra Bose slips out of house arrest in Calcutta in disguise., article: subhas-bose}
- {year: 1943, title: Azad Hind government, text: Bose sets up a Provisional Government of Free India in Singapore., article: subhas-bose}
- {year: 1929, title: Purna Swaraj, text: "At Lahore, Nehru leads Congress in demanding complete independence.", article: nehru}
- {year: 1947, title: Tryst with Destiny, text: Nehru speaks to the nation at midnight as India becomes free., article: nehru}
- {year: 1927, title: Mahad Satyagraha, text: Ambedkar leads thousands to drink from a public tank they were barred from., article: ambedkar}
- {year: 1956, title: Ambedkar becomes Buddhist, text: "In Nagpur, Ambedkar and hundreds of thousands of followers embrace Buddhism.", article: ambedkar}
- {year: 1928, title: Bardoli Satyagraha, text: Farmers' victory in Bardoli earns Vallabhbhai Patel the title Sardar., article: sardar-patel}
- {year: 1948, title: Hyderabad joins India, text: Hyderabad becomes part of India after a short military operation., article: sardar-patel}
- {year: 1905, title: The Golden Threshold, text: Sarojini Naidu's first book of poems is published in London., article: sarojini-naidu}
- {year: 1925, title: Naidu leads Congress, text: Sarojini Naidu becomes the first Indian woman president of the Congress., article: sarojini-naidu}
- {year: 1947, title: Partition, text: British India is divided into India and Pakistan., article: partition}
- {year: 2017, title: Partition Museum opens, text: A museum of Partition memories opens in Amritsar's old Town Hall., article: partition}
- {year: 1773, title: Boston Tea Party, text: Protesters dump 342 chests of East India Company tea into Boston Harbor., article: american-revolution}
- {year: 1776, title: Declaration of Independence, text: Thirteen American colonies declare themselves independent of Britain., article: american-revolution}
- {year: 1776, title: Crossing the Delaware, text: Washington's army crosses an icy river on Christmas night to attack Trenton., article: george-washington}
- {year: 1789, title: First US president, text: George Washington is sworn in as the first President of the United States., article: george-washington}
- {year: 1863, title: Gettysburg Address, text: Lincoln gives a two-minute speech that becomes one of history's most famous., article: abraham-lincoln}
- {year: 1865, title: Lincoln killed, text: Abraham Lincoln is shot at Ford's Theatre and dies the next morning., article: abraham-lincoln}
- {year: 1619, title: Enslaved Africans reach Virginia, text: About 20 enslaved Africans arrive in the English colony of Virginia., article: slavery-freedom}
- {year: 1865, title: Slavery abolished in the USA, text: The 13th Amendment makes slavery illegal across the United States., article: slavery-freedom}
- {year: 1954, title: Brown v. Board of Education, text: The US Supreme Court rules that segregated schools are unconstitutional., article: civil-rights}
- {year: 1964, title: Civil Rights Act, text: A US law bans segregation in public places and unfair treatment at work., article: civil-rights}
- {year: 1959, title: King visits India, text: Martin Luther King Jr. spends about a month in India learning about Gandhi's methods., article: martin-luther-king}
- {year: 1963, title: I Have a Dream, text: King speaks to about 2.5 lakh people at the March on Washington., article: martin-luther-king}
- {year: 1955, title: Rosa Parks arrested, text: Rosa Parks refuses to give up her bus seat in Montgomery and is arrested., article: rosa-parks}
- {year: 1849, title: Tubman escapes, text: Harriet Tubman escapes slavery in Maryland and reaches Philadelphia., article: harriet-tubman}
- {year: 1863, title: Combahee River Raid, text: Tubman helps lead a Union raid that frees more than 700 people., article: harriet-tubman}
- {year: 2018, title: Statue of Unity opens, text: The world's tallest statue is unveiled on the Narmada river in Gujarat., article: statue-of-unity}
- {year: 1771, title: Cromford Mill, text: Richard Arkwright opens a water-powered cotton mill in Derbyshire., article: industrial-revolution}
- {year: 1914, title: First World War begins, text: War breaks out in Europe after an assassination in Sarajevo., article: world-war-one}
- {year: 1918, title: Armistice, text: Fighting in the First World War stops at 11 a.m. on 11 November., article: world-war-one}
- {year: 1939, title: Second World War begins, text: Germany invades Poland and Britain and France declare war., article: world-war-two}
- {year: 1944, title: Battles of Imphal and Kohima, text: Allied troops in northeast India stop the Japanese advance., article: world-war-two}
- {year: 1945, title: United Nations founded, text: The UN Charter comes into force with 51 founding members., article: united-nations}
- {year: 1948, title: Universal Declaration of Human Rights, text: The UN adopts a list of rights belonging to every human being., article: united-nations}
- {year: 1962, title: Cuban Missile Crisis, text: The USA and the Soviet Union come close to nuclear war over missiles in Cuba., article: cold-war}
- {year: 1991, title: Soviet Union breaks up, text: The Soviet Union splits into 15 countries and the Cold War ends., article: cold-war}
- {year: 1957, title: Sputnik launched, text: The Soviet Union launches the first artificial satellite., article: space-race}
- {year: 1963, title: India's first rocket, text: A small rocket lifts off from Thumba near Thiruvananthapuram., article: space-race}
- {year: 1961, title: Berlin Wall built, text: Barbed wire goes up overnight to cut Berlin in two., article: berlin-wall}
- {year: 1989, title: Berlin Wall opens, text: Crowds cross freely as the border gates in Berlin are opened., article: berlin-wall}
- {year: 1990, title: Mandela freed, text: Nelson Mandela walks out of prison after 27 years., article: nelson-mandela}
- {year: 1994, title: South Africa votes, text: South Africans of all races vote together for the first time., article: nelson-mandela}
- {year: 1893, title: New Zealand women vote, text: New Zealand becomes the first self-governing country to give women the vote., article: womens-vote}
- {year: 1920, title: 19th Amendment, text: Women win the right to vote across the United States., article: womens-vote}
- {year: 1966, title: Mexican wheat arrives, text: India imports about 18000 tonnes of high-yielding wheat seed., article: green-revolution}
- {year: 1946, title: Amul cooperative founded, text: Dairy farmers in Kaira district form their own cooperative in Anand., article: white-revolution}
- {year: 1970, title: Operation Flood, text: India launches a national programme to link village dairies to cities., article: white-revolution}
- {year: 1861, title: Archaeological Survey of India, text: India's national archaeology department is founded., article: archaeology}
- {year: 1974, title: Terracotta Army found, text: Farmers digging a well in China find clay soldiers of an emperor's army., article: archaeology}
- {year: 1837, title: Brahmi script read, text: James Prinsep works out how to read the script of Ashoka's edicts., article: history-sources}
- {year: 1822, title: Hieroglyphs decoded, text: Champollion announces he can read Egyptian hieroglyphs., article: history-sources}
- {year: 1911, title: Machu Picchu made famous, text: Local guides lead Hiram Bingham to the Inca ruins of Machu Picchu., article: lost-cities}
- {year: 79, title: Vesuvius erupts, text: Ash and hot gas bury the Roman towns of Pompeii and Herculaneum., article: pompeii}
- {year: 1748, title: Digging at Pompeii begins, text: Excavators start uncovering the buried Roman town., article: pompeii}
- {year: -300, title: Library of Alexandria founded, text: Egypt's Ptolemy kings begin collecting books from across the world., article: great-libraries}
- {year: 1911, title: South Pole reached, text: Roald Amundsen's Norwegian team reaches the South Pole first., article: explorers-poles}
- {year: 1983, title: Dakshin Gangotri, text: India sets up its first research station in Antarctica., article: explorers-poles}
- {year: 1953, title: Everest climbed, text: Edmund Hillary and Tenzing Norgay reach the summit of Mount Everest., article: everest-first}
- {year: 1984, title: Bachendri Pal on Everest, text: Bachendri Pal becomes the first Indian woman to climb Everest., article: everest-first}
- {year: 2005, title: Right to Information Act, text: Indian citizens gain the right to ask government offices for information., article: government-how}
