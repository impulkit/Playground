- {ago: 4000000000, title: Acasta Gneiss forms, text: The oldest widely accepted whole rock on Earth forms in what is now northern Canada., article: rocks-oldest}
- {ago: 335000000, title: Pangaea comes together, text: Almost all of Earth's land joins into one supercontinent., article: pangaea}
- {ago: 200000000, title: Pangaea starts to split, text: A crack between North America and Africa begins to open the Atlantic., article: pangaea}
- {year: 499, title: Aryabhatiya written, text: "Aged 23, Aryabhata writes that the Earth spins on its axis.", article: astronomy-ancient-india}
- {year: 628, title: Brahmagupta's great book, text: Brahmagupta's astronomy book includes the earliest known rules for zero., article: astronomy-ancient-india}
- {year: 1610, title: Europa discovered, text: Galileo spots four moons circling Jupiter for the first time., article: europa}
- {year: 1645, title: The Sun goes quiet, text: Sunspots almost disappear for about 70 years in the Maunder Minimum., article: sunspots}
- {year: 1655, title: Titan discovered, text: Christiaan Huygens finds Saturn's largest moon., article: titan}
- {year: 1704, title: Newton's Opticks, text: Isaac Newton describes the changing colours of soap films., article: soap-bubbles-colours}
- {year: 1724, title: Delhi's Jantar Mantar, text: Jai Singh II builds a stone observatory in Delhi., article: jantar-mantar}
- {year: 1734, title: Jaipur's Jantar Mantar completed, text: The largest of Jai Singh's stone observatories is finished in Jaipur., article: jantar-mantar}
- {year: 1801, title: Ceres discovered, text: "Giuseppe Piazzi finds Ceres, now known as a dwarf planet.", article: dwarf-planets}
- {year: 1843, title: The sunspot cycle, text: Heinrich Schwabe notices that sunspot numbers rise and fall over about a decade., article: sunspots}
- {year: 1848, title: A candle's chemistry, text: Michael Faraday gives his Christmas lectures on the candle in London., article: candles}
- {year: 1850, title: Pigeon news service, text: Paul Julius Reuter uses pigeons to carry news between Aachen and Brussels., article: pigeons-homing}
- {year: 1904, title: Gilbert Walker in India, text: Walker takes charge of India's weather service and starts hunting for monsoon clues., article: el-nino}
- {year: 1912, title: Continental drift proposed, text: Alfred Wegener argues that the continents were once joined., article: continental-drift}
- {year: 1913, title: Death Valley's record, text: "Furnace Creek records 56.7 °C, the official world record, though some doubt it.", article: weather-records}
- {year: 1918, title: Cher Ami's flight, text: A wounded pigeon carries a message that helps save about 190 trapped soldiers., article: pigeons-homing}
- {year: 1923, title: First modern planetarium, text: The Zeiss star projector is tested on a factory roof in Jena., article: planetariums}
- {year: 1930, title: Adler Planetarium opens, text: Chicago gets the first planetarium in the Americas., article: planetariums}
- {year: 1952, title: London's Great Smog, text: Coal smoke and fog smother London for about five days., article: fog-smog}
- {year: 1958, title: Solar wind predicted, text: Eugene Parker works out that the Sun blows a steady wind into space., article: solar-wind}
- {year: 1958, title: Indira Gandhi Canal begins, text: Work starts on a canal to carry Himalayan river water into the Thar Desert., article: thar-formed}
- {year: 1966, title: First soft Moon landing, text: The Soviet Luna 9 lands gently and sends back pictures., article: moon-landing-sites}
- {year: 1967, title: Outer Space Treaty, text: Countries agree that nobody can claim the Moon or asteroids as territory., article: asteroid-mining}
- {year: 1974, title: Lucy found, text: Scientists in Ethiopia's Rift Valley find a 3.2-million-year-old skeleton., article: great-rift-valley}
- {year: 1983, title: Coldest temperature, text: Vostok Station in Antarctica records −89.2 °C., article: weather-records}
- {year: 1992, title: Kuiper Belt confirmed, text: David Jewitt and Jane Luu find the first Kuiper Belt object after Pluto., article: kuiper-belt}
- {year: 1999, title: Odisha super cyclone, text: "A super cyclone strikes Odisha and kills about 10,000 people.", article: cyclones-india}
- {year: 2003, title: Purple frog described, text: Scientists describe the underground purple frog of the Western Ghats., article: western-ghats}
- {year: 2005, title: Huygens lands on Titan, text: A European probe parachutes onto Saturn's moon Titan., article: titan}
- {year: 2005, title: Afar crack opens, text: The ground in Ethiopia splits along about 60 km in roughly ten days., article: great-rift-valley}
- {year: 2006, title: Dwarf planets defined, text: Astronomers vote on a new category that includes Pluto and Ceres., article: dwarf-planets}
- {year: 2009, title: Water on the Moon, text: Results from Chandrayaan-1 and LCROSS confirm water on the Moon., article: moon-water}
- {year: 2012, title: Western Ghats protected, text: UNESCO names the Western Ghats a World Heritage Site., article: western-ghats}
- {year: 2013, title: Cyclone Phailin, text: About a million people are moved to safety before Phailin hits Odisha., article: cyclones-india}
- {year: 2013, title: Ahmedabad heat action plan, text: Ahmedabad launches one of South Asia's first plans to protect people from heat., article: heatwaves}
- {year: 2015, title: AstroSat launched, text: India launches its first space observatory built for astronomy., article: space-telescopes-india}
- {year: 2015, title: Solar-powered airport, text: Kochi's airport begins running entirely on solar power., article: renewable-energy}
- {year: 2016, title: India's hottest day, text: Phalodi in Rajasthan reaches 51.0 °C., article: heatwaves}
- {year: 2019, title: Landing on the far side, text: China's Chang'e 4 makes the first landing on the Moon's far side., article: moon-landing-sites}
- {year: 2019, title: Arrokoth flyby, text: New Horizons flies past the most distant object ever visited., article: kuiper-belt}
- {year: 2021, title: Oxygen made on Mars, text: NASA's MOXIE experiment makes oxygen from Martian air., article: mars-colonies}
- {year: 2022, title: India's first dark sky reserve, text: Hanle in Ladakh is declared a dark sky reserve., article: stargazing}
- {year: 2023, title: Asteroid sample lands, text: NASA's OSIRIS-REx drops off about 120 g of asteroid Bennu., article: asteroid-mining}
- {year: 2024, title: Europa Clipper launched, text: NASA sends its largest planetary spacecraft towards Jupiter's icy moon., article: europa}
