- {year: -1208, title: Israel named in stone, text: An Egyptian stele carved for Pharaoh Merneptah mentions a people called Israel., article: ancient-israel}
- {year: -722, title: Assyria conquers Israel, text: The northern kingdom of Israel falls to the Assyrian empire., article: ancient-israel}
- {year: -814, title: Carthage founded, text: "By tradition, Phoenicians from Tyre found Carthage in North Africa.", article: phoenicians}
- {year: -800, title: Greeks borrow an alphabet, text: Greeks adapt Phoenician letters and add vowels., article: phoenicians}
- {year: -551, title: Confucius born, text: "By tradition, Confucius is born in the state of Lu, China.", article: confucius}
- {year: -399, title: Trial of Socrates, text: An Athenian jury sentences Socrates to death., article: socrates}
- {year: 1199, title: Qutub Minar begun, text: Work starts on the tower in the 1190s under Qutb ud-din Aibak., article: qutub-minar}
- {year: 1368, title: Lightning hits Qutub Minar, text: Firoz Shah Tughlaq repairs the top and adds a fifth storey., article: qutub-minar}
- {year: 1373, title: Hitopadesha manuscript, text: The oldest dated copy of the Hitopadesha is made in Nepal., article: hitopadesha}
- {year: 1648, title: Red Fort completed, text: Shah Jahan's new palace-fortress in Delhi is finished., article: red-fort}
- {year: 1787, title: Hitopadesha in English, text: Charles Wilkins publishes an English translation., article: hitopadesha}
- {year: 1859, title: Living fossils named, text: Charles Darwin uses the phrase living fossil in On the Origin of Species., article: living-fossils}
- {year: 1891, title: Maha Bodhi Society, text: Anagarika Dharmapala starts a campaign to restore Bodh Gaya., article: bodh-gaya}
- {year: 1925, title: Modern loudspeaker, text: Rice and Kellogg develop the moving-coil loudspeaker., article: loudspeakers}
- {year: 1938, title: Coelacanth found alive, text: A fish thought extinct for 66 million years turns up in South Africa., article: living-fossils}
- {year: 1947, title: Flag at the Red Fort, text: Jawaharlal Nehru raises the tricolour at the Red Fort on 16 August., article: red-fort}
- {year: 1951, title: First Asian Games, text: New Delhi hosts the first Asian Games., article: asian-games}
- {year: 1960, title: First weather satellite, text: The USA launches TIROS-1., article: weather-satellites}
- {year: 1985, title: Vikram aur Betaal on TV, text: Doordarshan airs the Vikram aur Betaal serial., article: vikram-betal}
- {year: 2002, title: Bodh Gaya on UNESCO list, text: The Mahabodhi Temple Complex becomes a World Heritage Site., article: bodh-gaya}
- {year: 2013, title: Cyclone Phailin, text: Satellite warnings help move close to a million people to safety., article: weather-satellites}
- {year: 2015, title: International Solar Alliance, text: India and France launch the alliance at the Paris climate talks., article: solar-india}
- {year: 2020, title: Online Chess Olympiad, text: India and Russia share gold at the first Online Chess Olympiad., article: chess-online}
- {year: 2024, title: Gukesh world champion, text: "D. Gukesh of Chennai wins the world chess title at 18.", article: chess-online}
- {year: 2025, title: DIGIPIN launched, text: India Post gives every 4-metre square of India a code., article: maps-grids}
- {year: 2025, title: Indian aquanauts dive deep, text: Two Indians reach about 4 and 5 km down in a French submersible., article: ocean-exploration-india}
- {year: 2026, title: Asian Games in Japan, text: "Aichi-Nagoya hosts the Games, and India wins 85 medals.", article: asian-games}
- {year: 2026, title: Voyager one light-day away, text: Voyager 1 reaches about one light-day from Earth., article: space-distances}
