- {year: 1790, title: First US census, text: US marshals count about 3.9 million people in the new country., article: census}
- {year: 1881, title: India's first full census, text: India is counted all at once for the first time., article: census}
- {year: 1890, title: Punched-card census, text: "Herman Hollerith's machines tally the US census, far faster than by hand.", article: census}
- {year: 1010, title: Brihadisvara Temple completed, text: Chola king Rajaraja I finishes a temple carved with dance poses., article: bharatanatyam}
- {year: 1936, title: Kalakshetra founded, text: Rukmini Devi Arundale opens a school for dance and music in Chennai., article: bharatanatyam}
- {year: 1930, title: Kerala Kalamandalam founded, text: The poet Vallathol sets up a school to teach Kathakali., article: indian-classical-dance}
- {year: 1920, title: Raman studies Indian drums, text: C.V. Raman shows why the tabla and mridangam ring with musical notes., article: tabla}
- {year: 1700, title: The piano is invented, text: Bartolomeo Cristofori builds a keyboard with hammers in Florence., article: piano}
- {year: 1501, title: First printed music book, text: Ottaviano Petrucci prints music with movable type in Venice., article: music-notes}
- {year: 1815, title: Metronome patented, text: Johann Maelzel patents a ticking machine to keep musical time., article: rhythm-beat}
- {year: 1917, title: First jazz record, text: Jazz is recorded for the first time and spreads across the USA., article: jazz}
- {year: 1973, title: Hip-hop's birthday party, text: DJ Kool Herc plays a back-to-school party in the Bronx., article: hip-hop}
- {year: 1954, title: Elvis at Sun Records, text: Elvis Presley makes his first records in Memphis., article: rock-music}
- {year: 1931, title: Alam Ara, text: India's first talking film arrives with seven songs., article: bollywood-music}
- {year: 1992, title: Roja, text: A.R. Rahman's first film soundtrack becomes a huge hit., article: ar-rahman}
- {year: 2009, title: Two Oscars for Rahman, text: A.R. Rahman wins two Academy Awards for Slumdog Millionaire., article: ar-rahman}
- {year: 1949, title: Aayega Aanewala, text: Lata Mangeshkar's song in the film Mahal makes her a star., article: lata-mangeshkar}
- {year: 1971, title: Concert for Bangladesh, text: Ravi Shankar and George Harrison raise money for refugees in New York., article: ravi-shankar}
- {year: 1756, title: Mozart is born, text: Wolfgang Amadeus Mozart is born in Salzburg., article: mozart}
- {year: 1824, title: Beethoven's Ninth Symphony, text: The almost deaf Beethoven's last symphony is first performed in Vienna., article: beethoven}
- {year: 1934, title: Bihar earthquake reveals paintings, text: Damaged homes expose Madhubani wall paintings to outside eyes., article: madhubani}
- {year: 1999, title: Honeycomb conjecture proved, text: Thomas Hales proves hexagons divide a surface using the least wall., article: honeycomb}
- {year: 1885, title: First snowflake photograph, text: Wilson Bentley photographs a single snowflake in Vermont., article: snowflake-six}
- {year: 1997, title: Deep Blue beats Kasparov, text: An IBM computer defeats the world chess champion in a match., article: chess-india}
- {year: 2024, title: Gukesh becomes world champion, text: India's D. Gukesh becomes the youngest undisputed world chess champion., article: chess-india}
- {year: 1703, title: Leibniz on binary, text: Gottfried Leibniz publishes a paper on counting with 0 and 1., article: binary-code}
- {year: 1932, title: Enigma first broken, text: Polish mathematicians break an early version of the Enigma cipher., article: cipher-codes}
- {year: 1202, title: Liber Abaci, text: Fibonacci's book brings Indian numerals and his famous sequence to Europe., article: fibonacci-nature}
- {year: 1875, title: India Meteorological Department founded, text: India sets up a national weather service., article: chance-weather}
- {year: 1935, title: Reserve Bank of India founded, text: India's central bank begins issuing and managing money., article: money-worth}
