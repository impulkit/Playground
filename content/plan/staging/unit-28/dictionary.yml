- {id: savanna, word: savanna, meaning: "A wide, warm grassland with scattered trees, where it is rainy for part of the year and dry for the rest.", see: kenya-safari}
- {id: marsupial, word: marsupial, meaning: "A mammal whose babies are born very small and finish growing in a pouch on the mother's belly, like a kangaroo.", see: australia}
- {id: permafrost, word: permafrost, meaning: "Ground that stays frozen all year round, for at least two years in a row.", see: cold-places}
- {id: archipelago, word: archipelago, meaning: "A group or chain of islands close together.", see: greece-islands}
- {id: caldera, word: caldera, meaning: "A huge bowl-shaped hollow left when the top of a volcano collapses after an eruption.", see: greece-islands}
- {id: geothermal, word: geothermal, meaning: "Heat that comes from deep inside the Earth, which people can use to warm homes or make electricity.", see: iceland}
- {id: meridian, word: meridian, meaning: "An imaginary line on a map running from the North Pole to the South Pole.", see: time-zones}
- {id: enclave, word: enclave, meaning: "A piece of one country that is completely surrounded by another country.", see: border-crossings}
- {id: customs, word: customs, meaning: "The officials at a border who check what goods people bring into a country, and collect any tax on them.", see: border-crossings}
- {id: delta, word: delta, meaning: "Flat land at the mouth of a river, built from mud and sand the river drops as it reaches the sea.", see: bangladesh}
- {id: apartheid, word: apartheid, meaning: "A system of laws in South Africa from 1948 to the early 1990s that kept people apart and unequal because of their race.", see: south-africa}
- {id: indigenous, word: indigenous, meaning: "Belonging to the first peoples known to have lived in a place, before settlers arrived from elsewhere.", see: canada}
