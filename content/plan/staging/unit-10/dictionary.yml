- {id: retina, word: retina, meaning: "The thin layer at the back of the eye with cells that sense light.", see: eyes-see}
- {id: haemoglobin, word: haemoglobin, meaning: "The iron-containing protein in red blood cells that carries oxygen and makes blood red.", see: blood}
- {id: antigen, word: antigen, meaning: "A marker on the surface of a cell or germ that the body's defences can recognise.", see: blood-groups}
- {id: melanin, word: melanin, meaning: "The dark pigment that gives colour to skin, hair and eyes.", see: skin}
- {id: fulcrum, word: fulcrum, meaning: "The fixed point that a lever turns on, like the middle of a seesaw.", see: lever-lift}
- {id: molecule, word: molecule, meaning: "Two or more atoms joined together. A water molecule is two hydrogen atoms and one oxygen atom.", see: why-ice-floats}
- {id: electron, word: electron, meaning: "A tiny particle with a negative electric charge, found in every atom. Moving electrons make electric current.", see: electricity-made}
