- {id: neuron, word: neuron, meaning: "A nerve cell. Neurons carry messages around the brain and body as tiny electrical signals.", see: brain-works}
- {id: hormone, word: hormone, meaning: "A chemical messenger that travels in the blood and tells parts of the body what to do.", see: sleep-why}
- {id: follicle, word: follicle, meaning: "A tiny pocket in the skin that a hair grows out of.", see: hair-grow}
- {id: keratin, word: keratin, meaning: "A tough protein that makes up hair, nails, claws, hooves and horns.", see: nails}
- {id: enamel, word: enamel, meaning: "The hard, shiny outer coat of a tooth. It is the hardest substance in the human body.", see: teeth}
- {id: receptor, word: receptor, meaning: "A part of a cell that catches a particular chemical or signal, like a lock that fits only certain keys.", see: nose-smell}
