- {year: 1881, title: A detector for a president, text: Alexander Graham Bell builds an early metal detector to find a bullet in President Garfield., article: metal-detectors}
- {year: 2009, title: The Staffordshire Hoard, text: A hobby metal detector finds thousands of pieces of Anglo-Saxon gold in England., article: metal-detectors}
- {year: 1952, title: Barcode patented, text: Joseph Woodland and Bernard Silver patent the barcode idea., article: barcodes}
- {year: 1974, title: First barcode scan, text: A pack of chewing gum is scanned at a supermarket in Troy in Ohio., article: barcodes}
- {year: 1877, title: Sound played back, text: "Edison's phonograph records and plays back a voice for the first time.", article: sound-recording}
- {year: 1902, title: Gauhar Jaan records, text: One of the first Indian singers is recorded in Calcutta., article: sound-recording}
- {year: 1883, title: Krakatoa's red skies, text: Dust from the Krakatoa eruption turns sunsets red around the world., article: colour-of-sky-sunset}
- {year: 1953, title: REM sleep discovered, text: Researchers in Chicago find the sleep stage linked to vivid dreams., article: dreams}
- {year: 1885, title: The forgetting curve, text: Hermann Ebbinghaus measures how fast we forget., article: memory}
- {year: 1895, title: X-rays reveal bones, text: Wilhelm Röntgen photographs the bones inside a living hand., article: bones}
- {year: 1901, title: Blood groups found, text: Karl Landsteiner discovers the ABO blood groups., article: blood-groups}
- {year: 1952, title: Bombay blood group, text: Doctors in Mumbai discover a very rare blood group., article: blood-groups}
- {year: 1628, title: Blood goes round, text: William Harvey shows that the heart pumps blood in a loop., article: blood}
- {year: 1665, title: Cells named, text: Robert Hooke sees tiny boxes in cork and calls them cells., article: body-cells}
- {year: 1971, title: Hammer and feather, text: An astronaut on the Moon shows that both fall at the same speed., article: gravity-fall}
- {year: 1816, title: The stethoscope, text: René Laennec listens to a heartbeat through a rolled-up paper tube., article: heart-beat}
- {year: 1858, title: Cable under the Atlantic, text: The first telegraph cable joins Europe and North America for a few weeks., article: internet-how}
- {year: 1897, title: Power from Darjeeling's streams, text: A small hydroelectric station starts up at Sidrapong near Darjeeling., article: electricity-made}
- {year: 1882, title: Pearl Street Station, text: One of the first public power stations opens in New York., article: electricity-made}
- {year: 1847, title: Wash your hands, text: Ignaz Semmelweis shows that handwashing saves mothers' lives., article: soap-germs}
- {year: 1947, title: Faster than sound, text: Chuck Yeager flies the Bell X-1 past the speed of sound., article: sound-travel}
- {year: 1912, title: Titanic sinks, text: The Titanic strikes an iceberg in the North Atlantic., article: why-ice-floats}
- {year: 2014, title: Blue LED Nobel Prize, text: Three Japanese scientists win the Nobel Prize for bright blue LEDs., article: light-bulb}
- {year: 1817, title: The running machine, text: Karl Drais builds a two-wheeled machine pushed along by the rider's feet., article: bicycle-balance}
- {year: -250, title: The law of the lever, text: Archimedes writes down how levers balance., article: lever-lift}
- {year: 1798, title: Colour blindness described, text: John Dalton's paper on his own colour vision is published., article: eyes-colour}
- {year: 1984, title: DNA fingerprinting, text: Alec Jeffreys finds a way to identify people from their DNA., article: dna}
