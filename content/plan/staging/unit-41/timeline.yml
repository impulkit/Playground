- {year: -1800, title: Babylonian triangle numbers, text: A clay tablet lists number sets that fit the Pythagorean rule., article: pythagoras}
- {year: -1750, title: Hammurabi limits interest, text: Babylon's law code sets the highest interest a lender may charge., article: money-interest-loans}
- {year: -700, title: Baudhayana's rope geometry, text: "A Sulba Sutra for building fire altars states the triangle rule (date uncertain).", article: baudhayana}
- {year: 628, title: Brahmagupta's zero, text: Brahmagupta writes rules for calculating with zero and negative numbers., article: zero-to-computers}
- {year: 820, title: Al-Khwarizmi's al-jabr, text: A Baghdad scholar's book on solving problems gives algebra its name., article: algebra}
- {year: 876, title: Zero carved at Gwalior, text: A temple inscription in Gwalior shows a round zero in the number 270., article: zero-to-computers}
- {year: 1435, title: Rules of perspective, text: Alberti's book On Painting explains how to make flat pictures look deep., article: maths-art}
- {year: 1557, title: The equals sign, text: Robert Recorde introduces two parallel lines to mean is equal to., article: equations}
- {year: 1686, title: France bans Indian chintz, text: France bans imported Indian printed cottons to protect its own weavers., article: kalamkari}
- {year: 1840, title: Harmonium patented, text: Alexandre Debain patents the harmonium in Paris., article: harmonium}
- {year: 1854, title: Boole's Laws of Thought, text: George Boole shows that reasoning can be written as algebra., article: logic}
- {year: 1875, title: Hand-pumped harmonium, text: Dwarkanath Ghose of Kolkata builds a small harmonium played sitting on the floor., article: harmonium}
- {year: 1880, title: Venn diagrams, text: John Venn publishes his overlapping-circle diagrams., article: sets-venn}
- {year: 1914, title: Sorting the world's instruments, text: Hornbostel and Sachs publish their system for classifying musical instruments., article: music-instruments-families}
- {year: 1939, title: Fallingwater completed, text: Frank Lloyd Wright's house over a waterfall is finished in Pennsylvania., article: frank-lloyd-wright}
- {year: 1944, title: Game theory begins, text: Von Neumann and Morgenstern publish Theory of Games and Economic Behavior., article: game-theory}
- {year: 1947, title: Shehnai at the Red Fort, text: Bismillah Khan plays as India becomes independent., article: shehnai-bismillah}
- {year: 1948, title: Bradman's last innings, text: Don Bradman is out for a duck and finishes with a Test average of 99.94., article: cricket-stats}
- {year: 1951, title: Le Corbusier plans Chandigarh, text: Le Corbusier takes over the design of Punjab's new capital., article: chandigarh}
- {year: 1959, title: Guggenheim Museum opens, text: Wright's spiral museum opens in New York six months after his death., article: frank-lloyd-wright}
- {year: 1963, title: Gandhi Smarak Sangrahalaya, text: Charles Correa's museum opens at Sabarmati Ashram in Ahmedabad., article: indian-architecture-modern}
- {year: 1975, title: Rock Garden found, text: Officials discover Nek Chand's secret garden of recycled sculptures in Chandigarh., article: chandigarh}
- {year: 1997, title: Duckworth–Lewis arrives, text: A formula for rain-shortened cricket matches is first used internationally., article: maths-sport}
- {year: 2001, title: Bharat Ratna for Bismillah Khan, text: The shehnai master receives India's highest civilian award., article: shehnai-bismillah}
- {year: 2004, title: Hadid wins the Pritzker, text: Zaha Hadid becomes the first woman to win architecture's top prize., article: zaha-hadid}
- {year: 2018, title: Doshi wins the Pritzker, text: Balkrishna Doshi becomes the first Indian to win the Pritzker Prize., article: indian-architecture-modern}
