- {year: -490, title: Battle of Marathon, text: Athens defeats a Persian army on the plain of Marathon., article: running-marathon}
- {year: 1789, title: Shakuntala in English, text: William Jones publishes Kalidasa's play in English in Calcutta., article: kalidasa}
- {year: 1829, title: Sati banned, text: Bengal's government bans sati after years of campaigning by Ram Mohan Roy., article: bengali-renaissance}
- {year: 1856, title: Widow remarriage law, text: "Pushed by Vidyasagar, a law allows Hindu widows to remarry.", article: bengali-renaissance}
- {year: 1863, title: Football's rules written, text: The Football Association writes one set of rules in London., article: football-world}
- {year: 1877, title: First Test match, text: Australia beat England by 45 runs in Melbourne., article: test-cricket}
- {year: 1877, title: First Wimbledon, text: A croquet club in London holds a lawn tennis tournament., article: tennis}
- {year: 1886, title: Kural in English, text: G. U. Pope publishes a full English translation of the Thirukkural., article: thirukkural}
- {year: 1891, title: Basketball invented, text: James Naismith nails two peach baskets to a balcony in Springfield., article: basketball}
- {year: 1902, title: The teddy bear, text: A New York shop sells the first "Teddy's bear"., article: toys-history}
- {year: 1908, title: Marathon distance set, text: The London Olympic marathon measures 42.195 km., article: running-marathon}
- {year: 1911, title: Barefoot victory, text: Mohun Bagan win the IFA Shield against a British army team., article: football-world}
- {year: 1914, title: Kho-kho rules, text: The Deccan Gymkhana in Pune writes the first kho-kho rules., article: kho-kho}
- {year: 1928, title: India's first hockey gold, text: India win Olympic hockey gold in Amsterdam without conceding a goal., article: hockey-india}
- {year: 1930, title: First World Cup, text: Uruguay host and win the first FIFA World Cup., article: fifa-world-cup}
- {year: 1932, title: India's first Test, text: India play their first Test match at Lord's., article: test-cricket}
- {year: 1942, title: Anne begins her diary, text: Anne Frank receives a diary for her 13th birthday and soon goes into hiding., article: anne-frank}
- {year: 1942, title: Navajo code created, text: The first 29 Navajo Marines build an unbreakable code., article: code-talkers}
- {year: 1947, title: Anne Frank's diary published, text: The diary is printed in Dutch as Het Achterhuis., article: anne-frank}
- {year: 1948, title: Stoke Mandeville Games, text: Sixteen wheelchair athletes compete in archery in England., article: paralympics}
- {year: 1958, title: LEGO brick patented, text: The stud-and-tube brick is patented in Denmark., article: lego}
- {year: 1960, title: First Paralympics, text: About 400 athletes compete in Rome., article: paralympics}
- {year: 1973, title: First Women's World Cup, text: "England host and win the first cricket World Cup, two years before the men's.", article: womens-cricket}
- {year: 1978, title: The ollie, text: Alan Gelfand invents the skateboard trick named after him., article: skateboarding}
- {year: 1983, title: India win the World Cup, text: Kapil Dev's team beat the West Indies at Lord's., article: cricket-world-cups}
- {year: 1989, title: Sachin's debut, text: Sachin Tendulkar plays his first Test aged 16., article: sachin-tendulkar}
- {year: 2000, title: Thiruvalluvar Statue, text: A 133-foot statue of the poet is unveiled at Kanyakumari., article: thirukkural}
- {year: 2008, title: First IPL, text: The Indian Premier League's first match is played in Bengaluru., article: ipl}
- {year: 2008, title: Bindra's gold, text: Abhinav Bindra wins India's first individual Olympic gold., article: olympics-india}
- {year: 2011, title: World Cup at the Wankhede, text: India beat Sri Lanka in Mumbai to win the World Cup., article: cricket-world-cups}
- {year: 2021, title: Neeraj Chopra's gold, text: India win their first Olympic gold in athletics., article: olympics-india}
- {year: 2024, title: Gukesh world champion, text: D. Gukesh becomes the youngest undisputed world chess champion., article: chess-champions}
- {year: 2025, title: First Kho Kho World Cup, text: India win both titles in New Delhi., article: kho-kho}
