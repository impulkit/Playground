- {year: -2560, title: The Great Pyramid rises, text: Egyptian builders finish a tomb about 146 metres tall for Khufu., article: extreme-tallest-structures}
- {year: 1736, title: Euler solves the bridges, text: Leonhard Euler proves the Königsberg bridge walk is impossible., article: puzzle-konigsberg}
- {year: 1860, title: Oldest recorded voice, text: A French inventor scratches a singing voice onto sooty paper., article: behind-music-recording}
- {year: 1866, title: A 14-hour flock, text: A huge flock of passenger pigeons passes over southern Ontario., article: lost-passenger-pigeon}
- {year: 1872, title: Mary Celeste found empty, text: Sailors find the Mary Celeste drifting with nobody on board., article: mystery-mary-celeste}
- {year: 1877, title: Edison's phonograph, text: Thomas Edison records and plays back a voice for the first time., article: behind-music-recording}
- {year: 1883, title: Tower of Hanoi invented, text: Édouard Lucas sells his puzzle with a made-up temple legend., article: puzzle-tower-hanoi}
- {year: 1914, title: The last passenger pigeon, text: Martha dies at Cincinnati Zoo and her species is gone., article: lost-passenger-pigeon}
- {year: 1936, title: The last known thylacine, text: The last known Tasmanian tiger dies in a Hobart zoo., article: lost-thylacine}
- {year: 1951, title: Superglue rediscovered, text: Two chemists glue a costly instrument shut and see a new use., article: accident-superglue}
- {year: 1956, title: Play-Doh goes on sale, text: A wallpaper cleaner is sold as a modelling toy for children., article: accident-play-dough}
- {year: 1968, title: The Fosbury Flop wins gold, text: Dick Fosbury goes over the bar backwards at the Mexico City Olympics., article: sport-science-high-jump}
