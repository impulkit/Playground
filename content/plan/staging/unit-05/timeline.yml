- {year: 1930, title: Chandrasekhar's voyage, text: On a ship from India to England a young student works out how heavy a dead star can be., article: black-holes}
- {year: 1758, title: Halley's Comet returns, text: The comet comes back exactly as Edmond Halley predicted., article: comets}
- {year: 2014, title: Philae lands on a comet, text: A European lander touches down on comet 67P., article: comets}
- {year: 1838, title: First distance to a star, text: Friedrich Bessel measures how far away the star 61 Cygni is., article: light-years}
- {year: 1997, title: First Mars rover, text: NASA's small Sojourner rover starts exploring Mars., article: mars-rovers}
- {year: 2015, title: Blue sunset on Mars, text: The Curiosity rover photographs a blue Martian sunset., article: mars-sky}
- {year: 1959, title: Far side of the Moon seen, text: The Soviet spacecraft Luna 3 photographs the side of the Moon we never see., article: moon-phases}
- {year: 2015, title: New Horizons reaches Pluto, text: A NASA spacecraft finds a giant heart-shaped plain of ice., article: pluto}
- {year: 1833, title: The great Leonid storm, text: Meteors fill the sky over North America., article: shooting-stars}
- {year: 1054, title: A new star in daylight, text: Chinese astronomers record the supernova that made the Crab Nebula., article: stars-born}
- {year: 1859, title: The Carrington storm, text: A giant solar storm makes telegraph wires spark., article: sun-what}
- {year: 2023, title: Aditya-L1 launches, text: India sends its first spacecraft to study the Sun., article: sun-what}
- {year: 1932, title: India's first airmail flight, text: J.R.D. Tata flies mail from Karachi to Bombay., article: airplanes-fly}
- {year: 2001, title: Vulture breeding begins, text: India's first vulture breeding centre opens at Pinjore in Haryana., article: vultures-india}
- {year: 2006, title: Diclofenac banned for animals, text: India bans the cattle painkiller that was killing its vultures., article: vultures-india}
- {year: 1977, title: Alex the parrot, text: Irene Pepperberg begins her long study of an African grey parrot., article: parrots-talk}
- {year: 1957, title: The plastic flamingo, text: Don Featherstone designs the pink plastic garden flamingo., article: flamingos-pink}
- {year: 2015, title: Thane Creek Flamingo Sanctuary, text: Part of Mumbai's Thane Creek is protected for flamingos., article: flamingos-pink}
- {year: 2017, title: Glass-coated manja banned, text: India's National Green Tribunal bans kite string that injures birds., article: kites-birds}
- {year: 1851, title: Sparrows reach America, text: House sparrows are released in Brooklyn and later spread across the USA., article: sparrows}
- {year: 2010, title: First World Sparrow Day, text: People start marking 20 March as a day for the house sparrow., article: sparrows}
- {year: 1939, title: Sikorsky's VS-300, text: The first practical single-rotor helicopter flies in the USA., article: helicopters}
- {year: 2005, title: Helicopter lands on Everest, text: A test pilot touches down on the summit of Mount Everest., article: helicopters}
- {year: 1783, title: First people fly, text: Two men float across Paris in a Montgolfier hot-air balloon., article: hot-air-balloons}
- {year: 1999, title: Balloon flies around the world, text: Bertrand Piccard and Brian Jones circle the globe without stopping., article: hot-air-balloons}
- {year: 2022, title: A thousand drones over Delhi, text: Computer-controlled drones light up the Beating Retreat ceremony., article: drones}
- {year: 1901, title: Radio crosses the Atlantic, text: Marconi uses a kite-lifted aerial to catch a signal from England., article: kite-flying}
- {year: 1926, title: Jet stream measured, text: Wasaburo Oishi publishes his balloon measurements of fast winds high above Japan., article: jet-streams}
- {year: 1802, title: Clouds get their names, text: Luke Howard gives clouds the Latin names still used today., article: clouds-types}
- {year: 2017, title: A new cloud, text: Asperitas joins the official International Cloud Atlas., article: clouds-types}
- {year: 2018, title: Dinosaurs laid coloured eggs, text: Scientists find egg pigments in fossil dinosaur eggshells., article: bird-eggs-colours}
- {year: 2022, title: Paper plane distance record, text: A South Korean team flies a paper plane more than 77 m., article: paper-planes}
