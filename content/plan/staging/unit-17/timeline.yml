- {year: 1010, title: Big Temple of Thanjavur, text: Rajaraja Chola I completes the Brihadeeswarar temple., article: architecture-temples}
- {year: 1250, title: Konark Sun Temple, text: King Narasimhadeva I builds a stone chariot for the Sun god in Odisha., article: konark}
- {year: 1163, title: Notre-Dame begun, text: Work starts on Notre-Dame cathedral in Paris., article: gothic-cathedrals}
- {year: 1880, title: Cologne Cathedral finished, text: "Started in 1248, the cathedral is finally completed.", article: gothic-cathedrals}
- {year: 1508, title: Sistine ceiling begun, text: Michelangelo starts painting the Sistine Chapel ceiling in Rome., article: michelangelo}
- {year: 1503, title: Mona Lisa begun, text: Leonardo da Vinci starts painting Lisa Gherardini in Florence., article: mona-lisa}
- {year: 1911, title: Mona Lisa stolen, text: A handyman walks out of the Louvre with the painting under his smock., article: mona-lisa}
- {year: 1452, title: Leonardo born, text: Leonardo da Vinci is born near Vinci in Tuscany., article: leonardo}
- {year: 1874, title: First Impressionist show, text: A group of rebel painters hold their own exhibition in Paris., article: impressionism}
- {year: 1889, title: The Starry Night, text: Vincent van Gogh paints his swirling night sky at Saint-Rémy., article: van-gogh}
- {year: 1937, title: Guernica, text: Picasso paints his giant protest against the bombing of a Spanish town., article: picasso}
- {year: 1939, title: Louvre buys a Kahlo, text: The Frame becomes the first work by a 20th-century Mexican artist in the Louvre., article: frida-kahlo}
- {year: 1894, title: Ravi Varma's press, text: Raja Ravi Varma opens a press to print pictures of gods for ordinary homes., article: raja-ravi-varma}
- {year: 1933, title: Sher-Gil wins in Paris, text: Amrita Sher-Gil's Young Girls wins a gold medal at the Paris Salon., article: amrita-sher-gil}
- {year: 1947, title: Progressive Artists' Group, text: "Husain, Souza and Raza form a group to make art for a new India.", article: mf-husain}
- {year: 1917, title: Hunt for a charkha, text: Gangaben Majmudar finds spinning wheels in Vijapur for Gandhi., article: khadi}
- {year: 1804, title: Jacquard loom, text: Joseph-Marie Jacquard controls weaving patterns with punched cards., article: weaving-saree}
- {year: 1721, title: Britain bans calico, text: A British law bans wearing most printed Indian cotton., article: textiles-india}
- {year: 868, title: Diamond Sutra printed, text: The oldest dated printed book is made with woodblocks in China., article: block-printing}
- {year: 1889, title: Eiffel Tower opens, text: The tower opens for the World's Fair in Paris., article: eiffel-tower}
- {year: 1919, title: Bauhaus founded, text: Walter Gropius opens a new school of design in Germany., article: modern-architecture}
- {year: 1826, title: Oldest surviving photo, text: Nicéphore Niépce captures the view from his window in France., article: photography-art}
- {year: 1938, title: Superman appears, text: The first Superman story launches the superhero comic book., article: comics-art}
- {year: 1967, title: Amar Chitra Katha, text: Anant Pai begins retelling Indian stories as comics., article: comics-art}
- {year: 1599, title: The Globe opens, text: Shakespeare's company builds the Globe Theatre in London., article: theatre}
- {year: 1969, title: Sesame Street, text: Jim Henson's Muppets help teach letters to children on TV., article: puppetry}
- {year: 79, title: Pompeii buried, text: Volcanic ash preserves thousands of scribbles on Pompeii's walls., article: street-art}
- {year: 1961, title: National Institute of Design, text: India's first national design school opens in Ahmedabad., article: design-everyday}
- {year: 2010, title: The rupee gets a symbol, text: D. Udaya Kumar's ₹ is chosen in a national competition., article: design-everyday}
- {year: 1917, title: Duchamp's Fountain, text: Marcel Duchamp sends a shop-bought urinal to an art show., article: modern-art}
