# Unit 21 timeline events
- {year: 1768, title: The modern circus begins, text: Philip Astley performs riding tricks in a ring in London., article: circus}
- {year: 1776, title: American independence, text: "On 4 July, Congress approves the Declaration of Independence.", article: independence-days}
- {year: 1843, title: First Christmas cards, text: Henry Cole has about a thousand cards printed in London., article: christmas}
- {year: 1856, title: First synthetic dye, text: "William Perkin, aged 18, makes mauve by accident.", article: fashion-history}
- {year: 1863, title: Thanksgiving goes national, text: Abraham Lincoln declares a national day of thanksgiving., article: thanksgiving}
- {year: 1873, title: Riveted jeans patented, text: Jacob Davis and Levi Strauss patent riveted work trousers., article: jeans}
- {year: 1893, title: Ganeshotsav goes public, text: Bal Gangadhar Tilak promotes public Ganesh celebrations in Maharashtra., article: ganesh-chaturthi}
- {year: 1902, title: A Trip to the Moon, text: Georges Méliès lands a rocket in the Moon's eye., article: special-effects}
- {year: 1908, title: Fantasmagorie, text: Émile Cohl makes one of the first fully animated cartoons., article: cartoons-history}
- {year: 1913, title: India's first feature film, text: Dadasaheb Phalke releases Raja Harishchandra in Bombay., article: bollywood}
- {year: 1920, title: Radio goes on air, text: KDKA in Pittsburgh begins regular broadcasting with election results., article: radio-shows}
- {year: 1923, title: The Hollywood sign, text: Giant letters reading HOLLYWOODLAND go up to advertise houses., article: hollywood}
- {year: 1927, title: Madras Music Season begins, text: The first December music conference is held in Madras., article: festivals-music}
- {year: 1931, title: India's first talkie, text: Alam Ara brings sound to Indian cinema., article: bollywood}
- {year: 1938, title: Superman appears, text: Action Comics 1 introduces the first big comic superhero., article: superheroes-history}
- {year: 1947, title: India becomes independent, text: British rule in India ends at midnight on 15 August., article: independence-days}
- {year: 1948, title: Adidas and Puma split, text: The Dassler brothers divide their shoe company in two., article: sneakers}
- {year: 1952, title: Binaca Geetmala begins, text: Radio Ceylon starts its weekly countdown of Hindi film songs., article: radio-shows}
- {year: 1955, title: Pather Panchali released, text: Satyajit Ray's first film tells the story of young Apu., article: satyajit-ray}
- {year: 1958, title: Billboard Hot 100 begins, text: America's best-known song chart starts ranking hits., article: music-charts}
- {year: 1963, title: Astro Boy on TV, text: Osamu Tezuka's robot boy becomes a weekly anime series., article: manga-anime}
- {year: 1967, title: Amar Chitra Katha begins, text: Anant Pai starts a comic series of Indian stories., article: comics-india}
- {year: 1969, title: Woodstock, text: About 400000 people gather for a music festival in New York State., article: festivals-music}
- {year: 1987, title: Ramayan on Doordarshan, text: Sunday mornings empty the streets as India watches the epic., article: tv-shows-india}
- {year: 1995, title: Toy Story, text: The first fully computer-animated feature film is released., article: animation-studios}
- {year: 2004, title: The word podcast, text: A Guardian article suggests the name podcasting., article: podcasts}
- {year: 2005, title: First YouTube video, text: Me at the zoo is uploaded on 23 April., article: youtube}
- {year: 2008, title: Spotify launches, text: A Swedish music streaming service opens to listeners., article: streaming}
- {year: 2017, title: Nylon manja banned, text: India's National Green Tribunal bans synthetic kite string., article: kites-festival}
- {year: 2021, title: Durga Puja honoured, text: UNESCO lists Durga Puja in Kolkata as intangible cultural heritage., article: durga-puja}
- {year: 2023, title: Naatu Naatu wins an Oscar, text: A song from the Telugu film RRR wins Best Original Song., article: cinema-south}
