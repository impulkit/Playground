- {year: 1946, title: US school lunch law, text: President Truman signs the National School Lunch Act., article: mid-day-meal}
- {year: 2015, title: Peanut study results, text: "The LEAP study shows early peanut foods can prevent many peanut allergies.", article: food-allergies}
