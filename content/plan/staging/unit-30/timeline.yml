- {year: 1912, title: Browning reaction described, text: Louis-Camille Maillard reports how sugars and proteins brown when heated., article: cooking-science}
- {year: 1843, title: An early baking powder, text: English chemist Alfred Bird mixes a yeast-free raising powder., article: baking}
- {year: 1676, title: First microbes seen, text: Antonie van Leeuwenhoek describes tiny living things in a drop of water., article: fermentation}
- {year: 1810, title: Food in sealed jars, text: Nicolas Appert publishes his method for keeping food in sealed bottles., article: food-preserve}
- {year: 1833, title: Ice sails to India, text: A ship of New England ice reaches Calcutta after about four months at sea., article: food-preserve}
- {year: 2023, title: Year of Millets, text: The United Nations marks the International Year of Millets after India proposed it., article: millets}
- {year: 2016, title: Year of Pulses, text: The United Nations celebrates the International Year of Pulses., article: pulses-dal}
- {year: 1908, title: Umami named, text: Kikunae Ikeda names the savoury fifth taste., article: taste-why}
- {year: 1912, title: Scoville scale, text: Wilbur Scoville invents a way to rank how hot chillies are., article: spicy-hot}
- {year: 2021, title: Nobel for heat sensors, text: David Julius shares a Nobel Prize partly for using chilli to find a heat sensor in nerves., article: spicy-hot}
- {year: 1995, title: National mid-day meals, text: India launches a national school meal programme on Independence Day., article: mid-day-meal}
