- {year: 2001, title: Wikipedia launches, text: Jimmy Wales and Larry Sanger start an encyclopedia anyone can edit., article: wikipedia-how}
- {year: 1866, title: A lasting Atlantic cable, text: The steamship Great Eastern lays a telegraph cable that finally works., article: undersea-internet}
- {year: 1988, title: Fibre crosses the Atlantic, text: TAT-8 becomes the first fibre-optic cable across the Atlantic., article: undersea-internet}
- {year: 2019, title: First 5G networks, text: South Korea and the USA switch on the first 5G phone networks., article: 5g}
- {year: 2022, title: 5G reaches India, text: India launches 5G mobile services on 1 October., article: 5g}
- {year: 965, title: The Jelling stone, text: King Harald Bluetooth raises a runestone in Denmark., article: bluetooth}
- {year: 1998, title: Bluetooth group formed, text: "Ericsson, Intel, Nokia and others team up to develop Bluetooth.", article: bluetooth}
- {year: 1991, title: Lithium-ion goes on sale, text: Sony sells the first rechargeable lithium-ion batteries., article: batteries-phones}
- {year: 2018, title: Hydrogen trains carry passengers, text: Two Coradia iLint trains start service in Lower Saxony in Germany., article: hydrogen-fuel}
- {year: 1895, title: A tower to the sky, text: Konstantin Tsiolkovsky dreams of a tower reaching into orbit., article: space-elevator}
- {year: 1994, title: Shor's algorithm, text: Peter Shor shows a quantum computer could break some codes., article: quantum-computers}
- {year: 1991, title: PARAM 8000, text: C-DAC in Pune builds India's first supercomputer., article: supercomputers}
- {year: 2022, title: The exaflop barrier, text: Frontier in Tennessee becomes the first listed computer to pass one exaflop., article: supercomputers}
- {year: 1963, title: Rocket from Thumba, text: India launches its first rocket from a fishing village in Kerala., article: isro-launch}
- {year: 1980, title: SLV-3 reaches orbit, text: India's own rocket puts the Rohini satellite into orbit., article: isro-launch}
- {year: 2017, title: 104 satellites at once, text: A single PSLV rocket carries 104 satellites into orbit., article: isro-launch}
- {year: 2015, title: A booster lands upright, text: A Falcon 9 first stage lands back at Cape Canaveral after launch., article: reusable-rockets}
- {year: 2019, title: First Starlink batch, text: SpaceX launches its first 60 Starlink satellites., article: starlink}
- {year: 2016, title: Blood by drone, text: Zipline starts flying blood to hospitals in Rwanda., article: drones-delivery}
- {year: 2001, title: Operation Lindbergh, text: Surgeons in New York operate on a patient in France using a robot., article: robots-surgery}
- {year: 1969, title: The Jaipur Foot, text: Dr P.K. Sethi and Ram Chandra Sharma create a low-cost artificial foot., article: prosthetics}
- {year: 1978, title: Multichannel cochlear implant, text: Graeme Clark's team in Australia fits its first multichannel implant., article: hearing-aids}
- {year: 1824, title: Braille's dots, text: Fifteen-year-old Louis Braille invents his raised-dot alphabet., article: accessibility-tech}
- {year: 1990, title: Americans with Disabilities Act, text: A US law requires public places to be accessible., article: accessibility-tech}
- {year: 2021, title: Medals from old phones, text: Tokyo Olympic medals are made from metal recovered from donated gadgets., article: e-waste}
- {year: 2021, title: India Semiconductor Mission, text: India launches a programme to build chip factories at home., article: semiconductors-india}
- {year: 2010, title: First Aadhaar numbers, text: Villagers in Tembhli in Maharashtra receive the first Aadhaar numbers., article: digital-india}
- {year: 2016, title: UPI launches, text: India's Unified Payments Interface lets people send money by phone in seconds., article: digital-india}
- {year: 2007, title: Flipkart begins, text: Two engineers start selling books online from a Bengaluru flat., article: indian-startups}
- {year: 1939, title: The HP garage, text: Bill Hewlett and David Packard start their company in a Palo Alto garage., article: steve-wozniak-garage}
- {year: 1976, title: Apple is founded, text: Steve Jobs and Steve Wozniak start selling the Apple I., article: steve-wozniak-garage}
- {year: 1957, title: The traitorous eight, text: Eight scientists leave Shockley and found Fairchild Semiconductor., article: silicon-valley}
- {year: 1971, title: Silicon Valley gets its name, text: Journalist Don Hoefler popularises the nickname in a trade newspaper., article: silicon-valley}
- {year: 1951, title: First IIT opens, text: The Indian Institute of Technology at Kharagpur takes its first students., article: sundar-ganges-tech}
- {year: 1895, title: X-rays discovered, text: Wilhelm Röntgen notices a glowing screen and finds invisible rays., article: inventions-accidents}
- {year: 1928, title: Penicillin found, text: Alexander Fleming spots mould killing bacteria on a dish., article: inventions-accidents}
- {year: 1474, title: Venice patent law, text: Venice promises inventors ten years of protection., article: patents}
- {year: 1997, title: Turmeric patent cancelled, text: A US patent on turmeric for wounds is revoked after India's challenge., article: patents}
- {year: 132, title: Earthquake detector, text: Zhang Heng builds a bronze seismoscope in China., article: ancient-tech}
- {year: 1901, title: Antikythera mechanism recovered, text: Divers raise bronze fragments from a Greek shipwreck., article: antikythera}
- {year: 1975, title: First digital camera, text: Steven Sasson at Kodak builds a toaster-sized digital camera., article: cameras-phones}
- {year: 2000, title: Camera phones arrive, text: The Sharp J-SH04 goes on sale in Japan with a built-in camera., article: cameras-phones}
- {year: 1986, title: Voyager flies round the world, text: Pilots wear early noise-cancelling headsets on a non-stop flight., article: noise-cancelling}
