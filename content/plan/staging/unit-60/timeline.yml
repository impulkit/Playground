- {year: 800, title: Borobudur rises in Java, text: Builders under the Sailendra kings cover a hill with carved stone., article: borobudur}
- {year: 1025, title: Chola fleet sails east, text: Rajendra Chola's navy raids ports of the Srivijaya kingdom., article: chola-navy}
- {year: 1589, title: A knitting machine, text: William Lee builds a frame that knits stockings., article: knitting-weaving}
- {year: 1796, title: The first vaccine, text: Edward Jenner protects a boy against smallpox using cowpox., article: history-of-medicine}
- {year: 1804, title: Punched-card loom, text: Joseph-Marie Jacquard's loom weaves patterns read from cards., article: knitting-weaving}
- {year: 1840, title: The Penny Black, text: Britain issues the first sticky postage stamp., article: post-office}
- {year: 1846, title: Painless surgery, text: A Boston patient is operated on under ether., article: history-of-medicine}
- {year: 1846, title: Lockstitch patent, text: Elias Howe patents his sewing machine., article: sewing-machines}
- {year: 1855, title: Livingstone at the falls, text: The Scottish missionary sees Mosi-oa-Tunya and names it Victoria Falls., article: victoria-falls}
- {year: 1869, title: Suez Canal opens, text: Ships can sail between the Mediterranean and the Red Sea., article: suez-canal}
- {year: 1889, title: Kilimanjaro summit, text: Hans Meyer and Ludwig Purtscheller reach the top with local help., article: kilimanjaro}
- {year: 1903, title: First powered flight, text: The Wright Flyer stays up for 12 seconds at Kitty Hawk., article: wright-to-moon}
- {year: 1914, title: Panama Canal opens, text: Ships cross between the Atlantic and Pacific without rounding South America., article: panama-canal}
- {year: 1931, title: Christ the Redeemer opens, text: The statue on Corcovado is unveiled above Rio de Janeiro., article: christ-redeemer}
- {year: 1956, title: Suez Crisis, text: Egypt takes control of the canal and foreign forces invade then withdraw., article: suez-canal}
- {year: 1969, title: First Moon landing, text: Apollo 11 lands less than 66 years after the first aeroplane flight., article: wright-to-moon}
- {year: 1970, title: Yellow and red cards, text: Football's cards are used for the first time at a World Cup., article: umpires-referees}
- {year: 1972, title: PIN codes begin, text: India introduces six-digit postal codes., article: post-office}
- {year: 1973, title: Sydney Opera House opens, text: Fourteen years after work began, the shells are finished., article: sydney-opera}
- {year: 1985, title: Uluru handed back, text: The Australian government returns Uluru to its Anangu owners., article: uluru}
- {year: 1992, title: The third umpire, text: A TV replay decides a cricket run-out for the first time., article: umpires-referees}
- {year: 1999, title: Panama takes the canal, text: The USA hands control of the Panama Canal to Panama., article: panama-canal}
- {year: 2019, title: Uluru climb closes, text: Tourists can no longer climb the sacred rock., article: uluru}
- {year: 2021, title: FASTag made compulsory, text: Vehicles on India's national highways must carry a tag., article: fastag-tolls}
- {year: 2021, title: Ever Given stuck, text: A giant container ship blocks the Suez Canal for six days., article: suez-canal}
- {year: 2024, title: India's biggest election, text: "Nearly 98 crore voters are registered, and polling runs in seven phases.", article: elections-india}
