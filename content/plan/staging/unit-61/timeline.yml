- {year: 1404, title: Voynich pages made, text: Carbon dating places the manuscript's animal-skin pages between 1404 and 1438., article: mystery-voynich}
- {year: 1912, title: Voynich buys a strange book, text: Bookseller Wilfrid Voynich buys the unreadable manuscript in Italy., article: mystery-voynich}
- {year: 1587, title: Roanoke colonists arrive, text: About 115 English settlers land on Roanoke Island., article: mystery-roanoke}
- {year: 1590, title: Roanoke found empty, text: John White returns to find only the word CROATOAN carved on a post., article: mystery-roanoke}
- {year: 1817, title: Fried potato slices in print, text: "William Kitchiner's cookbook gives a recipe for potatoes fried in shavings.", article: accident-potato-chips}
- {year: 1859, title: The Carrington Event, text: A huge solar storm makes telegraph equipment spark., article: what-if-no-electricity}
- {year: 2012, title: India's great blackout, text: Over 600 million people lose power in north and east India., article: what-if-no-electricity}
- {year: 1905, title: A drink freezes on a stick, text: "Frank Epperson, aged 11, says he left a fizzy drink out overnight.", article: accident-popsicle}
- {year: 1924, title: Popsicle patent, text: Frank Epperson patents frozen confectionery on a stick., article: accident-popsicle}
- {year: 1938, title: Teflon discovered, text: Roy Plunkett finds a slippery white powder inside a gas cylinder., article: accident-teflon}
- {year: 1956, title: Tefal founded, text: Marc Grégoire starts making non-stick pans in France., article: accident-teflon}
- {year: 1968, title: A weak glue, text: Spencer Silver at 3M makes a glue that peels off cleanly., article: accident-post-it}
- {year: 1980, title: Post-it Notes launched, text: Sticky notes go on sale across the USA., article: accident-post-it}
- {year: 1964, title: Eleven days awake, text: Randy Gardner ends his record attempt after about 264 hours., article: what-if-no-sleep}
- {year: 1945, title: Flight 19 lost, text: Five US Navy bombers vanish on a training flight off Florida., article: mystery-bermuda}
- {year: 1997, title: Roberto Carlos's free kick, text: A swerving shot against France stuns the football world., article: sport-science-football-curve}
- {year: 1997, title: The Bloop, text: NOAA hydrophones record a huge mystery sound in the Pacific., article: mystery-bloop}
- {year: 1913, title: Raja Harishchandra, text: Dadasaheb Phalke releases India's first feature film., article: behind-film-making}
- {year: 1928, title: The falling house stunt, text: A house front falls around Buster Keaton in Steamboat Bill Jr., article: behind-stunts}
- {year: 1990, title: The Monty Hall uproar, text: Marilyn vos Savant's answer to the three-door puzzle draws thousands of angry letters., article: puzzle-monty-hall}
- {year: 2012, title: Ball lightning recorded, text: Scientists in China measure a natural ball of lightning by chance., article: mystery-ball-lightning}
- {ago: 66000000, title: Asteroid ends the dinosaurs' reign, text: A rock about 10 km wide strikes near today's Mexico., article: what-if-dinos-lived}
- {year: 1929, title: Vatican City becomes a country, text: A treaty with Italy creates the world's smallest state., article: extreme-smallest-countries}
- {year: 1979, title: A forest begins, text: Teenager Jadav Payeng starts planting on a Brahmaputra sandbank., article: india-heroes-everyday}
