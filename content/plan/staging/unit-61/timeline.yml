- {year: 1890, title: Starlings reach America, text: About 60 starlings are released in New York's Central Park., article: sky-murmurations}
- {year: 1400, title: The last moa, text: New Zealand's giant moa die out around 1400 to 1450., article: lost-moa}
- {year: 2014, title: World Cup birthday test, text: Half of the 23-player World Cup squads have a shared birthday., article: puzzle-birthday}
