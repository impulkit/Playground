- {ago: 51200, title: Oldest story picture, text: Painters in Sulawesi show people and a wild pig on a cave wall., article: cave-art}
- {year: -1050, title: Phoenician alphabet, text: Traders use 22 letters for consonants only., article: alphabet-history}
- {year: -800, title: Greeks add vowels, text: The Greek alphabet writes every consonant and vowel., article: alphabet-history}
- {year: 750, title: Kalila wa Dimna, text: The Panchatantra is translated into Arabic., article: panchatantra-tales}
- {year: 1066, title: Normans conquer England, text: French words begin to pour into English., article: english-spread}
- {year: 1415, title: The vanishing point, text: Brunelleschi shows how to paint depth with geometry in Florence., article: perspective}
- {year: 1632, title: Taj Mahal begun, text: Work starts on Shah Jahan's tomb for Mumtaz Mahal in Agra., article: taj-mahal}
- {year: 1755, title: Johnson's dictionary, text: Samuel Johnson defines about 42000 English words., article: dictionaries}
- {year: 1786, title: A language family found, text: William Jones links Sanskrit with Greek and Latin., article: sanskrit}
- {year: 1814, title: India's first museum, text: The Indian Museum grows out of the Asiatic Society in Kolkata., article: museums}
- {year: 1814, title: Shampooing in Brighton, text: Sake Dean Mahomed opens his bathhouse in England., article: words-borrowed}
- {year: 1817, title: First US deaf school, text: Gallaudet and Clerc open a school in Hartford., article: sign-language}
- {year: 1819, title: Ajanta rediscovered, text: A British officer hunting a tiger spots a cave entrance., article: ajanta-colours}
- {year: 1824, title: Six dots, text: Fifteen-year-old Louis Braille creates his reading code., article: braille}
- {year: 1837, title: Brahmi deciphered, text: James Prinsep learns to read Ashoka's script., article: scripts-india}
- {year: 1839, title: OK is born, text: A Boston newspaper prints O.K. as a joke., article: slang}
- {year: 1846, title: Smithsonian founded, text: A British scientist's gift creates America's museum group., article: museums}
- {year: 1886, title: Statue of Liberty dedicated, text: France's gift is unveiled in New York harbour., article: statue-liberty}
- {year: 1928, title: OED completed, text: The Oxford English Dictionary is finished after about 70 years., article: dictionaries}
- {year: 1945, title: A forger confesses, text: Han van Meegeren admits his Vermeers are fakes., article: art-forgery}
- {year: 1949, title: Hindi chosen, text: The Constituent Assembly picks Hindi as an official language., article: hindi-language}
- {year: 1956, title: States redrawn by language, text: The States Reorganisation Act remakes India's map., article: languages-india}
- {year: 1957, title: Bhimbetka spotted, text: V. S. Wakankar notices the rock shelters from a train., article: cave-art}
- {year: 1966, title: Mahabharata critical edition, text: Scholars in Pune finish comparing over a thousand manuscripts., article: mahabharata}
- {year: 1987, title: Ramayan on TV, text: The Doordarshan series empties streets on Sunday mornings., article: ramayana}
- {year: 1999, title: Emojis designed, text: Shigetaka Kurita draws 176 emojis for Japanese phones., article: emojis}
- {year: 2004, title: Tamil a classical language, text: India names Tamil its first classical language., article: tamil-ancient}
