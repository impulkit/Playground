- {year: 1718, title: New Orleans founded, text: French settlers build a town in a bend of the Mississippi., article: new-orleans}
- {year: 2005, title: Hurricane Katrina, text: Levees fail and about 80 percent of New Orleans floods., article: new-orleans}
- {year: 1896, title: Miami founded, text: The railway arrives and the city of Miami is founded the same year., article: miami}
- {year: 1912, title: Arizona becomes a state, text: Arizona becomes the 48th US state., article: grand-canyon-state}
- {year: 1975, title: Edmund Fitzgerald sinks, text: A cargo ship and all 29 crew are lost in a storm on Lake Superior., article: great-lakes}
- {year: 1927, title: Great Mississippi Flood, text: The river bursts its banks and drives hundreds of thousands from their homes., article: mississippi}
- {year: 1937, title: Appalachian Trail completed, text: A footpath of about 3,500 km is finished from Georgia to Maine., article: appalachians}
- {year: 1885, title: Banff National Park, text: Canada sets aside its first national park in the Rockies., article: rocky-mountains}
- {year: 1864, title: The Long Walk, text: The US Army forces thousands of Navajo to march to Bosque Redondo., article: navajo-nation}
- {year: 1868, title: Navajo return home, text: A treaty lets the Navajo go back to their homeland., article: navajo-nation}
- {year: 1898, title: Puerto Rico passes to the USA, text: Spain hands Puerto Rico to the United States after the Spanish–American War., article: puerto-rico}
- {year: 330, title: Constantinople founded, text: Emperor Constantine makes the old town of Byzantion his new capital., article: istanbul}
- {year: 1453, title: Fall of Constantinople, text: Ottoman Sultan Mehmed II captures the city., article: istanbul}
- {year: 691, title: Dome of the Rock, text: The Dome of the Rock is completed in Jerusalem., article: jerusalem}
- {year: 1325, title: Ibn Battuta sets out, text: A 21-year-old from Tangier leaves for the Hajj and keeps travelling for nearly 30 years., article: mecca-hajj}
- {year: 794, title: Kyoto becomes capital, text: Japan's emperor moves to the new city of Heian-kyō., article: kyoto}
- {year: 1889, title: Nintendo founded, text: A Kyoto craftsman starts a company making playing cards., article: kyoto}
- {year: 1446, title: Hangul announced, text: King Sejong announces a new alphabet for Korean., article: seoul}
- {year: 1420, title: Forbidden City completed, text: The Yongle Emperor's palace in Beijing is finished., article: beijing}
- {year: 1767, title: Ayutthaya destroyed, text: A Burmese army destroys the old Thai capital named after Ayodhya., article: thailand}
- {year: 2009, title: Son Doong explored, text: Cavers explore the largest known cave passage on Earth., article: vietnam}
- {year: 2008, title: Bhutan votes, text: Bhutan holds its first national parliamentary elections., article: bhutan}
- {year: 2009, title: Underwater cabinet meeting, text: Maldives ministers meet on the seabed to call for action on climate change., article: maldives}
- {year: 1206, title: Mongols united, text: Genghis Khan unites the Mongol tribes., article: mongolia}
- {year: 859, title: Al-Qarawiyyin founded, text: Fatima al-Fihri founds a mosque in Fez that grows into a university., article: morocco}
- {year: 1974, title: Lucy found, text: "A 3.2-million-year-old skeleton of a human ancestor is found in Ethiopia's Afar region.", article: ethiopia}
- {year: 1960, title: Nigerian independence, text: Nigeria becomes independent from Britain on 1 October., article: nigeria}
- {year: 1450, title: Machu Picchu built, text: The Inca build an estate high in the Andes, probably for Emperor Pachacuti., article: peru}
- {year: 1892, title: Fingerprints solve a murder, text: Argentine police officer Juan Vucetich uses a thumbprint to solve a murder., article: argentina}
- {year: 1953, title: North Sea flood, text: Storm waves break Dutch dykes and around 1,800 people die., article: amsterdam}
- {year: 1492, title: Granada surrenders, text: The last Muslim kingdom in Spain falls months before Columbus sets sail., article: spain}
- {year: 2016, title: Gotthard Base Tunnel opens, text: The world's longest railway tunnel opens under the Swiss Alps., article: switzerland}
- {year: 2000, title: Lærdal Tunnel opens, text: Norway opens the world's longest road tunnel., article: norway-fjords}
- {year: 1996, title: Dolly the sheep, text: Scientists near Edinburgh clone a mammal from an adult cell., article: scotland}
- {year: 1893, title: Women vote in New Zealand, text: New Zealand becomes the first self-governing country to give women the vote., article: new-zealand}
- {year: 1835, title: Darwin in the Galápagos, text: Charles Darwin spends five weeks on the islands aboard HMS Beagle., article: galapagos}
