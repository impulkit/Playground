- {year: -2300, title: Ships from Meluhha, text: King Sargon of Akkad boasts that ships from Meluhha dock at his capital., article: harappan-trade}
- {year: 1875, title: First Indus seal published, text: Alexander Cunningham publishes a seal from Harappa with unknown signs., article: indus-script}
- {year: -776, title: First recorded Olympic Games, text: Tradition dates the first recorded Games at Olympia to this year., article: ancient-olympia}
- {year: -396, title: Kyniska wins at Olympia, text: A Spartan princess becomes an Olympic victor through her chariot team., article: ancient-olympia}
- {year: -550, title: Cyrus founds the Persian Empire, text: Cyrus the Great begins building the Achaemenid Empire., article: ancient-persia}
- {year: -330, title: Persepolis burns, text: Alexander's army burns the Persian palace city., article: ancient-persia}
- {year: -326, title: Battle of the Hydaspes, text: Alexander defeats King Porus beside the Jhelum river., article: alexander-india}
- {year: -323, title: Alexander dies, text: Alexander the Great dies in Babylon aged 32., article: alexander-india}
- {year: 127, title: Kanishka's reign begins, text: Many historians date the start of the Kushan king's reign to about this year., article: kushans}
- {year: 330, title: Constantinople becomes capital, text: Emperor Constantine makes the city his new capital., article: byzantium}
- {year: 537, title: Hagia Sophia completed, text: Justinian's great domed church is finished in Constantinople., article: byzantium}
- {year: 634, title: Aihole inscription, text: A poem carved at Aihole praises the Chalukya king Pulakeshin II., article: chalukyas}
- {year: 642, title: Pallavas take Vatapi, text: Narasimhavarman I captures the Chalukya capital., article: pallavas}
- {year: 753, title: Rashtrakutas rise, text: Dantidurga overthrows the Chalukyas of Badami., article: rashtrakutas}
- {year: 1117, title: Belur temple begun, text: King Vishnuvardhana starts the Chennakeshava temple at Belur., article: hoysalas}
- {year: 1191, title: First battle of Tarain, text: Prithviraj Chauhan defeats Muhammad Ghori., article: rajputs}
- {year: 1206, title: Genghis Khan proclaimed, text: Mongol leaders give Temujin the title Genghis Khan., article: mongols}
- {year: 1213, title: Ramappa temple built, text: A Kakatiya general builds the temple later named after its sculptor., article: kakatiyas}
- {year: 1215, title: Magna Carta, text: King John agrees to the barons' charter at Runnymede., article: magna-carta}
- {year: 1221, title: Genghis Khan at the Indus, text: Genghis Khan chases a Khwarazmian prince to the Indus and turns back., article: genghis-khan}
- {year: 1228, title: Ahom kingdom founded, text: Sukaphaa crosses the Patkai hills into the Brahmaputra valley., article: ahom-kingdom}
- {year: 1299, title: Ottoman beginnings, text: Osman I begins to build a state in north-western Anatolia., article: ottomans}
- {year: 1323, title: Warangal falls, text: Delhi Sultanate forces capture the Kakatiya capital., article: kakatiyas}
- {year: 1347, title: Plague reaches Sicily, text: Ships bring the Black Death to Messina., article: black-death}
- {year: 1377, title: First quarantine rules, text: Ragusa makes travellers from plague areas wait before entering., article: black-death}
- {year: 1453, title: Fall of Constantinople, text: Mehmed II captures the city and ends the Byzantine Empire., article: ottomans}
- {year: 1455, title: Gutenberg Bible, text: Gutenberg finishes printing his famous Bible in Mainz., article: printing-revolution}
- {year: 1469, title: Guru Nanak born, text: The first Sikh Guru is born at Talwandi., article: sikh-gurus}
- {year: 1510, title: Portuguese take Goa, text: Afonso de Albuquerque captures Goa from the Sultan of Bijapur., article: goa-liberation}
- {year: 1556, title: First press in India, text: Jesuit missionaries set up a printing press in Goa., article: printing-revolution}
- {year: 1576, title: Battle of Haldighati, text: Maharana Pratap fights Akbar's army led by Man Singh., article: rajputs}
- {year: 1604, title: Adi Granth compiled, text: Guru Arjan compiles the Sikh holy book., article: sikh-gurus}
- {year: 1671, title: Battle of Saraighat, text: Lachit Borphukan's Ahom forces turn back a Mughal army., article: ahom-kingdom}
- {year: 1674, title: Shivaji crowned, text: Shivaji is crowned Chhatrapati at Raigad., article: marathas}
- {year: 1699, title: Khalsa founded, text: Guru Gobind Singh founds the Khalsa at Anandpur Sahib., article: sikh-gurus}
- {year: 1761, title: Third Battle of Panipat, text: Ahmad Shah Durrani defeats a huge Maratha army., article: marathas}
- {year: 1780, title: Battle of Pollilur, text: Hyder Ali and Tipu Sultan defeat a British army., article: tipu-sultan}
- {year: 1789, title: Storming of the Bastille, text: Crowds in Paris capture the old fortress-prison., article: french-revolution}
- {year: 1799, title: Fall of Srirangapatna, text: Tipu Sultan dies defending his capital., article: tipu-sultan}
- {year: 1801, title: Ranjit Singh becomes Maharaja, text: Ranjit Singh is proclaimed Maharaja of Punjab., article: ranjit-singh}
- {year: 1803, title: Louisiana Purchase, text: Napoleon sells the Louisiana Territory to the United States., article: napoleon}
- {year: 1804, title: Napoleon crowned, text: Napoleon crowns himself Emperor of the French in Paris., article: napoleon}
- {year: 1815, title: Battle of Waterloo, text: Napoleon is finally defeated in today's Belgium., article: napoleon}
- {year: 1818, title: End of Peshwa rule, text: The last Anglo-Maratha war ends Maratha power., article: marathas}
- {year: 1826, title: Treaty of Yandabo, text: Assam passes to British control., article: ahom-kingdom}
- {year: 1849, title: Punjab annexed, text: The British take over Ranjit Singh's former empire., article: ranjit-singh}
- {year: 1919, title: Jallianwala Bagh massacre, text: Troops fire on an unarmed crowd in Amritsar., article: jallianwala}
- {year: 1942, title: Quit India launched, text: Gandhi calls on Indians to "do or die"., article: quit-india}
- {year: 1943, title: Bengal famine, text: Millions die of hunger and disease in wartime Bengal., article: bengal-famine}
- {year: 1946, title: Constituent Assembly meets, text: India's Constituent Assembly holds its first session in Delhi., article: constituent-assembly}
- {year: 1948, title: Hyderabad joins India, text: The largest princely state joins India after a short military operation., article: princely-states}
- {year: 1950, title: Constitution comes into force, text: India becomes a republic on 26 January., article: constituent-assembly}
- {year: 1961, title: Operation Vijay, text: Indian forces end Portuguese rule in Goa., article: goa-liberation}
- {year: 1971, title: Privy purses abolished, text: An amendment ends the allowances and titles of former princes., article: princely-states}
- {year: 1975, title: Emergency declared, text: A national emergency suspends many rights for 21 months., article: emergency-1975}
- {year: 1977, title: Emergency ends, text: Voters elect the Janata Party and the Emergency is lifted., article: emergency-1975}
