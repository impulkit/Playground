- {year: 1929, title: First air traffic controller, text: Archie League guides planes with flags at an airfield in St. Louis., article: air-traffic}
- {year: 1902, title: The stratosphere is found, text: Balloon records show a high layer where the air stops getting colder., article: weather-balloons}
- {year: 1983, title: The Gimli Glider, text: An airliner that ran out of fuel glides to a safe landing in Canada., article: gliders}
- {year: 2018, title: Glider height record, text: The Perlan 2 glider climbs to about 23 km over Argentina., article: gliders}
- {year: 2015, title: A solar-powered airport, text: Cochin International Airport in Kerala starts running on solar power., article: airports}
- {year: 2017, title: Body clock Nobel Prize, text: Three scientists win the Nobel Prize for discovering how cells keep time., article: jet-lag}
- {year: 2024, title: Fourth global coral bleaching, text: Scientists declare a fourth worldwide coral bleaching event., article: coral-bleaching}
- {year: 1977, title: Life at deep-sea vents, text: The submarine Alvin finds animals living around hot springs on the sea floor., article: deep-sea-vents}
- {year: 2008, title: Glowing protein Nobel Prize, text: A green glowing protein from a jellyfish wins the Nobel Prize in Chemistry., article: bioluminescence}
- {year: 2017, title: Seabed 2030 begins, text: A project starts to map the whole ocean floor in detail., article: ocean-floor-maps}
- {year: 1893, title: First cultured pearl, text: Kokichi Mikimoto grows a half-round pearl in Japan., article: pearls}
- {year: 1956, title: First container ship voyage, text: The Ideal X carries 58 containers from Newark to Houston., article: sea-ports}
- {year: 1695, title: Raid on the Ganj-i-Sawai, text: The pirate Henry Every captures a Mughal treasure ship., article: pirates}
- {year: 1718, title: Blackbeard is killed, text: The pirate dies in a fight with navy sailors off North Carolina., article: pirates}
- {year: 1628, title: The Vasa sinks, text: Sweden's new warship sinks in Stockholm harbour on its first voyage., article: shipwrecks}
- {year: 2022, title: Endurance found, text: Shackleton's lost ship is found 3 km deep near Antarctica., article: shipwrecks}
- {year: 1997, title: The Bloop, text: Underwater microphones record a mysterious sound later linked to breaking ice., article: ocean-sounds}
- {year: 1973, title: Bee dance Nobel Prize, text: Karl von Frisch shares the Nobel Prize for decoding the honeybee dance., article: animal-communication}
- {year: 2023, title: Elephant corridors mapped, text: India lists 150 corridors that link elephant forests., article: animal-migration-land}
- {year: 2002, title: Colour vision at night, text: Scientists show hawkmoths can see colours by starlight., article: nocturnal-animals}
- {year: 2016, title: Centuries-old sharks, text: Scientists estimate a Greenland shark is at least 272 years old., article: animal-records}
- {year: 1965, title: Dung beetles to the rescue, text: Australia begins bringing in dung beetles to clear cow dung from pastures., article: insects-importance}
- {year: 1841, title: Vanilla by hand, text: Edmond Albius invents a quick way to pollinate vanilla flowers by hand., article: pollinators}
- {year: 1935, title: Cane toads arrive, text: Toads are brought to Australia to eat beetles and become pests themselves., article: invasive-species}
- {year: 1890, title: Starlings in Central Park, text: About 60 European starlings are released in New York., article: invasive-species}
- {year: 1868, title: First mounted dinosaur, text: A Hadrosaurus skeleton goes on display in Philadelphia., article: dino-museums}
- {ago: 23000000, title: Megalodon appears, text: The biggest shark ever begins hunting in warm seas., article: megalodon}
- {ago: 3600000, title: Megalodon disappears, text: The giant shark dies out as oceans cool., article: megalodon}
- {ago: 3500000000, title: Oldest accepted fossils, text: Microbes build layered stromatolites in shallow Australian seas., article: first-life}
- {year: 1952, title: The Miller experiment, text: Sparks in a flask of water and gases make amino acids., article: first-life}
- {ago: 539000000, title: The Cambrian begins, text: Animals with shells, legs and eyes spread through the seas., article: cambrian}
- {year: 1909, title: Burgess Shale found, text: Charles Walcott finds rocks full of soft-bodied Cambrian animals in Canada., article: cambrian}
- {ago: 9500, title: An early pet cat, text: A person in Cyprus is buried with a cat., article: pets-care}
