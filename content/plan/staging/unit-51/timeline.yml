- {year: 1896, title: Films reach India, text: The Lumière brothers' films are projected at Watson's Hotel in Bombay., article: projectors}
- {year: 1987, title: The mirror chip, text: An engineer at Texas Instruments invents the DLP chip of tiny tilting mirrors., article: projectors}
- {year: -814, title: Carthage founded, text: "By tradition, settlers from Tyre found Carthage in North Africa.", article: carthage}
- {year: -146, title: Carthage destroyed, text: Rome captures and burns Carthage after a three-year siege., article: carthage}
- {year: 2013, title: Hyperloop Alpha, text: A paper from Elon Musk and engineers revives the idea of trains in low-pressure tubes., article: hyperloop}
- {year: 2020, title: First hyperloop passengers, text: Two people ride a test pod in Nevada at 172 km/h., article: hyperloop}
- {year: 1930, title: First Empire Games, text: "About 400 athletes meet in Hamilton, Canada, for the first British Empire Games.", article: commonwealth-games}
- {year: 2010, title: Delhi hosts the Games, text: India wins 101 medals at the Commonwealth Games in Delhi., article: commonwealth-games}
- {year: 1728, title: An early brace, text: French dentist Pierre Fauchard describes a metal strip to widen the teeth., article: braces}
- {year: 1998, title: Clear aligners, text: Clear plastic tooth aligners are approved in the USA., article: braces}
- {year: 1747, title: Lemons against scurvy, text: Naval doctor James Lind tests citrus fruit on sick sailors., article: citrus}
- {year: 1843, title: A Christmas Carol, text: Charles Dickens publishes his ghost story about Scrooge., article: ghost-stories}
- {year: 1793, title: Decimal time, text: Revolutionary France tries a day of 10 hours., article: clocks-maths}
- {year: 1962, title: Camp Shriver, text: Eunice Kennedy Shriver opens a sports camp in her backyard in Maryland., article: special-olympics}
- {year: 1968, title: First Special Olympics, text: About 1000 athletes compete at Soldier Field in Chicago., article: special-olympics}
- {year: 2004, title: Indian Ocean tsunami, text: A huge undersea earthquake off Sumatra sends tsunami waves across the Indian Ocean., article: tsunami-warning}
- {year: 2007, title: India's tsunami centre, text: The Indian Tsunami Early Warning Centre in Hyderabad begins work., article: tsunami-warning}
- {year: 1924, title: Gateway of India opens, text: The arch on Mumbai's waterfront is opened 13 years after the royal visit it honours., article: gateway-india}
- {year: 1948, title: Last British troops leave, text: The last British soldiers in India march out through the Gateway of India., article: gateway-india}
- {year: 2000, title: Thiruvalluvar Statue, text: A 133-foot statue of the poet is unveiled off Kanyakumari., article: thiruvalluvar}
- {year: 1971, title: The laser printer, text: Gary Starkweather's laser printer is working at Xerox's lab in California., article: printers}
- {year: 668, title: Silla unites Korea, text: Silla defeats Goguryeo and unites most of the Korean peninsula., article: ancient-korea}
- {year: 1377, title: The Jikji is printed, text: Korean monks print a book with movable metal type., article: ancient-korea}
- {year: 2021, title: AirCar flies between cities, text: A car with folding wings flies from Nitra to Bratislava in Slovakia., article: flying-cars}
- {year: 1504, title: David is finished, text: Michelangelo completes his marble statue of David in Florence., article: stone-carving}
- {year: 983, title: Gommateshwara carved, text: A 17-metre statue is carved from one granite rock at Shravanabelagola., article: stone-carving}
- {year: 1841, title: The first detective story, text: Edgar Allan Poe publishes The Murders in the Rue Morgue., article: detective-stories}
- {year: 1887, title: Sherlock Holmes appears, text: Arthur Conan Doyle publishes A Study in Scarlet., article: detective-stories}
- {year: 1965, title: Feluda begins, text: Satyajit Ray publishes his first Feluda story in Sandesh., article: detective-stories}
- {year: 2025, title: The last US pennies, text: The US Mint strikes its final pennies for everyday use., article: money-counting}
- {year: 1802, title: Humboldt on Chimborazo, text: Alexander von Humboldt sees plant zones change as he climbs a volcano in Ecuador., article: biomes}
- {year: 2003, title: The purple frog, text: Scientists describe a burrowing purple frog from the Western Ghats., article: frogs-world}
- {year: 1984, title: First Indian in space, text: Rakesh Sharma flies to the Salyut 7 space station., article: indian-astronauts}
- {year: 2025, title: Shukla on the space station, text: Shubhanshu Shukla becomes the first Indian aboard the International Space Station., article: indian-astronauts}
- {year: 1982, title: First marine national park, text: The Gulf of Kachchh becomes India's first marine national park., article: marine-parks-india}
- {year: 1943, title: Howrah Bridge opens, text: The giant cantilever bridge over the Hooghly opens to traffic during the Second World War., article: howrah-bridge}
- {year: 1893, title: Sisters and brothers of America, text: Swami Vivekananda speaks at the World's Parliament of Religions in Chicago., article: swami-vivekananda}
- {year: 1897, title: Ramakrishna Mission founded, text: Vivekananda founds a mission to serve the poor and sick., article: swami-vivekananda}
- {year: 1938, title: The first photocopy, text: Chester Carlson makes the first xerographic copy in Astoria in New York., article: photocopiers}
- {year: 1959, title: Xerox 914, text: The first automatic plain-paper copier goes on sale., article: photocopiers}
- {year: 802, title: Khmer Empire begins, text: Jayavarman II is declared king of the Khmer., article: khmer-empire}
- {year: 2016, title: Round the world on sunlight, text: Solar Impulse 2 completes its flight around the world without fuel., article: electric-planes}
- {year: 2000, title: First Olympic medal for an Indian woman, text: Karnam Malleswari wins weightlifting bronze in Sydney., article: sports-women-india}
- {year: 2025, title: World Cup for India's women, text: India beat South Africa in Navi Mumbai to win the women's ODI World Cup., article: sports-women-india}
