- {year: -3500, title: First wheeled carts, text: Wagons appear in Mesopotamia and Europe at almost the same time., article: wheel-invented}
- {year: 1286, title: Spectacles invented, text: Craftsmen in Italy make the first eyeglasses for reading., article: lenses-glasses}
- {year: 1800, title: The first battery, text: Alessandro Volta stacks zinc and copper discs to make a steady current., article: batteries}
- {year: 1833, title: Ice reaches Calcutta, text: A ship from Boston delivers ice cut from American ponds., article: refrigerator}
- {year: 1835, title: Silvered glass mirrors, text: Justus von Liebig finds a way to coat glass with a thin layer of silver., article: mirrors}
- {year: 1839, title: Light makes electricity, text: Edmond Becquerel discovers the photovoltaic effect at the age of 19., article: solar-panels}
- {year: 1872, title: First national park, text: Yellowstone becomes the world's first national park., article: yellowstone-wolves}
- {year: 1876, title: Plimsoll line becomes law, text: British ships must carry a mark showing how deep they may safely sit., article: floating-ships}
- {year: 1888, title: Electric windmill, text: Charles Brush's giant windmill in Ohio lights his house., article: wind-turbines}
- {year: 1889, title: Bison nearly gone, text: Only about a thousand American bison are left., article: bison-return}
- {year: 1897, title: Hydropower in Darjeeling, text: The Sidrapong station becomes one of Asia's first hydroelectric plants., article: dams-power}
- {year: 1914, title: Last passenger pigeon, text: "Martha, the last passenger pigeon, dies at Cincinnati Zoo.", article: extinction-today}
- {year: 1925, title: Great Banyan loses its trunk, text: The banyan's main trunk is removed but the tree lives on., article: banyan}
- {year: 1928, title: Penicillin found, text: Alexander Fleming notices a mould killing bacteria., article: mushrooms}
- {year: 1936, title: Hoover Dam finished, text: A 221-metre dam on the Colorado River starts making power., article: dams-power}
- {year: 1942, title: First nuclear reactor, text: Enrico Fermi's team starts a chain reaction under a Chicago stadium., article: nuclear-power}
- {year: 1947, title: First microwave oven, text: The Radarange goes on sale in the USA., article: microwave}
- {year: 1954, title: Silicon solar cell, text: Bell Labs builds the first practical silicon solar cell., article: solar-panels}
- {year: 1963, title: Bhakra Dam finished, text: India's giant dam on the Sutlej is completed., article: dams-power}
- {year: 1969, title: India's first nuclear power, text: Tarapur Atomic Power Station starts up in Maharashtra., article: nuclear-power}
- {year: 1971, title: Ramsar Convention, text: Countries sign a treaty to protect wetlands in Ramsar, Iran., article: wetlands}
- {year: 1987, title: Last condors caught, text: All 27 remaining California condors are taken into care to breed., article: extinction-today}
- {year: 1995, title: Wolves return, text: Wolves from Canada are released into Yellowstone., article: yellowstone-wolves}
- {year: 2003, title: Purple frog described, text: Scientists name a frog that lives underground in the Western Ghats., article: frogs-monsoon}
- {year: 2006, title: Tallest tree found, text: Hyperion, a 116-metre redwood, is discovered in California., article: redwoods}
- {year: 2006, title: Diclofenac banned for animals, text: India bans a cattle painkiller that was killing vultures., article: extinction-today}
- {year: 2022, title: Cheetahs fly in, text: Eight cheetahs from Namibia arrive at Kuno National Park., article: cheetah-return}
