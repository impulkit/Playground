- {year: 2014, title: Namami Gange begins, text: India starts a national programme to clean the Ganga., article: ganga-journey}
- {year: 1806, title: The cherry tree story appears, text: "Mason Locke Weems prints the made-up tale of young George Washington and the cherry tree.", article: truth-lies}
- {year: 1882, title: Pearl Street Station opens, text: "Thomas Edison's power station starts lighting homes and offices in New York.", article: electricity-home}
- {year: 1902, title: Shivanasamudra power station, text: A hydroelectric plant on the Kaveri sends power to the Kolar Gold Fields., article: electricity-home}
- {year: -2500, title: The Dancing Girl, text: A craftsperson in Mohenjo-daro casts a small bronze figure of a girl., article: bronze-age}
- {year: -1300, title: The Uluburun ship sinks, text: "A ship carrying copper, tin and luxury goods sinks off the coast of Turkey.", article: bronze-age}
- {year: 1966, title: The Summer Vision Project, text: Researchers at MIT set out to teach computers to see., article: computer-vision}
- {year: 2012, title: AlexNet wins ImageNet, text: A neural network makes far fewer mistakes at recognising pictures than earlier programs., article: computer-vision}
- {year: 1863, title: Football's first shared rules, text: Clubs in London form the Football Association and write common rules., article: football-rules}
- {year: 1911, title: Mohun Bagan wins the IFA Shield, text: Barefoot Indian players beat a British army team in Kolkata., article: football-rules}
