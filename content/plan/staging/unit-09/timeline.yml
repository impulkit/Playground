# Unit 09 timeline events
- {year: 1826, title: Oldest surviving photograph, text: Nicéphore Niépce captures a view from his window in France., article: cameras-how}
- {year: 1975, title: First digital camera, text: Steven Sasson builds a toaster-sized digital camera at Kodak., article: cameras-how}
- {year: 1876, title: First telephone words, text: Alexander Graham Bell calls his assistant Thomas Watson in Boston., article: telephone}
- {year: 1995, title: India's first mobile call, text: A call is made from Kolkata to Delhi on 31 July., article: telephone}
- {year: 1895, title: Bose sends radio waves, text: Jagadish Chandra Bose demonstrates short radio waves in Calcutta., article: radio-waves}
- {year: 1901, title: Radio crosses the Atlantic, text: Marconi's team reports a signal sent from England to Newfoundland., article: radio-waves}
- {year: 1895, title: X-rays discovered, text: Wilhelm Röntgen spots a mysterious glow in his lab in Würzburg., article: x-rays}
- {year: 1714, title: Mercury thermometer, text: Daniel Gabriel Fahrenheit builds a reliable mercury thermometer., article: thermometer}
- {year: 1742, title: Celsius scale, text: Anders Celsius proposes a scale with 100 steps between freezing and boiling., article: thermometer}
- {year: 1679, title: First pressure cooker, text: Denis Papin shows his steam digester in London., article: pressure-cooker}
- {year: 1656, title: First pendulum clock, text: Christiaan Huygens builds a clock regulated by a pendulum., article: clocks}
- {year: 1967, title: The atomic second, text: The second is defined using vibrations of caesium atoms., article: clocks}
- {year: 1913, title: The modern zip, text: Gideon Sundback designs the toothed zip still used today., article: zippers}
- {year: 1941, title: Burrs inspire Velcro, text: George de Mestral studies burrs after a walk with his dog., article: velcro}
- {year: 1955, title: Velcro patented, text: George de Mestral receives a patent for his hook-and-loop fastener., article: velcro}
- {year: 1980, title: Sticky notes go on sale, text: 3M launches notes using a deliberately weak glue., article: glue-sticky}
- {year: 1854, title: Otis safety lift, text: Elisha Otis has the rope cut on his platform in New York to prove his brake., article: elevators}
- {year: 1900, title: Escalator at Paris fair, text: A moving staircase by Otis and Charles Seeberger is shown in Paris., article: escalators}
- {year: 1937, title: Golden Gate Bridge opens, text: San Francisco's suspension bridge spans 1280 metres., article: bridges}
- {year: 1943, title: Howrah Bridge opens, text: Kolkata's riveted cantilever bridge opens over the Hooghly., article: bridges}
- {year: 1885, title: First skyscraper, text: Chicago's Home Insurance Building uses a metal frame to carry its weight., article: skyscrapers}
- {year: 2010, title: Burj Khalifa opens, text: Dubai's 828-metre tower becomes the world's tallest building., article: skyscrapers}
- {year: 1843, title: Thames Tunnel opens, text: The first tunnel under a busy river opens in London., article: tunnels}
- {year: 1994, title: Channel Tunnel opens, text: Trains begin running under the sea between England and France., article: tunnels}
- {year: 1902, title: Tarmac patented, text: Edgar Hooley patents binding road stones with tar., article: roads-built}
- {year: 1853, title: India's first passenger train, text: A train runs from Bori Bunder to Thane on 16 April., article: trains-how}
- {year: 1964, title: First bullet train, text: Japan's Tokaido Shinkansen opens between Tokyo and Osaka., article: bullet-trains}
- {year: 1876, title: Four-stroke engine, text: Nikolaus Otto builds a working four-stroke engine., article: cars-engine}
- {year: 1888, title: Bertha Benz's drive, text: Bertha Benz drives about 100 km to show the car is practical., article: cars-engine}
- {year: 1908, title: Model T launched, text: Ford's cheap petrol car pushes early electric cars aside., article: electric-cars}
- {year: 1868, title: First traffic signal, text: A gas-lit signal is set up outside Parliament in London., article: traffic-lights}
- {year: 1914, title: First electric traffic light, text: Cleveland in Ohio installs electric red and green lights., article: traffic-lights}
- {year: 1854, title: John Snow's pump, text: A doctor links a London cholera outbreak to one water pump., article: water-purify}
- {year: 1908, title: Chlorine in city water, text: Jersey City starts continuously disinfecting its drinking water with chlorine., article: water-purify}
- {year: 1775, title: S-bend patented, text: Alexander Cumming patents the water-filled bend that blocks sewer smells., article: toilets-sewers}
- {year: 1858, title: The Great Stink, text: The stench of the Thames pushes London to build modern sewers., article: toilets-sewers}
- {year: 1907, title: Bakelite invented, text: Leo Baekeland makes the first fully synthetic plastic., article: plastic-made}
- {year: 1959, title: Float glass, text: Pilkington introduces flat glass made by floating it on molten tin., article: glass-made}
- {year: 105, title: Cai Lun's paper, text: A Chinese court official presents paper to the emperor., article: paper-made}
- {year: 2016, title: Gotthard Base Tunnel, text: The world's longest railway tunnel opens under the Alps., article: tunnels}
