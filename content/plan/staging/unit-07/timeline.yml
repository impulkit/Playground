- {ago: 450000000, title: The first sharks, text: Shark-like fish with tough scales swim in ancient seas., article: sharks-old}
- {ago: 505000000, title: Jellyfish fossils, text: Jellyfish leave rare prints in mud that becomes rock in Utah., article: jellyfish-old}
- {ago: 50000000, title: Whale ancestors wade in, text: Small four-legged mammals near India begin living in water., article: whales-walked}
- {ago: 15000, title: Wolves become dogs, text: Some wolves living near Ice Age hunters slowly turn into dogs., article: dogs-domestic}
- {ago: 9500, title: A cat buried in Cyprus, text: A cat is buried close to a person on an island with no wild cats., article: cats-domestic}
- {year: 1836, title: Darwin sees coral atolls, text: Charles Darwin visits coral islands in the Indian Ocean and wonders how they formed., article: coral-reefs}
- {year: 1881, title: Darwin's worm book, text: "Darwin's last book shows how earthworms reshape the land.", article: earthworms}
- {year: 1905, title: Kaziranga protected, text: Kaziranga in Assam is set aside to save the one-horned rhino., article: rhino-kaziranga}
- {year: 1911, title: Sea otters protected, text: An international treaty finally stops the hunting of sea otters for fur., article: sea-otters}
- {year: 1960, title: Trieste reaches the deepest point, text: Two explorers dive to the bottom of the Challenger Deep., article: ocean-deepest}
- {year: 1965, title: Gir becomes a sanctuary, text: Gir forest in Gujarat is protected for the last Asiatic lions., article: lions-gir}
- {year: 1966, title: Blue whales protected, text: Blue whale hunting is banned worldwide after decades of whaling., article: blue-whale}
- {year: 1977, title: Deep-sea vents found, text: Scientists in the submersible Alvin find life around hot springs on the seabed., article: ocean-zones}
- {year: 2000, title: Neem patent cancelled, text: A European patent on a neem fungicide method is revoked., article: neem}
- {year: 2001, title: Whale sharks protected in India, text: The whale shark becomes the first fish protected under India's wildlife law., article: sharks-old}
- {year: 2009, title: India's national aquatic animal, text: The Ganges river dolphin is named India's National Aquatic Animal., article: dolphins-click}
- {year: 2012, title: Giant squid filmed, text: A glowing lure helps film a live giant squid in the deep sea for the first time., article: anglerfish}
- {year: 2017, title: Bamboo no longer a tree, text: India changes its forest law so bamboo grown outside forests is not a tree., article: bamboo}
