- {id: protein, word: protein, meaning: "One of the main building materials of living things. Muscles, skin, hair and spider silk are all made mostly of proteins.", see: spiders-silk}
- {id: metamorphosis, word: metamorphosis, meaning: "A big change in an animal's body shape as it grows up, like a caterpillar turning into a butterfly or a tadpole into a frog.", see: butterflies-life}
- {id: compost, word: compost, meaning: "Dark, crumbly soil-like material made when food scraps, leaves and dung rot down. It feeds plants.", see: earthworms}
- {id: venom, word: venom, meaning: "A harmful liquid that an animal injects into another animal with fangs, stings or spines.", see: snakes-venom}
- {id: superhydrophobic, word: superhydrophobic, meaning: "So good at repelling water that drops sit up as round beads and roll straight off.", see: lotus}
- {id: grafting, word: grafting, meaning: "Joining a cut shoot from one plant onto the stem or roots of another, so they grow together as one plant.", see: mango-tree}
- {id: rhizome, word: rhizome, meaning: "An underground stem that grows sideways and sends up new shoots, as in bamboo, ginger and turmeric.", see: bamboo}
