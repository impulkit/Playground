- {year: -9500, title: Gobekli Tepe rises, text: Hunter-gatherers raise carved stone pillars in what is now Türkiye., article: mystery-gobekli}
- {year: -1213, title: Pepper for a pharaoh, text: Indian peppercorns are placed in the nose of the mummy of Ramesses II., article: food-pepper-black-gold}
- {year: 1135, title: Mallakhamb in writing, text: The Sanskrit text Manasollasa describes pole exercises for wrestlers., article: sport-mallakhamb}
- {year: 1498, title: Vasco da Gama reaches Calicut, text: The Portuguese arrive on the Kerala coast in search of pepper., article: food-pepper-black-gold}
- {year: 1778, title: The Culper Ring, text: George Washington's spy network begins sending reports from New York., article: spies-history}
- {year: 1824, title: First rubber balloons, text: Michael Faraday makes rubber balloons for experiments with hydrogen., article: made-balloons}
- {year: 1824, title: Braille's six dots, text: "Louis Braille, about 15, works out his raised-dot alphabet.", article: inventions-kids}
- {year: 1827, title: Friction matches go on sale, text: John Walker sells the first friction matches in England., article: made-matchsticks}
- {year: 1841, title: Vanilla's hand trick, text: "Edmond Albius, aged 12, discovers how to pollinate vanilla by hand.", article: food-vanilla}
- {year: 1849, title: Lincoln's patent, text: Abraham Lincoln patents a device to lift boats over sandbanks., article: inventions-weird}
- {year: 1893, title: Public Ganesh Chaturthi, text: Bal Gangadhar Tilak helps turn the festival into a public celebration in Pune., article: myths-ganesha-stories}
- {year: 1905, title: The first ice lolly, text: An 11-year-old leaves a drink with a stick outside on a cold night., article: inventions-kids}
- {year: 1912, title: Home of the blizzard, text: Douglas Mawson's team battles fierce winds at Commonwealth Bay., article: extreme-windiest}
- {year: 1931, title: Valley of Flowers found by climbers, text: Frank Smythe's lost party stumbles into the Himalayan valley., article: india-wonder-valley-flowers}
- {year: 1934, title: Mount Washington gust, text: A wind gust of 372 km/h is measured on the US mountain., article: extreme-windiest}
- {year: 1936, title: Indian games in Berlin, text: An Amravati club shows kho-kho and mallakhamb at the Berlin Olympics., article: sport-kho-kho-world}
- {year: 1961, title: Tristan evacuated, text: A volcanic eruption forces everyone on Tristan da Cunha to leave., article: extreme-loneliest-island}
- {year: 1969, title: The Jaipur Foot, text: A low-cost artificial foot is developed in Jaipur., article: inventions-india-modern}
- {year: 1992, title: The impossible target, text: "Rain leaves South Africa needing 22 runs off one ball in a World Cup semi-final.", article: maths-cricket-dls}
- {year: 1995, title: Gobekli Tepe dig begins, text: Klaus Schmidt's team starts excavating the hilltop site., article: mystery-gobekli}
- {year: 1996, title: Record wind gust, text: A gust of 408 km/h is measured on Barrow Island during Cyclone Olivia., article: extreme-windiest}
- {year: 1997, title: Duckworth-Lewis debuts, text: The rain rule is first used in an international match in Harare., article: maths-cricket-dls}
- {year: 2001, title: The wheel is patented, text: An Australian lawyer patents the wheel to expose a flawed system., article: inventions-weird}
- {year: 2004, title: Andaman reefs lifted, text: The Indian Ocean earthquake lifts parts of the northern Andaman Islands., article: india-wonder-andaman-reefs}
- {year: 2005, title: Valley of Flowers joins UNESCO list, text: The valley is added to the Nanda Devi World Heritage Site., article: india-wonder-valley-flowers}
- {year: 2013, title: The blue glass planet, text: Hubble measures the deep blue colour of HD 189733b., article: space-weird-rain}
- {year: 2016, title: UPI launched, text: India's Unified Payments Interface goes live., article: inventions-india-modern}
- {year: 2018, title: Beetles escape toads, text: Japanese scientists show swallowed bombardier beetles can make toads vomit them out., article: power-bombardier-beetle}
- {year: 2021, title: First sounds from Mars, text: The Perseverance rover records wind and other sounds on Mars., article: space-weird-sound}
- {year: 2022, title: A black hole you can hear, text: NASA releases a sound made from pressure waves around the Perseus black hole., article: space-weird-sound}
- {year: 2025, title: First Kho Kho World Cup, text: Teams from 23 countries play in New Delhi and India win both titles., article: sport-kho-kho-world}
