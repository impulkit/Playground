- {year: 1730, title: The Khejarli sacrifice, text: Bishnoi villagers near Jodhpur give their lives to protect khejri trees., article: chipko}
- {year: 1787, title: US Constitution signed, text: 39 delegates sign the Constitution in Philadelphia., article: us-constitution}
- {year: 1803, title: Marbury v. Madison, text: The US Supreme Court rules it can strike down unconstitutional laws., article: supreme-courts}
- {year: 1872, title: Yellowstone protected, text: The USA creates the world's first national park., article: national-parks}
- {year: 1901, title: First Nobel Peace Prize, text: Henry Dunant and Frédéric Passy share the first Peace Prize., article: nobel-peace}
- {year: 1921, title: Harappa excavated, text: Digging begins at Harappa and reveals a forgotten civilisation., article: indus-cities}
- {year: 1936, title: India's first national park, text: Hailey National Park opens; it is later renamed Jim Corbett National Park., article: national-parks}
- {year: 1947, title: The Radcliffe Line, text: A border between India and Pakistan is drawn in about five weeks., article: borders-why}
- {year: 1948, title: Universal Declaration of Human Rights, text: The UN adopts a shared list of rights for every human being., article: human-rights}
- {year: 1950, title: India's Constitution begins, text: India becomes a republic and its Supreme Court starts work., article: constitution}
- {year: 1950, title: Missionaries of Charity founded, text: Mother Teresa starts her order of nuns in Kolkata., article: mother-teresa}
- {year: 1951, title: Refugee Convention, text: Countries agree a treaty protecting people who flee danger., article: refugees}
- {year: 1951, title: India's first general election, text: About 17 crore voters can take part in India's first national election., article: vote-how}
- {year: 1962, title: Silent Spring published, text: Rachel Carson warns that the pesticide DDT is harming wildlife., article: environment-heroes}
- {year: 1968, title: Abu Simbel saved, text: Engineers finish moving the temples above the rising waters of a new dam lake., article: unesco-sites}
- {year: 1971, title: Ping-pong diplomacy, text: An American table tennis team visits China., article: olympics-peace}
- {year: 1972, title: World Heritage Convention, text: UNESCO countries agree to protect places of value to all humanity., article: unesco-sites}
- {year: 1973, title: Basic structure ruling, text: India's Supreme Court rules Parliament cannot destroy the Constitution's basic structure., article: supreme-courts}
- {year: 1974, title: Women of Reni stop loggers, text: Gaura Devi and village women protect their forest in the Chipko movement., article: chipko}
- {year: 1977, title: Green Belt Movement, text: Wangari Maathai starts a tree-planting movement led by Kenyan women., article: wangari-maathai}
- {year: 1980, title: Bachpan Bachao Andolan, text: Kailash Satyarthi founds a movement to free children from forced work., article: kailash-satyarthi}
- {year: 1989, title: Children's rights treaty, text: The UN adopts the Convention on the Rights of the Child., article: rights-kids}
- {year: 1990, title: Americans with Disabilities Act, text: A US law requires buildings and transport to be accessible., article: disabilities-inclusion}
- {year: 2011, title: South Sudan joins the UN, text: The world's newest UN member state becomes independent., article: countries-how-many}
- {year: 2014, title: Malala and Satyarthi win Nobel, text: A Pakistani teenager and an Indian campaigner share the Peace Prize., article: malala}
- {year: 2015, title: India–Bangladesh enclave swap, text: The two countries exchange 162 enclaves along their border., article: borders-why}
- {year: 2016, title: First Refugee Olympic Team, text: Ten refugee athletes compete at the Rio Olympics., article: olympics-peace}
- {year: 1498, title: Vasco da Gama reaches Calicut, text: A Portuguese fleet sails around Africa to the spice coast of Kerala., article: trade-routes}
- {year: 1569, title: Mercator's map, text: Gerardus Mercator publishes a world map made for sailors., article: maps-flat}
- {year: 1822, title: Hieroglyphs decoded, text: Champollion uses the Rosetta Stone to read Egyptian writing., article: writing-began}
- {year: 1837, title: Brahmi read again, text: James Prinsep deciphers the script of Ashoka's inscriptions., article: writing-began}
- {year: -2560, title: Great Pyramid built, text: Egyptian workers raise the Great Pyramid for the pharaoh Khufu., article: pyramids}
- {year: -221, title: Walls joined, text: China's first emperor begins linking older walls into one long barrier., article: great-wall}
- {ago: 200000000, title: Pangaea breaks apart, text: The supercontinent starts splitting into today's continents., article: continents}
