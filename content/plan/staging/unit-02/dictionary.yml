- {id: axis, word: axis, meaning: "An imaginary line through the middle of something that spins. Earth spins around its axis once a day.", see: day-night}
- {id: distributary, word: distributary, meaning: "A smaller channel that branches off a river and flows away from it, often in a delta.", see: deltas}
- {id: greenhouse-gas, word: greenhouse gas, meaning: "A gas in the air, like carbon dioxide or methane, that traps heat and keeps Earth warm.", see: climate-change}
- {id: humus, word: humus, meaning: "The dark, crumbly part of soil made from rotted leaves, roots and other once-living things.", see: soil-made}
- {id: ozone, word: ozone, meaning: "A form of oxygen with three oxygen atoms instead of two. High in the sky, it blocks harmful ultraviolet light.", see: ozone-layer}
- {id: ultraviolet, word: ultraviolet, meaning: "A kind of light from the Sun that our eyes cannot see. Too much of it causes sunburn.", see: ozone-layer}
- {id: weathering, word: weathering, meaning: "The slow breaking down of rock by rain, heat, cold, ice, plants and living things.", see: soil-made}
