- {year: 1784, title: First pterosaur described, text: A strange flying reptile from German limestone puzzles scientists., article: pterosaurs}
- {year: 1828, title: Mary Anning's pterosaur, text: The first pterosaur skeleton found in Britain turns up at Lyme Regis., article: pterosaurs}
- {year: 1856, title: Eunice Foote's experiment, text: Jars of gas in the sun show that carbon dioxide traps heat., article: climate-change}
- {year: 1852, title: Peak XV is the highest, text: Radhanath Sikdar calculates that the peak later named Everest is the world's highest., article: mountains-tallest}
- {year: 1877, title: Stegosaurus named, text: Othniel Charles Marsh names the plated dinosaur during the Bone Wars., article: stegosaurus}
- {year: 1881, title: Darwin's worm book, text: Charles Darwin's last book shows how earthworms make and mix soil., article: soil-made}
- {year: 1885, title: First snowflake photo, text: Wilson Bentley photographs a single snowflake in Vermont., article: snow-hail}
- {year: 1902, title: First T. rex skeleton, text: Barnum Brown digs up giant bones at Hell Creek in Montana., article: trex-montana}
- {year: 1905, title: Tyrannosaurus rex named, text: Henry Fairfield Osborn names the "tyrant lizard king"., article: trex-montana}
- {year: 1930, title: The Dust Bowl, text: Drought and wind strip soil from the US Great Plains through the 1930s., article: soil-made}
- {year: 1958, title: Keeling Curve begins, text: Carbon dioxide measurements start on Mauna Loa in Hawaii., article: climate-change}
- {year: 1980, title: The asteroid idea, text: Luis and Walter Alvarez link iridium-rich clay to a giant impact., article: iridium-evidence}
- {year: 1980, title: Mount St. Helens collapses, text: The largest landslide in recorded history opens a volcanic eruption., article: landslides}
- {year: 1985, title: Ozone hole reported, text: British Antarctic Survey scientists report thinning ozone over Antarctica., article: ozone-layer}
- {year: 1987, title: Montreal Protocol, text: Countries agree to phase out chemicals that destroy the ozone layer., article: ozone-layer}
- {year: 1990, title: Sue is found, text: Sue Hendrickson finds a nearly complete T. rex in South Dakota., article: trex-montana}
- {year: 1991, title: Chicxulub crater confirmed, text: A buried crater in Mexico is shown to match the dinosaur extinction., article: iridium-evidence}
- {year: 2003, title: Rajasaurus named, text: Indian and American scientists name India's crested hunter., article: rajasaurus}
- {year: 2007, title: Lyuba the baby mammoth, text: A reindeer herder finds a frozen baby mammoth in Siberia., article: mammoths}
- {year: 2020, title: Everest remeasured, text: Nepal and China announce a joint height of 8848.86 m., article: mountains-tallest}
- {year: 2020, title: Lonar Lake turns pink, text: Salt-loving microbes colour a crater lake in Maharashtra., article: lakes-salty}
- {ago: 66000000, title: Mammals inherit the Earth, text: Small survivors of the asteroid spread into an emptied world., article: mammals-rise}
- {ago: 20000, title: Ice Age at its coldest, text: Ice sheets cover much of North America and the sea is about 120 m lower., article: ice-ages}
- {ago: 4000, title: Last mammoths, text: The last woolly mammoths die out on Wrangel Island., article: mammoths}
