- {year: 1932, title: Earhart flies the Atlantic alone, text: Amelia Earhart becomes the first woman to fly solo across the Atlantic., article: mystery-amelia-earhart}
- {year: 1937, title: Amelia Earhart vanishes, text: "Earhart and Fred Noonan disappear over the Pacific near Howland Island.", article: mystery-amelia-earhart}
- {year: 1010, title: Brihadeeswara completed, text: Rajaraja Chola I finishes the great granite temple at Thanjavur., article: india-wonder-brihadeeswara}
- {year: 1982, title: The Mountain Man finishes his path, text: Dashrath Manjhi completes his 22-year cut through a ridge near Gehlaur in Bihar., article: india-mountain-man}
- {year: 2016, title: Gotthard Base Tunnel opens, text: "The world's longest railway tunnel, 57.1 km, opens under the Swiss Alps.", article: extreme-longest-tunnels}
- {year: 1994, title: Channel Tunnel opens, text: A railway tunnel under the sea links England and France., article: extreme-longest-tunnels}
- {year: 1958, title: First implanted pacemaker, text: Arne Larsson in Stockholm becomes the first person to have a pacemaker placed inside his body., article: accident-pacemaker}
- {year: 2007, title: Tardigrades survive space, text: Dried tardigrades spend 10 days exposed to open space and some survive., article: extreme-toughest-animal}
- {year: 2023, title: Chandrayaan-3 lands, text: India's Vikram lander touches down near the Moon's south pole and works for one lunar day., article: what-if-live-on-moon}
- {year: 2026, title: Artemis II flies around the Moon, text: Four astronauts travel around the Moon for the first time since 1972., article: what-if-live-on-moon}
- {year: 1971, title: The waffle sole, text: Bill Bowerman pours rubber into a waffle iron to make a running shoe sole., article: sport-science-shoes}
- {year: 2026, title: Marathon under two hours, text: Sabastian Sawe runs 1:59:30 at the London Marathon for a world record., article: sport-science-shoes}
- {year: 1994, title: Sistine Chapel cleaning ends, text: "A 14-year cleaning of Michelangelo's ceiling is completed.", article: behind-art-restoration}
- {year: -240, title: Eratosthenes measures Earth, text: A Greek scholar in Egypt uses shadows to work out the size of the round Earth., article: what-if-earth-flat}
- {year: 1858, title: The Möbius strip, text: August Möbius and Johann Listing separately discover the one-sided strip., article: puzzle-mobius}
- {year: 1998, title: Mimic octopus filmed, text: Scientists first record the mimic octopus off Sulawesi in Indonesia., article: ocean-mimic-octopus}
- {ago: 300000000, title: Age of giant insects, text: Griffinflies with wingspans of about 70 cm fly over coal swamp forests., article: lost-giant-insects}
- {year: 1942, title: Roopkund skeletons found, text: A forest ranger finds hundreds of skeletons around a Himalayan lake., article: mystery-roopkund}
- {year: 1063, title: Rani ki Vav built, text: Queen Udayamati builds a seven-level stepwell at Patan in memory of her husband., article: india-wonder-rani-ki-vav}
- {year: 2014, title: Rani ki Vav joins UNESCO list, text: The Queen's Stepwell becomes a World Heritage Site., article: india-wonder-rani-ki-vav}
- {year: 2015, title: Stockholm Water Prize for Rajendra Singh, text: The Waterman of India is honoured for reviving rivers in Rajasthan., article: india-water-man}
- {year: 1909, title: Safety glass patented, text: Édouard Bénédictus patents laminated glass after a dropped flask fails to shatter., article: accident-safety-glass}
- {year: 1994, title: Comet hits Jupiter, text: Pieces of comet Shoemaker-Levy 9 crash into Jupiter., article: what-if-jupiter-close}
- {year: 2023, title: Pepper X named hottest chilli, text: Guinness World Records names Pepper X the hottest chilli on record., article: food-science-spicy-milk}
- {year: 1975, title: The Jaws theme, text: John Williams writes the two-note shark theme for the film Jaws., article: behind-theme-music}
- {year: 2016, title: Sri Lanka malaria-free, text: The WHO declares Sri Lanka free of malaria., article: what-if-no-mosquitoes}
- {year: 1958, title: The Penrose triangle, text: Lionel and Roger Penrose publish the impossible triangle and endless stairs., article: puzzle-impossible-shapes}
- {year: 2012, title: Jump from the stratosphere, text: Felix Baumgartner jumps from about 39 km and falls faster than sound., article: sky-skydiving}
- {ago: 60000000, title: Titanoboa, text: "A snake about 13 m long lives in the swamps of what is now Colombia.", article: lost-titanoboa}
- {ago: 47000000, title: Vasuki indicus, text: A giant snake lives in what is now Kutch in Gujarat., article: lost-titanoboa}
