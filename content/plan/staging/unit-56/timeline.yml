- {year: 1920, title: The theremin, text: Leon Theremin builds an instrument played without touching it., article: electronic-music}
- {year: 1982, title: Ragas to a disco beat, text: Charanjit Singh records ten ragas on Roland machines in Bombay., article: electronic-music}
- {year: 1928, title: Sliced bread goes on sale, text: "A bakery in Chillicothe, Missouri, sells the first machine-sliced loaves.", article: bread-factory}
- {year: 1806, title: Twinkle Twinkle written, text: "Jane Taylor publishes her poem The Star, later known as Twinkle, Twinkle, Little Star.", article: poems-for-kids}
- {year: -46, title: Caesar's calendar, text: Julius Caesar brings in a 365-day year with a leap day every four years., article: calendar-maths}
- {year: 1752, title: Eleven days skipped, text: Britain and its colonies jump from 2 to 14 September to fix the calendar., article: calendar-maths}
- {year: 1937, title: Golden Gate Bridge opens, text: San Francisco's suspension bridge opens to walkers on 27 May., article: golden-gate}
- {year: 2018, title: Doshi wins the Pritzker, text: Balkrishna Doshi becomes the first Indian to win architecture's top prize., article: jobs-architect}
- {year: 1892, title: The vacuum flask, text: James Dewar makes a double-walled flask to keep liquid gases cold., article: thermos-flask}
- {year: 1848, title: Girls' school at Bhide Wada, text: Savitribai and Jyotirao Phule open a school for girls in Pune., article: savitribai-phule}
- {year: 1897, title: Savitribai Phule dies, text: She dies of plague after caring for patients in Pune., article: savitribai-phule}
- {year: 1999, title: The word hackathon, text: Programmers in Canada and the USA first use the word hackathon., article: hackathons}
- {year: 1929, title: The first Oscars, text: The first Academy Awards ceremony in Hollywood lasts about 15 minutes., article: oscars}
- {year: 1983, title: First Indian Oscar, text: Bhanu Athaiya wins for her costume designs for the film Gandhi., article: oscars}
- {year: 1931, title: Alam Ara, text: India's first sound film comes out with seven songs., article: film-music-composers}
- {year: 1992, title: Roja's music, text: A.R. Rahman's first film score changes the sound of Indian film music., article: film-music-composers}
- {year: 1875, title: Milk chocolate, text: Daniel Peter in Switzerland mixes chocolate with milk., article: chocolate-world}
- {year: 1840, title: The Penny Black, text: Britain issues the first sticky postage stamp., article: letters-writing}
- {year: 1972, title: India's PIN codes, text: India introduces six-digit postal PIN codes., article: letters-writing}
- {year: 1983, title: Growing dominoes, text: Physicist Lorne Whitehead shows a domino can topple one 1.5 times bigger., article: dominoes-maths}
- {year: 1936, title: Hoover Dam finished, text: The giant dam on the Colorado River is completed two years early., article: hoover-dam}
- {year: 1761, title: First veterinary school, text: The world's first veterinary school opens in Lyon, France., article: jobs-vet}
- {year: 1843, title: Hand-cranked ice cream freezer, text: Nancy Johnson of Philadelphia patents a salt-and-ice ice cream maker., article: ice-cream-freezing}
- {year: 1873, title: Satyashodhak Samaj, text: Jyotirao Phule founds the Truth-Seekers' Society and publishes Gulamgiri., article: jyotirao-phule}
- {year: 1998, title: COPPA passed, text: A US law limits how websites collect data from children under 13., article: app-safety}
- {year: 2023, title: India's data protection law, text: India passes the Digital Personal Data Protection Act., article: app-safety}
- {year: 1932, title: First film festival, text: The Venice Film Festival is held for the first time., article: film-festivals}
- {year: 1946, title: Cannes opens, text: The Cannes Film Festival is held for the first time after a wartime delay., article: film-festivals}
- {year: 2011, title: Music and dopamine, text: Scientists at McGill University show favourite music releases dopamine in the brain., article: music-brain}
- {year: 1498, title: Vienna Boys' Choir, text: The famous boys' choir is founded in Vienna., article: choirs}
- {year: 1666, title: Pepys and the Great Fire, text: Samuel Pepys records the Great Fire of London in his diary., article: diaries}
- {year: 1942, title: Anne Frank's diary, text: Anne Frank receives her diary on her 13th birthday., article: diaries}
- {year: 1904, title: Times Square named, text: Longacre Square is renamed after The New York Times., article: times-square}
- {year: 1907, title: First ball drop, text: A lit ball is lowered in Times Square to mark the New Year., article: times-square}
- {year: 1888, title: Air-filled tyres, text: John Boyd Dunlop makes air-filled tyres for his son's tricycle in Belfast., article: tyres}
- {year: 1856, title: Widow Remarriage Act, text: "After Vidyasagar's campaign, a law allows Hindu widows to remarry.", article: ishwar-chandra}
- {year: 1855, title: Barnaparichay, text: Vidyasagar publishes his Bengali first reader., article: ishwar-chandra}
- {year: 1996, title: Internet Archive begins, text: The Internet Archive starts saving copies of web pages., article: digital-footprint}
