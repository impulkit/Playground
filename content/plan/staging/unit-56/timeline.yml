- {year: 1874, title: Impressionism named, text: "A critic mocks Monet's Impression, Sunrise and names the Impressionists.", article: impressionists-monet}
- {year: 1975, title: US school breakfasts, text: The US School Breakfast Program is made permanent., article: breakfast-world}
