"Most people miss these too. Every answer is a story.": "பெரும்பாலானோரும் இவற்றைத் தவறவிடுகிறார்கள். ஒவ்வொரு பதிலும் ஒரு கதை."
"Most people get 0 or 1. Not bad at all.": "பெரும்பாலானோர் 0 அல்லது 1 தான் சரியாகச் சொல்வார்கள். மோசமில்லை."
"Sharper than most people.": "பெரும்பாலானோரை விடக் கூர்மை."
"Perfect. You really know your week.": "சரியானது. இந்த வாரத்தை நன்றாகத் தெரிந்து வைத்திருக்கிறீர்கள்."
"Another one from this week's news.": "இந்த வாரச் செய்திகளிலிருந்து இன்னொன்று."
"{n} day now": "இப்போது {n} நாள்"
"No streak yet": "இன்னும் தொடர்ச்சி இல்லை"
