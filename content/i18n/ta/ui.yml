"Kyun has no ads, no accounts, no chat and no tracking. Reading history, saved stories and usage numbers stay on this device unless you choose to send a report below. Photos load from Wikimedia Commons, which receives standard web requests.": "Kyun-இல் விளம்பரம் இல்லை, கணக்கு இல்லை, அரட்டை இல்லை, கண்காணிப்பும் இல்லை. படித்த கதைகள், சேமித்த கதைகள், பயன்பாட்டு எண்ணிக்கைகள் எல்லாம் இந்தச் சாதனத்திலேயே இருக்கும், நீங்களாகக் கீழே அறிக்கை அனுப்பினால் தவிர. படங்கள் Wikimedia Commons-இலிருந்து வருகின்றன, அதற்குச் சாதாரண இணையக் கோரிக்கைகள் மட்டுமே செல்லும்."
