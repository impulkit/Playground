# Tamil subject names and taglines, keyed by subject id.
lost:
  name: "தொலைந்த உலகங்கள்"
  tagline: "டைனோசர்கள், புதைபடிவங்கள், வானம் இடிந்து விழுந்த அந்த நாள்"
earth:
  name: "அமைதியில்லாப் பூமி"
  tagline: "நகரும் கண்டங்கள், உயரும் மலைகள், அதிரடி வானிலை"
space:
  name: "விண்வெளி"
  tagline: "சிறுகோள்கள், நிலவுகள், நட்சத்திரங்கள், விண்வெளிப் பயணங்கள்"
sky:
  name: "சிறகுகளும் வானமும்"
  tagline: "பறவைகள், வௌவால்கள், விமானங்கள், நீண்ட பயணங்கள்"
ocean:
  name: "ஆழ்கடல்"
  tagline: "ஒளிரும் மீன்கள், ராட்சதத் திமிங்கிலங்கள், ஆழத்தின் கும்மிருட்டு"
wild:
  name: "காட்டு உலகம்"
  tagline: "புலிகள், ஆலமரங்கள், மின்மினிகள், பக்கத்து வீட்டு உயிரினங்கள்"
how:
  name: "எப்படி இயங்குகிறது?"
  tagline: "இயந்திரங்கள், பொருட்கள், ஒலி, அன்றாட அறிவியல்"
art:
  name: "கலையும் இசையும்"
  tagline: "குகை ஓவியங்கள், வண்ணங்கள், ராகங்கள், கோலங்கள்"
people:
  name: "மக்களும் சமூகமும்"
  tagline: "அரசுகள், உரிமைகள், வாக்குகள், நாம் சேர்ந்து வாழும் விதம்"
numbers:
  name: "எண்களும் வடிவங்களும்"
  tagline: "பூஜ்ஜியம், குறியீடுகள், கோடிகள், தேன்கூடுகள்"
pop:
  name: "கதைகள், பாடல்கள், விளையாட்டு"
  tagline: "விளையாட்டு, திரைப்படங்கள், இசை, ஆட்டங்கள், திருவிழாக்கள்"
body:
  name: "மனித உடல்"
  tagline: "மூளை, எலும்புகள், கிருமிகள், விக்கல் ஏன் வருகிறது"
tech:
  name: "கண்டுபிடிப்புகளும் தொழில்நுட்பமும்"
  tagline: "கம்ப்யூட்டர்கள், கண்டுபிடிப்பாளர்கள், எல்லாவற்றையும் மாற்றிய இயந்திரங்கள்"
history:
  name: "வரலாறு"
  tagline: "பேரரசுகள், ஆய்வுப் பயணிகள், உலகை மாற்றிய மனிதர்கள்"
places:
  name: "நாடுகளும் பண்பாடுகளும்"
  tagline: "நகரங்கள், நாடுகள், உலகெங்கும் மக்கள் வாழும் விதம்"
words:
  name: "நூல்களும் மொழியும்"
  tagline: "எழுத்துகள், காப்பியங்கள், கவிஞர்கள், காலம் கடந்து நிற்கும் கதைகள்"
food:
  name: "உணவும் அன்றாட வாழ்வும்"
  tagline: "நாம் உண்பது, உடுப்பது, பயன்படுத்துவது, அவை எங்கிருந்து வருகின்றன"

explained:
  name: "செய்தியில்"
  tagline: "இன்று செய்தியில்"
