- id: inscription
  word: "கல்வெட்டு"
  meaning: "கல், உலோகம் போன்ற கடினமான பரப்பின் மீது செதுக்கப்பட்ட அல்லது எழுதப்பட்ட சொற்கள்."
- id: insulator
  word: "அரிதிற்கடத்தி"
  meaning: "பிளாஸ்டிக் போல, வெப்பமோ மின்சாரமோ எளிதாகத் தன் வழியே செல்ல விடாத பொருள்."
- id: interest
  word: "வட்டி"
  meaning: "கடன் வாங்கிய பணத்துக்குக் கூடுதலாகச் செலுத்தும் பணம், அல்லது சேமிப்புக்குக் கிடைக்கும் கூடுதல் பணம். பொதுவாக ஆண்டுக்கு இத்தனை சதவீதம் என்று கணக்கிடப்படும்."
- id: interference
  word: "அலைக் குறுக்கீடு"
  meaning: "இரண்டு அலைகள் சந்திக்கும்போது நடப்பது: அவை சேர்ந்து பெரிய அலையாகலாம், அல்லது ஒன்றை ஒன்று ரத்துசெய்து மறைந்தும் போகலாம்."
- id: intertidal
  word: "ஓத இடைப் பகுதி"
  meaning: "கடல் ஏற்றத்தின்போது நீருக்கடியில் மூழ்கியும், கடல் இறக்கத்தின்போது வெளியே தெரிந்தும் இருக்கும் கடற்கரைப் பகுதி."
- id: invertebrate
  word: "முதுகெலும்பில்லாத உயிரி"
  meaning: "பூச்சி, புழு போல, முதுகெலும்பு இல்லாத விலங்கு."
- id: iridium
  word: "இரிடியம்"
  meaning: "அரிதான, கனமான உலோகம். பூமியின் இரிடியத்தில் பெரும்பகுதி நெடுங்காலத்துக்கு முன்பே உட்கருவுக்குள் மூழ்கிவிட்டதால் மேற்பரப்பில் அது குறைவு; ஆனால் பல சிறுகோள்களில் நிறையவே உண்டு."
- id: iris
  word: "கருவிழி"
  meaning: "கண்மணியைச் சுற்றியுள்ள, கண்ணின் வண்ண வளையம்."
- id: irrigation
  word: "நீர்ப்பாசனம்"
  meaning: "குழாய்கள், கால்வாய்கள் அல்லது தெளிப்பான்கள் மூலம் வயல்களுக்குத் தண்ணீர் கொண்டு வருவது."
- id: isotope
  word: "ஐசோடோப்பு"
  meaning: "ஒரு தனிமத்தின் பல வடிவங்களில் ஒன்று. இந்த வடிவங்களின் அணுக்கள் வெவ்வேறு எடை கொண்டவை."
- id: karst
  word: "கார்ஸ்ட் நிலம்"
  meaning: "மழைநீர் சுண்ணாம்புக்கல்லை மெதுவாகக் கரைத்துச் செதுக்கும்போது உருவாகும், குகைகள், புதைகுழிகள், பாறைத் தூண்கள் நிறைந்த நிலப்பரப்பு."
- id: keratin
  word: "கெரட்டின்"
  meaning: "முடி, நகம், விலங்குகளின் கூர்நகம், குளம்பு, கொம்பு எல்லாம் உருவாகியிருக்கும் உறுதியான புரதம்."
- id: keystone-species
  word: "முக்கிய ஆதார இனம்"
  meaning: "தன் வாழிடத்தின் முழுச் சமூகத்தையும் ஒன்றாகத் தாங்கிப் பிடிக்கும் உயிரினம். அதை நீக்கிவிட்டால் சுற்றியுள்ள எல்லாமே மாறிவிடும்."
- id: kiln
  word: "சூளை"
  meaning: "களிமண், செங்கல், கண்ணாடி இவற்றைக் கெட்டியாக்கப் பயன்படும், மிகச் சூடான அடுப்பு."
- id: kinetic-energy
  word: "இயக்க ஆற்றல்"
  meaning: "ஒரு பொருள் நகர்ந்துகொண்டிருப்பதால் அதற்கு இருக்கும் ஆற்றல்."
- id: lactose
  word: "லாக்டோஸ்"
  meaning: "பாலில் இயற்கையாக இருக்கும் சர்க்கரை."
- id: lagoon
  word: "காயல்"
  meaning: "மணல் அல்லது பாறைத் திட்டால் கடலிலிருந்து பிரிக்கப்பட்ட, ஆழமில்லாத நீர்ப்பரப்பு. பெரும்பாலும் கடலோடு ஒரு குறுகிய வாய் வழியே இணைந்திருக்கும்."
- id: lanolin
  word: "லானோலின்"
  meaning: "செம்மறியாட்டின் கம்பளியில் இயற்கையாக இருக்கும் கொழுப்புப் பசை. இது கம்பளியில் தண்ணீர் ஊறாமல் காக்கிறது; தோலுக்கான க்ரீம்களிலும் பயன்படுகிறது."
- id: larva
  word: "இளம்புழு"
  meaning: "கம்பளிப்பூச்சி போல, ஒரு பூச்சி முழு வளர்ச்சி அடைவதற்கு முந்தைய இளம் வடிவம்."
- id: larynx
  word: "குரல்வளை"
  meaning: "தொண்டையில், மூச்சுக்குழாயின் மேல்முனையில் இருக்கும் உங்கள் குரல் பெட்டி. குரல் நாண்கள் இதற்குள்தான் இருக்கின்றன."
- id: latitude
  word: "அட்சரேகை"
  meaning: "ஒரு இடம் நிலநடுக்கோட்டிலிருந்து எவ்வளவு வடக்கே அல்லது தெற்கே இருக்கிறது என்பது. இதைப் பாகைகளில் அளக்கிறோம்."
- id: lava
  word: "எரிமலைக் குழம்பு"
  meaning: "பூமியின் மேற்பரப்புக்கு வெளியே வந்துவிட்ட உருகிய பாறை. பூமிக்கடியில் இருக்கும்போது இதை மாக்மா என்கிறோம்."
- id: legume
  word: "பருப்பு வகைத் தாவரம்"
  meaning: "பட்டாணி, பீன்ஸ், பருப்பு, வேர்க்கடலை போல, காய்களுக்குள் விதைகளை வளர்க்கும் தாவரம்."
- id: lens
  word: "லென்ஸ்"
  meaning: "ஒளியை வளைக்கும், வளைவான கண்ணாடி அல்லது பிளாஸ்டிக் துண்டு. மூக்குக்கண்ணாடிகளிலும் கேமராக்களிலும் பயன்படுகிறது."
- id: lever
  word: "நெம்புகோல்"
  meaning: "பொருட்களைத் தூக்கவோ நகர்த்தவோ உதவ, ஒரு நிலையான புள்ளியில் சுழலும் கம்பு."
- id: lexicographer
  word: "அகராதியியலாளர்"
  meaning: "அகராதிகளை எழுதித் தொகுப்பவர்."
- id: lift
  word: "மேலுந்து விசை"
  meaning: "இறக்கை காற்றில் நகரும்போது அதை மேல்நோக்கித் தள்ளும் விசை."
- id: ligament
  word: "தசைநார்"
  meaning: "மூட்டில் எலும்புகளை ஒன்றாகப் பிணைத்து வைக்கும் உறுதியான பட்டை."
- id: lightyear
  word: "ஒளியாண்டு"
  meaning: "ஒளி ஒரு ஆண்டில் பயணிக்கும் தூரம்: சுமார் 9.5 லட்சம் கோடி கிலோமீட்டர். இது நேரத்தை அல்ல, தூரத்தை அளக்கிறது!"
- id: lithograph
  word: "கல்லச்சு"
  meaning: "தட்டையான கல் அல்லது உலோகத் தகட்டின் மீது எண்ணெய்ப் பசையுள்ள மையால் வரைந்து, அதன் மேல் காகிதத்தை அழுத்தி எடுக்கும் அச்சு."
- id: loom
  word: "தறி"
  meaning: "நூல்களை இறுக்கமாகப் பிடித்து வைத்து, அவற்றைத் துணியாக நெய்ய உதவும் சட்டம் அல்லது இயந்திரம்."
- id: magma
  word: "மாக்மா"
  meaning: "இன்னும் பூமிக்கடியிலேயே இருக்கும் உருகிய பாறை. அது வெளியே வந்தால் எரிமலைக் குழம்பு என்கிறோம்."
- id: mammal
  word: "பாலூட்டி"
  meaning: "முடி அல்லது உரோமம் கொண்டு, தங்கள் குட்டிகளுக்குப் பால் கொடுக்கும் விலங்குகள். நாய், திமிங்கிலம், வௌவால், நீங்களும்தான்."
- id: mammoth
  word: "மாமூத்"
  meaning: "யானையின் உறவினரான, பெரிய, அடர்ந்த முடி கொண்ட விலங்கு. பல ஆயிரம் ஆண்டுகளுக்கு முன்பே அழிந்துவிட்டது."
- id: mantle
  word: "கவசம்"
  meaning: "புவி மேலோட்டுக்குக் கீழே உள்ள, சூடான பாறையாலான தடிமனான அடுக்கு. மிகக் கெட்டியான பாகு போல, இது மிக மிக மெதுவாக ஓடுகிறது."
- id: manuscript
  word: "கையெழுத்துப் பிரதி"
  meaning: "கையால் எழுதப்பட்ட நூல் அல்லது ஆவணம். ஓலைச்சுவடிகளும் இதில் அடங்கும்."
- id: marsupial
  word: "பைம்மா"
  meaning: "குட்டிகள் மிகச் சிறியதாகப் பிறந்து, தாயின் வயிற்றில் உள்ள பைக்குள் வளர்ச்சியை முடிக்கும் பாலூட்டி. கங்காரு போல."
- id: mass
  word: "நிறை"
  meaning: "ஒரு பொருளில் எவ்வளவு பொருண்மை அடங்கியிருக்கிறது என்பது."
- id: matter
  word: "பருப்பொருள்"
  meaning: "இடத்தை அடைத்துக்கொண்டு, எடையும் கொண்ட எதுவும்."
- id: mausoleum
  word: "கல்லறை மாளிகை"
  meaning: "ஒருவரை அடக்கம் செய்வதற்காகக் கட்டப்பட்ட பெரிய, பிரமாண்டமான கட்டடம்."
- id: medieval
  word: "இடைக்கால"
  meaning: "ஏறக்குறைய கி.பி. 500 முதல் 1500 வரையிலான இடைக்காலத்தைச் சேர்ந்த."
- id: melanin
  word: "மெலனின்"
  meaning: "தோலுக்கும் முடிக்கும் கண்களுக்கும் நிறம் தரும் கருமை நிறமி."
- id: melanosome
  word: "மெலனோசோம்"
  meaning: "நிறத்தைத் தாங்கியிருக்கும், செல்களுக்குள் உள்ள சின்னஞ்சிறு பொட்டலம். ஒரு முடியின் அகலத்துக்குள் இவற்றில் டஜன் கணக்கானவற்றை வரிசையாக வைக்கலாம்."
- id: meridian
  word: "தீர்க்கரேகை"
  meaning: "வரைபடத்தில் வட துருவத்திலிருந்து தென் துருவம் வரை செல்வதாகக் கற்பனை செய்யப்படும் கோடு."
- id: metamorphosis
  word: "உருமாற்றம்"
  meaning: "வளரும்போது ஒரு விலங்கின் உடல் வடிவத்தில் நடக்கும் பெரிய மாற்றம். கம்பளிப்பூச்சி வண்ணத்துப்பூச்சியாவது போல, தலைப்பிரட்டை தவளையாவது போல."
- id: metaphor
  word: "உருவகம்"
  meaning: "ஒன்றை வேறொன்றாகவே சொல்லி விவரிப்பது. \"வகுப்பறை ஒரு மிருகக்காட்சிசாலை ஆகிவிட்டது\" என்பது போல."
- id: meteor
  word: "எரிகல்"
  meaning: "பூமியின் காற்றில் எரிந்துகொண்டே வரும் விண்வெளிப் பாறை. அதைத்தான் நாம் எரிநட்சத்திரமாகப் பார்க்கிறோம்."
- id: meteorite
  word: "விண்கல்"
  meaning: "தரையில் வந்து விழும் விண்வெளிப் பாறை."
- id: microbe
  word: "நுண்ணுயிரி"
  meaning: "பாக்டீரியா, ஈஸ்ட் போல, நுண்ணோக்கி இல்லாமல் பார்க்க முடியாத அளவுக்குச் சின்ன உயிரினம்."
- id: microgravity
  word: "நுண் ஈர்ப்பு"
  meaning: "பூமியைச் சுற்றித் தடையின்றி விழுந்துகொண்டிருக்கும் விண்கலத்துக்குள் மிதப்பது போன்ற உணர்வு. ஈர்ப்பு விசை அங்கேயும் இருக்கிறது, ஆனால் எல்லாமே ஒன்றாகச் சேர்ந்து விழுகின்றன."
- id: microorganism
  word: "நுண்ணுயிர்"
  meaning: "நுண்ணோக்கி இல்லாமல் பார்க்க முடியாத அளவுக்குச் சின்ன உயிரினம்."
- id: microplastic
  word: "நுண்நெகிழி"
  meaning: "5 மி.மீ.க்கும் சிறிய பிளாஸ்டிக் துண்டு. பெரும்பாலும் பெரிய பிளாஸ்டிக் பொருட்கள் உடைந்து இவை உண்டாகின்றன."
- id: microscope
  word: "நுண்ணோக்கி"
  meaning: "சின்னஞ்சிறு பொருட்களை மிகப் பெரிதாகக் காட்டும் கருவி."
- id: migration
  word: "வலசை போதல்"
  meaning: "பொதுவாகப் பருவங்களுக்கு ஏற்ப, இரண்டு இடங்களுக்கு இடையே வழக்கமாக நீண்ட பயணம் மேற்கொள்வது."
- id: minaret
  word: "மினார்"
  meaning: "மசூதியின் அருகே உள்ள உயரமான, மெல்லிய கோபுரம். இதிலிருந்து தொழுகைக்கான அழைப்பு விடுக்கப்படலாம்."
- id: mineral
  word: "கனிமம்"
  meaning: "படிகங்களால் ஆன இயற்கையான திடப்பொருள். குவார்ட்ஸ், உப்பு, கிளிஞ்சல்களில் உள்ள கால்சைட் போன்றவை."
- id: molecule
  word: "மூலக்கூறு"
  meaning: "ஒன்றோடொன்று இணைந்த அணுக்களின் சின்னஞ்சிறு குழு. ஒரு நீர் மூலக்கூறில் இரண்டு ஹைட்ரஜன் அணுக்களும் ஒரு ஆக்சிஜன் அணுவும் இருக்கின்றன."
- id: momentum
  word: "உந்தம்"
  meaning: "நகர்ந்துகொண்டிருக்கும் ஒன்றை நிறுத்துவது எவ்வளவு கடினம் என்பது. கனமானவைக்கும் வேகமானவைக்கும் உந்தம் அதிகம்."
- id: monarch
  word: "மன்னர்"
  meaning: "பொதுவாகக் குடும்ப வழியில் பதவியைப் பெறும் அரசர், அரசி அல்லது பேரரசர்."
- id: monarchy
  word: "முடியாட்சி"
  meaning: "அரசரோ அரசியோ ஆளும் நாடு."
- id: monastery
  word: "மடாலயம்"
  meaning: "துறவிகள் தங்கி, வழிபட்டு, கற்கும் இடம்."
- id: monolith
  word: "ஒற்றைக்கல் படைப்பு"
  meaning: "ஒரே ஒரு பெரிய கல்லிலிருந்து செதுக்கப்பட்ட ஒன்று. மாமல்லபுரத்தின் ரதங்கள் போல."
- id: monopoly
  word: "ஏகபோகம்"
  meaning: "வேறு யாரும் போட்டியிட அனுமதிக்கப்படாமல், ஒரு பொருளை விற்கவோ ஒரு இடத்தில் வணிகம் செய்யவோ ஒருவருக்கு மட்டுமே இருக்கும் உரிமை."
- id: monsoon
  word: "பருவமழை"
  meaning: "கனமழையைக் கொண்டுவரும் பருவக் காற்றுகள். குறிப்பாகக் கோடையில் தெற்காசியாவுக்கு மழை தருபவை."
- id: mordant
  word: "நிறமூன்றி"
  meaning: "சாயம் துணியில் ஒட்டிக்கொண்டு, துவைத்தாலும் நிறம் போகாமல் இருக்க உதவும் பொருள்."
- id: mosaic
  word: "மொசைக்"
  meaning: "கல், கண்ணாடி அல்லது ஓடுகளின் பல சின்னத் துண்டுகளைப் பதித்து உருவாக்கும் படம்."
- id: motif
  word: "அலங்கார வடிவம்"
  meaning: "ஒரு வடிவமைப்பில் திரும்பத் திரும்ப வரும் உருவம் அல்லது வடிவம்."
- id: mucus
  word: "சளி"
  meaning: "தூசியையும் கிருமிகளையும் பிடித்து வைக்க உடல் சுரக்கும், வழுவழுப்பான, பிசுபிசுப்பான திரவம். மூக்கில் வரும் சளி போல."
- id: mummy
  word: "மம்மி"
  meaning: "இறந்த பிறகு பாதுகாக்கப்பட்ட உடல். பெரும்பாலும் அதை உலர்த்தித் துணியால் சுற்றி வைப்பார்கள்."
- id: mural
  word: "சுவரோவியம்"
  meaning: "சுவரின் மீதே நேரடியாக வரையப்பட்ட பெரிய ஓவியம்."
- id: mutation
  word: "மரபணு மாற்றம்"
  meaning: "ஒரு உயிரினத்தின் டிஎன்ஏ குறியீட்டில் ஏற்படும் மாற்றம்."
- id: mycelium
  word: "பூஞ்சை இழைப்பின்னல்"
  meaning: "ஒரு பூஞ்சையின் மறைந்திருக்கும் உடல்: மண், மரம் அல்லது உணவுக்குள் பரவும் நுண்ணிய இழைகளின் கொத்து."
- id: mythology
  word: "புராணக் கதைகள்"
  meaning: "கடவுளர், வீரர்கள், உலகம் எப்படித் தோன்றியது என்பவை பற்றிய பழங்காலக் கதைகளின் தொகுப்பு."
- id: navigation
  word: "வழிகாணல்"
  meaning: "ஒரு இடத்திலிருந்து இன்னோர் இடத்துக்குச் செல்லும் வழியைக் கண்டுபிடிப்பது."
- id: nebula
  word: "நெபுலா"
  meaning: "விண்வெளியில் உள்ள வாயுவும் தூசும் கலந்த மிகப் பெரிய மேகம். சில நெபுலாக்களுக்குள் புதிய நட்சத்திரங்கள் பிறக்கின்றன."
- id: nectar
  word: "பூந்தேன்"
  meaning: "பூக்கள் சுரக்கும் இனிப்பான திரவம். பூவிலிருந்து பூவுக்கு மகரந்தத்தைக் கொண்டு செல்லும் பறவைகளையும் தேனீக்களையும் பிற விலங்குகளையும் இது ஈர்க்கிறது."
- id: nerve
  word: "நரம்பு"
  meaning: "உங்கள் மூளை அல்லது தண்டுவடத்துக்கும் உடலின் மற்ற பகுதிகளுக்கும் இடையே மின் செய்திகளைக் கொண்டு செல்லும், நீண்ட மெல்லிய செல்களின் கட்டு."
- id: neuron
  word: "நியூரான்"
  meaning: "நரம்பு செல். நியூரான்கள் சின்னஞ்சிறு மின் சமிக்ஞைகளாக மூளைக்குள்ளும் உடல் முழுவதும் செய்திகளைக் கொண்டு செல்கின்றன."
- id: nixtamalisation
  word: "நிக்ஸ்டமலைசேஷன்"
  meaning: "காய்ந்த மக்காச்சோளத்தைச் சுண்ணாம்பு (ஒருவகைக் கனிமப் பொடி) கலந்த நீரில் வேகவைத்து ஊறவைப்பது. இது சோளத்தை மென்மையாக்கி, அதிகச் சத்துள்ளதாக மாற்றுகிறது."
- id: nocturnal
  word: "இரவாடி"
  meaning: "பகலில் தூங்கி, இரவில் சுறுசுறுப்பாக இயங்கும்."
- id: nucleus
  word: "உட்கரு"
  meaning: "அணுவின் மையப்பகுதி, அல்லது செல்லின் கட்டுப்பாட்டு மையம்."
- id: nutrient
  word: "ஊட்டச்சத்து"
  meaning: "புரதம், வைட்டமின்கள், தாதுக்கள் போல, வளரவும் ஆற்றல் பெறவும் ஆரோக்கியமாக இருக்கவும் உடலுக்குத் தேவையான, உணவில் உள்ள பொருள்."
- id: nutrition
  word: "ஊட்டம்"
  meaning: "உங்கள் உடல் வளரவும் ஆரோக்கியமாக இருக்கவும் தேவையான உணவு."
- id: oasis
  word: "பாலைவனச் சோலை"
  meaning: "பாலைவனத்தில் தண்ணீர் இருக்கும் பசுமையான இடம்."
- id: observatory
  word: "வானாய்வகம்"
  meaning: "வானத்தை ஆராய்வதற்கான தொலைநோக்கிகள் கொண்ட கட்டடம். கொடைக்கானலில் இப்படி ஒன்று இருக்கிறது."
- id: ochre
  word: "காவிமண்"
  meaning: "இரும்பால் நிறம் பெற்ற இயற்கை மண். பழங்காலம் முதல் சிவப்பு, மஞ்சள், பழுப்பு வண்ணங்கள் தயாரிக்கப் பயன்படுகிறது."
- id: octave
  word: "எண்மம்"
  meaning: "ஒரு ஸ்வரத்துக்கும், அதே பெயருடைய அடுத்த ஸ்வரத்துக்கும் இடையே உள்ள இடைவெளி. மேலே உள்ள ஸ்வரம் இரண்டு மடங்கு வேகமாக அதிர்கிறது."
- id: omnivore
  word: "அனைத்துண்ணி"
  meaning: "தாவரங்களையும் இறைச்சியையும் உண்ணும் விலங்கு."
- id: orbit
  word: "சுற்றுப்பாதை"
  meaning: "பூமியைச் சந்திரன் சுற்றுவது போல, ஒன்று இன்னொன்றைச் சுற்றி வரும் வளைந்த பாதை."
- id: organ
  word: "உறுப்பு"
  meaning: "இதயம், நுரையீரல் போல, தனக்கென ஒரு சிறப்பு வேலை கொண்ட உடல் பாகம்."
- id: organism
  word: "உயிரி"
  meaning: "பாக்டீரியா முதல் நீலத் திமிங்கிலம் வரை, உயிருள்ள எதுவும்."
- id: orthodontist
  word: "பல் சீரமைப்பு நிபுணர்"
  meaning: "பற்களை வரிசையாக நேராக்கவும், தாடைகள் சரியாகச் சேரும்படி செய்யவும் கூடுதல் ஆண்டுகள் பயிற்சி பெற்ற பல் மருத்துவர்."
- id: osteoderm
  word: "தோல் எலும்புத் தகடு"
  meaning: "ஒரு விலங்கின் தோலுக்குள் வளரும் எலும்புத் தகடு அல்லது முடிச்சு. முதலையின் முதுகில் உள்ள புடைப்புகள் போல."
- id: oxidation
  word: "ஆக்சிஜனேற்றம்"
  meaning: "ஒரு பொருள் ஆக்சிஜனோடு சேரும் அல்லது எலக்ட்ரான்களை இழக்கும் வேதிமாற்றம். துருப்பிடிப்பதும் எரிவதும் இரண்டுமே ஆக்சிஜனேற்றம்தான்."
- id: oxygen
  word: "ஆக்சிஜன்"
  meaning: "மனிதர்களும் விலங்குகளும் சுவாசிக்கத் தேவையான, காற்றில் உள்ள வாயு."
- id: ozone
  word: "ஓசோன்"
  meaning: "இரண்டுக்குப் பதிலாக மூன்று ஆக்சிஜன் அணுக்கள் கொண்ட, ஆக்சிஜனின் ஒரு வடிவம். வானில் உயரே இருக்கும் இது, தீங்கான புற ஊதா ஒளியைத் தடுக்கிறது."
- id: paleontologist
  word: "தொல்லுயிரியலாளர்"
  meaning: "பழங்கால உயிர்களைப் பற்றி அறியப் புதைபடிவங்களை ஆராயும் அறிவியலாளர்."
- id: pandemic
  word: "பெருந்தொற்று"
  meaning: "பல நாடுகளுக்குப் பரவும் நோய்ப் பரவல்."
- id: parallel
  word: "இணைகோடு"
  meaning: "ரயில் தண்டவாளத்தின் இரண்டு இரும்புக் கம்பிகள் போல, அருகருகே எப்போதும் ஒரே இடைவெளியில் செல்வது."
- id: parasite
  word: "ஒட்டுண்ணி"
  meaning: "இன்னோர் உயிரினத்தின் மேலோ உள்ளேயோ வாழ்ந்து, அதிலிருந்து உணவை எடுத்துக்கொள்ளும் உயிரினம். பொதுவாக அது தான் வாழும் உயிரினத்துக்குத் தீங்கு செய்யும்."
- id: parliament
  word: "நாடாளுமன்றம்"
  meaning: "ஒரு நாட்டின் சட்டங்களை இயற்றும், தேர்ந்தெடுக்கப்பட்ட உறுப்பினர்களின் குழு."
- id: partition
  word: "பிரிவினை"
  meaning: "ஒரு நாடு இரண்டாகப் பிரிக்கப்பட்டது போல, ஒன்றைப் பகுதிகளாகப் பிரிப்பது."
- id: pasteurise
  word: "பாஸ்டர் முறையில் சூடாக்குதல்"
  meaning: "பால் போன்ற உணவைக் கொதிக்க வைக்காமல், தீங்கான கிருமிகள் சாகும் அளவுக்கு மட்டும் சூடாக்குவது."
- id: patina
  word: "களிம்பு"
  meaning: "காலப்போக்கில் உலோகம் அல்லது கல்லின் மேற்பரப்பில் படியும் மெல்லிய அடுக்கு. பழைய செம்புப் பாத்திரத்தின் மேல் படியும் பச்சைக் களிம்பு போல."
- id: patron
  word: "புரவலர்"
  meaning: "கலைஞர்களுக்குப் பணம் கொடுத்துப் படைப்புகளை உருவாக்கச் செய்யும் செல்வந்தர் அல்லது அதிகாரம் மிக்கவர்."
- id: patronymic
  word: "தந்தைவழிப் பெயர்"
  meaning: "உங்கள் அப்பாவின் முதல் பெயரிலிருந்து உருவாகும் பெயர். ஜோன்சன் என்றால் ஜோனின் மகன் என்று பொருள்."
- id: peloton
  word: "பெலட்டான்"
  meaning: "சைக்கிள் பந்தயத்தில் காற்றிலிருந்து தப்பிக்க, ஒருவருக்கொருவர் நெருக்கமாக ஓட்டிச் செல்லும் முக்கியக் குழு."
- id: pendulum
  word: "ஊசல்"
  meaning: "ஒரு நிலையான புள்ளியிலிருந்து முன்னும் பின்னும் ஆடும் எடை."
- id: peninsula
  word: "தீபகற்பம்"
  meaning: "மூன்று பக்கமும் நீர் சூழ்ந்த நிலம். இந்தியாவின் தென்பகுதி ஒரு தீபகற்பம்."
- id: percentage
  word: "சதவீதம்"
  meaning: "நூறில் ஒரு பங்கு. 50 சதவீதம் என்றால் பாதி."
- id: permafrost
  word: "நிரந்தர உறைபனி நிலம்"
  meaning: "ஆண்டு முழுவதும், குறைந்தது தொடர்ந்து இரண்டு ஆண்டுகள், உறைந்தே கிடக்கும் நிலம்."
- id: persecution
  word: "ஒடுக்குமுறை"
  meaning: "பெரும்பாலும் மதம், இனம் அல்லது நம்பிக்கைகளுக்காக மக்களைக் கொடூரமாக அல்லது அநியாயமாக நடத்துவது."
- id: pesticide
  word: "பூச்சிக்கொல்லி"
  meaning: "பயிர்களுக்குத் தீங்கு செய்யும் பூச்சிகளையும் பிற தொல்லை உயிர்களையும் கொல்லப் பயன்படும் வேதிப்பொருள்."
- id: pheromone
  word: "பெரோமோன்"
  meaning: "ஒரு விலங்கு வெளியிடும் வேதிப்பொருள். பொதுவாக மணத்தின் வழியே, தன் இனத்தைச் சேர்ந்த மற்றவற்றுக்கு இது செய்தி அனுப்புகிறது."
- id: philosophy
  word: "தத்துவம்"
  meaning: "எது சரி, எது உண்மை போன்ற பெரிய கேள்விகளைப் பற்றி ஆழ்ந்து யோசிப்பது."
- id: photosynthesis
  word: "ஒளிச்சேர்க்கை"
  meaning: "தாவரங்கள் சூரிய ஒளியைப் பயன்படுத்திக் காற்றையும் நீரையும் உணவாக மாற்றி, ஆக்சிஜனை வெளியிடும் முறை."
- id: photovoltaic
  word: "ஒளிமின்"
  meaning: "சோலார் பேனல் செய்வது போல, சூரிய ஒளியை நேரடியாக மின்சாரமாக மாற்றுவது."
- id: pigment
  word: "நிறமி"
  meaning: "வண்ணப்பூச்சு, மை அல்லது சாயத்துக்கு நிறம் தரும் வண்ணப் பொடி."
- id: pilgrimage
  word: "புனிதப் பயணம்"
  meaning: "ஒரு புனிதத் தலத்துக்கு மேற்கொள்ளும் பயணம்."
- id: piston
  word: "பிஸ்டன்"
  meaning: "வாயுவோ நீராவியோ தள்ளும்போது, ஒரு குழாய்க்குள் இறுக்கமாகப் பொருந்தி முன்னும் பின்னும் நகரும் அடைப்பான்."
- id: pitch
  word: "சுருதி"
  meaning: "ஒரு ஒலி எவ்வளவு உச்சமாக அல்லது தாழ்வாக இருக்கிறது என்பது."
- id: pixel
  word: "பிக்சல்"
  meaning: "திரையில் தெரியும் படத்தை உருவாக்கும் சின்னஞ்சிறு வண்ணப் புள்ளிகளில் ஒன்று."
- id: placenta
  word: "நஞ்சுக்கொடி"
  meaning: "கருவுற்றிருக்கும்போது கருப்பையில் வளரும் உறுப்பு. இது தாயின் ரத்தத்திலிருந்து ஆக்சிஜனையும் உணவையும் குழந்தைக்குக் கொண்டு சேர்க்கிறது."
- id: plankton
  word: "மிதவை உயிரிகள்"
  meaning: "நீரோட்டத்தில் அடித்துச் செல்லப்பட்டு, நீரில் மிதந்து திரியும் சின்னஞ்சிறு தாவரங்களும் விலங்குகளும்."
- id: plaque
  word: "பல் காரை"
  meaning: "பற்களின் மேல் படியும், பாக்டீரியா நிறைந்த பிசுபிசுப்பான படலம். பல் துலக்கி அகற்றாவிட்டால் பல் சொத்தை வரலாம்."
- id: plasma
  word: "பிளாஸ்மா"
  meaning: "அணுக்கள் உடைந்து மின்னூட்டம் கொண்ட துண்டுகளாகிவிட்ட, மிகச் சூடான, ஒளிரும் பொருள் நிலை. நட்சத்திரங்களும் மின்னலும் இதனால் ஆனவை."
- id: plate
  word: "புவித்தட்டு"
  meaning: "பூமியின் பாறையாலான வெளி ஓட்டை உருவாக்கும், மெதுவாக நகரும் மிகப் பெரிய துண்டுகளில் ஒன்று. இந்தியாவும் அப்படி ஒரு தட்டின் மேல்தான் இருக்கிறது."
- id: platelet
  word: "தட்டணு"
  meaning: "ரத்தத்தில் உள்ள சின்னஞ்சிறு செல் துண்டு. வெட்டுக்காயத்தில் ஒன்றாகத் திரண்டு, ரத்தம் வழிவதை நிறுத்த உதவுகிறது."
- id: pneumatophore
  word: "சுவாச வேர்"
  meaning: "சில சதுப்புநிலக் காட்டு மரங்களில், சேற்றிலிருந்து மேலே துருத்திக்கொண்டு நிற்கும், மூச்சுவிடும் வேர். பிச்சாவரம் சதுப்புக் காட்டில் இவற்றைப் பார்க்கலாம்."
- id: pollen
  word: "மகரந்தம்"
  meaning: "பூக்கள் உருவாக்கும் நுண்ணிய பொடி. இன்னொரு பூவுக்குக் கொண்டு செல்லப்பட்டால், அது விதைகள் உருவாக உதவுகிறது."
- id: pollination
  word: "மகரந்தச் சேர்க்கை"
  meaning: "விதைகள் உருவாகும்படி, ஒரு பூவிலிருந்து இன்னொரு பூவுக்கு மகரந்தத்தைக் கொண்டு செல்வது."
- id: pollution
  word: "மாசு"
  meaning: "காற்று, நீர், நிலம் இவற்றை அசுத்தமாக்கும் புகை, பிளாஸ்டிக், வேதிப்பொருட்கள் போன்ற தீங்கான பொருட்கள்."
- id: polyhedron
  word: "பன்முகத்திண்மம்"
  meaning: "கனசதுரம், பிரமிடு போல, தட்டையான முகங்களும் நேரான விளிம்புகளும் கொண்ட திட வடிவம்."
- id: polymer
  word: "பலபடி"
  meaning: "பல சின்ன அலகுகள் நீண்ட சங்கிலியாக இணைந்து உருவான மிகப் பெரிய மூலக்கூறு. பிளாஸ்டிக், பட்டு, ரப்பர், டிஎன்ஏ எல்லாமே பலபடிகள்தான்."
- id: polyp
  word: "பாலிப்"
  meaning: "வாயைச் சுற்றி உணர்கொம்புகள் கொண்ட, குழாய் வடிவிலான சின்னஞ்சிறு மென்மையான விலங்கு. பவளம் இதற்கு ஒரு எடுத்துக்காட்டு."
- id: potential-energy
  word: "நிலை ஆற்றல்"
  meaning: "ஒரு பொருளின் இருப்பிடம் அல்லது வடிவம் காரணமாக அதில் சேமிக்கப்பட்டிருக்கும் ஆற்றல்."
- id: precipitation
  word: "பொழிவு"
  meaning: "மழை, பனி, பனிமழை அல்லது ஆலங்கட்டியாக வானிலிருந்து விழும் நீர்."
- id: predator
  word: "வேட்டையாடி"
  meaning: "மற்ற விலங்குகளை வேட்டையாடி உண்ணும் விலங்கு."
- id: prehistoric
  word: "வரலாற்றுக்கு முந்தைய"
  meaning: "மனிதர்கள் எதையும் எழுதி வைக்கத் தொடங்குவதற்கு முந்தைய காலத்தைச் சேர்ந்த."
- id: pressure
  word: "அழுத்தம்"
  meaning: "ஒரு பரப்பின் மீது ஒன்று எவ்வளவு வலுவாக அழுத்துகிறது என்பது. ஆழ்கடலில், மேலே உள்ள மொத்தத் தண்ணீரின் எடையும் மிக வலுவாக அழுத்தும்."
- id: prism
  word: "முப்பட்டகம்"
  meaning: "வெள்ளை ஒளியை வானவில் வண்ணங்களாகப் பிரிக்கும், கோணங்கள் கொண்ட தெளிவான கட்டி."
- id: probability
  word: "நிகழ்தகவு"
  meaning: "ஒன்று நடப்பதற்கு எவ்வளவு வாய்ப்பு இருக்கிறது என்பது."
- id: projection
  word: "வரைபட வீழ்ப்பு"
  meaning: "உருண்டையான பூமியைத் தட்டையான வரைபடத்தில் வரையும் ஒரு முறை. ஒவ்வொரு முறையிலும் ஏதாவது ஒன்று இழுபட்டுத் திரிந்துவிடும்."
- id: propeller
  word: "சுழலி"
  meaning: "படகையோ விமானத்தையோ முன்னோக்கித் தள்ளும் சுழலும் இறக்கைகள்."
- id: protein
  word: "புரதம்"
  meaning: "உயிரினங்களின் முக்கியக் கட்டுமானப் பொருட்களில் ஒன்று. தசை, தோல், முடி, சிலந்தி வலை நூல் எல்லாமே பெரும்பாலும் புரதங்களால் ஆனவை."
- id: proton
  word: "புரோட்டான்"
  meaning: "அணுவின் மையத்தில் இருக்கும், நேர் மின்னூட்டம் கொண்ட சின்னஞ்சிறு துகள்."
- id: provenance
  word: "உடைமை வரலாறு"
  meaning: "ஒரு பொருள் செய்யப்பட்டதிலிருந்து இன்றுவரை அது யார் யாரிடம் இருந்தது என்பதன் பதிவுசெய்யப்பட்ட வரலாறு."
- id: proverb
  word: "பழமொழி"
  meaning: "அறிவுரை சொல்லும், எல்லாருக்கும் தெரிந்த சின்ன வாசகம்."
- id: pulley
  word: "கப்பி"
  meaning: "கனமான பொருட்களை எளிதாகத் தூக்கப் பயன்படும், கயிறு சுற்றிய சக்கரம். கிணற்றில் தண்ணீர் இறைக்கும் ராட்டினம் போல."
- id: pupa
  word: "கூட்டுப்புழு"
  meaning: "இளம்புழுவுக்கும் முழு வளர்ச்சிக்கும் இடைப்பட்ட நிலை. இந்த நிலையில் பூச்சி ஒரு கூட்டுக்குள் இருந்தபடி உருமாறுகிறது."
- id: pupil
  word: "கண்மணி"
  meaning: "ஒளியை உள்ளே விடும், உங்கள் கண்ணின் நடுவே உள்ள கருப்புத் துளை."
- id: pyramid
  word: "பிரமிடு"
  meaning: "சதுர அடிப்பகுதியும், ஒரு புள்ளியில் வந்து சேரும் முக்கோணப் பக்கங்களும் கொண்ட வடிவம் அல்லது கட்டடம்."
- id: quarantine
  word: "தனிமைப்படுத்தல்"
  meaning: "ஒரு நோய் பரவாமல் இருக்க, மனிதர்களையோ விலங்குகளையோ சிறிது காலம் தனியாகப் பிரித்து வைப்பது."
- id: radiation
  word: "கதிர்வீச்சு"
  meaning: "கதிர்களாகவோ வேகமான சின்னஞ்சிறு துகள்களாகவோ பயணிக்கும் ஆற்றல். கடுமையான புற ஊதா ஒளி, சூரியனிலிருந்து வரும் துகள்கள் போன்ற சில வகைகள் உயிரினங்களுக்குத் தீங்கு செய்யக்கூடும்."
- id: radioactive
  word: "கதிரியக்கம் கொண்ட"
  meaning: "சில அணுக்களின் மையப்பகுதி நிலையற்றதாக இருந்து மெல்ல உடைவதால், தானாகவே ஆற்றலையும் சின்னஞ்சிறு துகள்களையும் வெளிவிடும்."
- id: radius
  word: "ஆரம்"
  meaning: "ஒரு வட்டத்தின் மையத்திலிருந்து அதன் விளிம்பு வரை உள்ள தூரம். இது வட்டத்தின் அகலத்தில் பாதி."
- id: raga
  word: "ராகம்"
  meaning: "இந்தியப் பாரம்பரிய இசைக்கு அடிப்படையாக இருக்கும் ஸ்வரங்களின் தொகுப்பும் அவற்றுக்கான விதிகளும்."
- id: rainforest
  word: "மழைக்காடு"
  meaning: "ஏறக்குறைய தினமும் மழை பெய்யும், சூடான, ஈரமான இடத்தில் உள்ள அடர்ந்த காடு."
- id: receptor
  word: "ஏற்பி"
  meaning: "ஒரு குறிப்பிட்ட வேதிப்பொருளையோ சமிக்ஞையையோ பிடித்துக்கொள்ளும் செல்லின் ஒரு பகுதி. சில சாவிகளுக்கு மட்டுமே பொருந்தும் பூட்டு போல."
- id: recycle
  word: "மறுசுழற்சி"
  meaning: "பயன்படுத்திய பொருட்களைத் தூக்கி எறியாமல், அவற்றைப் புதிய பொருட்களாக மாற்றுவது."
- id: referendum
  word: "பொது வாக்கெடுப்பு"
  meaning: "ஒரு இடத்தின் எல்லா வாக்காளர்களும் ஒரே ஒரு கேள்விக்கு, பெரும்பாலும் ஆம் அல்லது இல்லை என்று, நேரடியாக முடிவு செய்யும் வாக்கெடுப்பு."
- id: refraction
  word: "ஒளிவிலகல்"
  meaning: "காற்றிலிருந்து நீருக்கோ கண்ணாடிக்கோ என, ஒரு பொருளிலிருந்து இன்னொரு பொருளுக்குள் செல்லும்போது ஒளி வளைவது."
- id: refrigerant
  word: "குளிர்விப்பான்"
  meaning: "ஃப்ரிட்ஜ் அல்லது ஏசிக்குள் இருக்கும் சிறப்புத் திரவம். குறைந்த வெப்பநிலையிலேயே கொதித்து, வெப்பத்தை வெளியே கடத்திச் செல்கிறது."
- id: refugee
  word: "அகதி"
  meaning: "போர், வன்முறை அல்லது ஆபத்திலிருந்து தப்பிக்க, தன் வீட்டையோ நாட்டையோ விட்டு வெளியேற வேண்டிய கட்டாயத்துக்கு ஆளானவர்."
- id: renewable
  word: "புதுப்பிக்கத்தக்க ஆற்றல்"
  meaning: "சூரிய ஒளி, காற்று போல, தீர்ந்துபோகாத ஆற்றல்."
- id: reptile
  word: "ஊர்வன"
  meaning: "செதில்கள் கொண்டு, பெரும்பாலும் முட்டையிடும் விலங்குகள். பல்லி, பாம்பு, ஆமை, முதலை போன்றவை."
- id: republic
  word: "குடியரசு"
  meaning: "அரசர் அல்லது அரசிக்குப் பதிலாக, தேர்ந்தெடுக்கப்பட்ட தலைவர் கொண்ட நாடு."
- id: reservoir
  word: "நீர்த்தேக்கம்"
  meaning: "தண்ணீரைச் சேமித்து வைக்கப் பயன்படும், பெரும்பாலும் அணை கட்டி உருவாக்கப்படும் பெரிய ஏரி. மேட்டூர் அணை போல."
- id: retina
  word: "விழித்திரை"
  meaning: "ஒளியை உணரும் செல்கள் கொண்ட, கண்ணின் பின்பக்கம் உள்ள மெல்லிய அடுக்கு."
- id: revolution
  word: "புரட்சி"
  meaning: "பெரும்பாலும் மக்கள் ஒரு அரசைத் தூக்கி எறியும்போது நடக்கும், பெரிய, திடீர் மாற்றம்."
- id: rhizome
  word: "வேர்த்தண்டு"
  meaning: "பக்கவாட்டில் வளர்ந்து புதிய தளிர்களை மேலே அனுப்பும், மண்ணுக்கடியில் உள்ள தண்டு. மூங்கில், இஞ்சி, மஞ்சள் போன்றவற்றில் இருப்பது போல."
- id: rhythm
  word: "தாளம்"
  meaning: "இசை, கவிதை அல்லது அசைவில் ஒழுங்காகத் திரும்பத் திரும்ப வரும் அடிகளின் வடிவம்."
- id: ritual
  word: "சடங்கு"
  meaning: "பெரும்பாலும் மதம் அல்லது விழாவின் ஒரு பகுதியாக, ஒவ்வொரு முறையும் ஒரே மாதிரி செய்யப்படும் செயல்கள்."
- id: rotor
  word: "சுழலி"
  meaning: "ஒரு இயந்திரத்தில் சுழலும் பகுதி. ஹெலிகாப்டரில், அதை மேலே தூக்குவதற்காகச் சுழன்றடிக்கும் நீண்ட இறக்கைகளின் தொகுப்புதான் சுழலி."
- id: rover
  word: "ரோவர்"
  meaning: "வேறொரு கோளிலோ நிலவிலோ சுற்றி வரும் ரோபோ வாகனம்."
- id: saliva
  word: "உமிழ்நீர்"
  meaning: "உணவை விழுங்கவும் செரிக்கவும் உதவும், உங்கள் வாயில் உள்ள நீர் போன்ற திரவம்."
- id: sample
  word: "மாதிரி"
  meaning: "ஒரு பெரிய குழுவின் ஒவ்வொரு உறுப்பினரையும் சோதிக்காமலே அதைப் பற்றி அறிய, அதிலிருந்து தேர்ந்தெடுக்கப்படும் சிறிய குழு."
- id: sanctuary
  word: "சரணாலயம்"
  meaning: "பாதுகாப்பான இடம், குறிப்பாகக் காட்டு விலங்குகள் பாதுகாக்கப்படும் இடம். வேடந்தாங்கல் பறவைகள் சரணாலயம் போல."
- id: satyagraha
  word: "சத்தியாகிரகம்"
  meaning: "அநீதியை வன்முறை இல்லாமல் எதிர்ப்பதற்குக் காந்தி வைத்த பெயர். உண்மையை உறுதியாகப் பற்றிக்கொள்வது என்று பொருள்."
- id: sauropod
  word: "சாரோபாட்"
  meaning: "நீண்ட கழுத்தும் நீண்ட வாலும் கொண்டு, நான்கு கால்களில் நடந்த மிகப் பெரிய தாவர உண்ணி டைனோசர்கள்."
- id: savanna
  word: "சவானா"
  meaning: "அங்கும் இங்கும் மரங்கள் கொண்ட, அகலமான, வெப்பமான புல்வெளி. ஆண்டின் ஒரு பகுதி மழையும் மீதி காலம் வறட்சியும் இருக்கும்."
- id: script
  word: "எழுத்துமுறை"
  meaning: "ஒரு மொழியை எழுதப் பயன்படும் எழுத்துகள் அல்லது குறியீடுகளின் தொகுப்பு."
- id: scripture
  word: "புனித நூல்"
  meaning: "ஒரு மதத்தின் புனித எழுத்துகள்."
- id: sculpture
  word: "சிற்பம்"
  meaning: "சிலை போல, செதுக்கியோ வடித்தோ கட்டியோ உருவாக்கும் கலைப்படைப்பு."
- id: sediment
  word: "வண்டல்"
  meaning: "பெரும்பாலும் ஆறு, ஏரி, கடலின் அடியில் அடுக்கடுக்காகப் படியும் மணல், சேறு, பாறைத் துகள்கள்."
- id: sensor
  word: "சென்சார்"
  meaning: "ஒளி, வெப்பம், அசைவு போன்ற ஒன்றைக் கவனித்து, அதை ஒரு இயந்திரம் பயன்படுத்தக்கூடிய சமிக்ஞையாக மாற்றும் கருவி."
- id: sepoy
  word: "சிப்பாய்"
  meaning: "ஐரோப்பியர்கள் நடத்திய படையில், குறிப்பாகக் கிழக்கிந்திய கம்பெனியின் படையில், பணியாற்றிய இந்தியப் போர்வீரர். படைவீரர் என்று பொருள்படும் ‘சிபாஹி’ என்ற பாரசீகச் சொல்லிலிருந்து வந்தது."
- id: series
  word: "தொடர்"
  meaning: "கணிதத்தில், 1 + 1/2 + 1/4 + 1/8 போல, ஒரு வடிவத்தைப் பின்பற்றும் எண்களின் கூட்டல். சில தொடர்கள் முடிவில்லாமல் போய்க்கொண்டே இருக்கும்."
- id: server
  word: "சர்வர்"
  meaning: "எப்போதும் இயங்கிக்கொண்டே இருந்து, தகவல்களைச் சேமித்து வைத்து, மற்ற கம்ப்யூட்டர்கள் கேட்கும்போது அவற்றுக்கு அனுப்பும் கம்ப்யூட்டர்."
- id: simile
  word: "உவமை"
  meaning: "\"சிங்கம் போல வீரம்\" என்பது போல, \"போல\", \"மாதிரி\" போன்ற சொற்களால் இரண்டு பொருட்களை ஒப்பிடுவது."
- id: skeleton
  word: "எலும்புக்கூடு"
  meaning: "உடலைத் தாங்கி நிற்கும் எலும்புகளின் சட்டகம்."
- id: solar-system
  word: "சூரியக் குடும்பம்"
  meaning: "சூரியனும் அதைச் சுற்றி வரும் எல்லாமும்: கோள்கள், நிலவுகள், சிறுகோள்கள், வால் நட்சத்திரங்கள்."
- id: solstice
  word: "கதிர்த்திருப்பம்"
  meaning: "ஆண்டில் இரண்டு நாட்கள், நண்பகலில் சூரியன் தன் மிக உயர்ந்த அல்லது மிகத் தாழ்ந்த நிலையை அடையும் நாள். அன்று பகல் மிக நீளமாகவோ மிகக் குறுகியதாகவோ இருக்கும்."
- id: solution
  word: "கரைசல்"
  meaning: "உப்புத் தண்ணீர் போல, ஏதோ ஒன்று கரைந்திருக்கும் திரவம்."
- id: sonnet
  word: "சானெட்"
  meaning: "ஒரு குறிப்பிட்ட எதுகை, தாள அமைப்பைப் பின்பற்றும் 14 வரிக் கவிதை."
- id: sound
  word: "ஒலி"
  meaning: "காற்று, நீர் அல்லது திடப்பொருள் வழியே பயணிக்கும் ஒரு அதிர்வு. உங்கள் காதுகள் அந்த அதிர்வை நீங்கள் கேட்கும் சத்தமாக மாற்றுகின்றன."
- id: species
  word: "இனம்"
  meaning: "ஒரு குறிப்பிட்ட வகை உயிரினம். புலி ஒரு இனம்; சிங்கம் இன்னோர் இனம்."
- id: spectrum
  word: "நிறமாலை"
  meaning: "சிவப்பு முதல் ஊதா வரை, வரிசையாக அமைந்த ஒளியின் எல்லா வண்ணங்களும்."
- id: stamina
  word: "உடல் வலிமை"
  meaning: "கடினமான ஒன்றை நீண்ட நேரம் தொடர்ந்து செய்வதற்கான வலு."
- id: star
  word: "நட்சத்திரம்"
  meaning: "தானே ஒளியை உண்டாக்கும், சூடான ஒளிரும் வாயுவாலான மிகப் பெரிய பந்து. சூரியனும் ஒரு நட்சத்திரம்தான்."
- id: starch
  word: "மாவுச்சத்து"
  meaning: "சர்க்கரையின் நீண்ட சங்கிலிகளால் தாவரங்கள் உருவாக்கும் ஆற்றல் சேமிப்பு. அரிசி, கோதுமை, உருளைக்கிழங்கு எல்லாவற்றிலும் இது நிறைய உண்டு."
- id: statistics
  word: "புள்ளியியல்"
  meaning: "எண்களைச் சேகரித்து, அவை என்ன காட்டுகின்றன என்று கண்டுபிடிக்க அவற்றை ஆராய்வது."
- id: stele
  word: "நினைவுக் கற்பலகை"
  meaning: "எழுத்துகளோ படங்களோ செதுக்கப்பட்டு, நினைவுச்சின்னமாக நிறுத்தப்பட்ட உயரமான கற்பலகை."
- id: stigma
  word: "சூலகமுடி"
  meaning: "மகரந்தத்தைப் பிடித்துக்கொள்ளும், பூவின் நடுவே உள்ள பிசுபிசுப்பான நுனி."
- id: stupa
  word: "ஸ்தூபி"
  meaning: "புத்தரின் சாம்பல், உடைமைகள் போன்ற புனிதச் சின்னங்களின் மேல் பெரும்பாலும் கட்டப்படும், குவிமாட வடிவ பௌத்த நினைவுச்சின்னம்."
- id: subcontinent
  word: "துணைக்கண்டம்"
  meaning: "இந்தியாவும் அதன் அண்டை நாடுகளும் போல, ஒரு கண்டத்தின் பெரிய பகுதி."
- id: superhydrophobic
  word: "மீநீர்விலக்கி"
  meaning: "தண்ணீரை அவ்வளவு நன்றாக விலக்குவதால், நீர்த்துளிகள் உருண்டை முத்துக்களாக நின்று உடனே உருண்டு ஓடிவிடும் தன்மை. தாமரை இலையில் தண்ணீர் ஒட்டாதது போல."
- id: supernova
  word: "சூப்பர்நோவா"
  meaning: "ஒரு நட்சத்திரம் தன் வாழ்நாளின் முடிவில் வெடித்துச் சிதறும் மிகப் பெரிய வெடிப்பு."
- id: surface-tension
  word: "பரப்பு இழுவிசை"
  meaning: "ஒரு திரவத்தின் மேற்பரப்பை மெல்லிய, இழுபடும் தோல் போலச் செயல்பட வைக்கும் இழுப்பு. இதனால்தான் சில பூச்சிகள் தண்ணீர் மேல் நடக்க முடிகிறது."
- id: surgeon
  word: "அறுவை சிகிச்சை நிபுணர்"
  meaning: "அறுவை சிகிச்சைகள் செய்யும் மருத்துவர்."
- id: sustainable
  word: "நிலைத்தன்மை கொண்ட"
  meaning: "பூமிக்குத் தீங்கு செய்யாமலும் வளங்களைத் தீர்க்காமலும் தொடர்ந்து நீடிக்கக்கூடிய."
- id: syllable
  word: "ஒலியசை"
  meaning: "ஒரு சொல்லில் உள்ள ஒலியின் ஒரு துடிப்பு. ‘தக்காளி’ என்ற சொல்லில் தக், கா, ளி என மூன்று ஒலியசைகள் உண்டு."
- id: symmetry
  word: "சமச்சீர்"
  meaning: "ஒன்றின் ஒரு பாதி, மறு பாதியின் கண்ணாடி பிம்பமாக இருப்பது."
- id: symptom
  word: "அறிகுறி"
  meaning: "இருமல், காய்ச்சல் போல, நோய் இருப்பதைக் காட்டும் அடையாளம்."
- id: syrinx
  word: "சிரின்க்ஸ்"
  meaning: "பறவையின் குரல் பெட்டி. மார்பின் ஆழத்தில், மூச்சுக்குழாய் இரண்டாகப் பிரிந்து இரண்டு நுரையீரல்களுக்குச் செல்லும் இடத்தில் இது இருக்கிறது."
- id: tariff
  word: "இறக்குமதி வரி"
  meaning: "மற்ற நாடுகளிலிருந்து கொண்டுவரப்படும் பொருட்களுக்கு ஒரு நாடு விதிக்கும் வரி."
- id: technology
  word: "தொழில்நுட்பம்"
  meaning: "சிக்கல்களைத் தீர்க்க மனிதர்கள் கண்டுபிடிக்கும் கருவிகளும் இயந்திரங்களும்."
- id: tectonic-plates
  word: "புவித்தட்டுகள்"
  meaning: "பூமியின் மேற்பரப்பை உருவாக்கி, மெதுவாக நகர்ந்துகொண்டிருக்கும் மிகப் பெரிய பாறைப் பலகைகள்."
- id: telegraph
  word: "தந்தி"
  meaning: "குறியீடாக்கப்பட்ட மின் துடிப்புகளைக் கம்பிகள் வழியே அனுப்பிச் செய்தி அனுப்பும் பழைய முறை."
- id: telescope
  word: "தொலைநோக்கி"
  meaning: "தொலைவில் உள்ளவற்றை அருகில் இருப்பது போலக் காட்டும் கருவி."
- id: temperature
  word: "வெப்பநிலை"
  meaning: "ஒன்று எவ்வளவு சூடாக அல்லது குளிர்ச்சியாக இருக்கிறது என்பது."
- id: tendon
  word: "தசைநாண்"
  meaning: "தசையை எலும்போடு இணைக்கும் உறுதியான நாண்."
- id: tentacle
  word: "உணர்கொம்பு"
  meaning: "ஆக்டோபஸ், ஜெல்லிமீன் போன்ற விலங்குகளுக்கு இருக்கும் நீண்ட, வளையக்கூடிய கை."
- id: territory
  word: "எல்லைப் பகுதி"
  meaning: "ஒரு விலங்கோ நாடோ தனக்கே சொந்தம் என்று உரிமை கொண்டாடும் பகுதி."
- id: textile
  word: "துணி"
  meaning: "நூல்களை நெய்தோ பின்னியோ முடிச்சிட்டோ உருவாக்கும் ஆடைப் பொருள்."
- id: theropod
  word: "தெரோபாட்"
  meaning: "பெரும்பாலும் இரண்டு கால்களில் நடந்து, பெரும்பாலும் இறைச்சி உண்ட டைனோசர்களின் குழு. டி. ரெக்ஸ், ராஜாசாரஸ், வெலாசிராப்டர், ஏன், ஒவ்வொரு பறவையும்கூட."
- id: thrust
  word: "உந்துவிசை"
  meaning: "வாயுவை மிக வேகமாகப் பின்பக்கம் வெளியே தள்ளுவதால் உண்டாகி, ராக்கெட்டையோ ஜெட்டையோ முன்னோக்கி நகர்த்தும் விசை."
- id: tissue
  word: "திசு"
  meaning: "தசை போல, ஒன்றாகச் சேர்ந்து வேலை செய்யும் ஒரே மாதிரியான செல்களின் குழு."
- id: torpor
  word: "தற்காலிக உறக்கநிலை"
  meaning: "ஆற்றலைச் சேமிக்க ஒரு விலங்கின் உடல் வெப்பநிலையும் இதயத் துடிப்பும் குறைந்துவிடும் ஆழ்ந்த, குளிர்ந்த தூக்கம். பொதுவாக ஒரு இரவு அல்லது சில நாட்கள் நீடிக்கும்."
- id: tournament
  word: "போட்டித் தொடர்"
  meaning: "ஒரு வெற்றியாளரைக் கண்டுபிடிக்கப் பல ஆட்டங்கள் நடக்கும் போட்டி."
- id: transistor
  word: "டிரான்சிஸ்டர்"
  meaning: "நகரும் பாகங்கள் இல்லாத சின்னஞ்சிறு மின்னணு ஸ்விட்ச். கம்ப்யூட்டர் சிப்புகளில் இவை நூற்றுக்கணக்கான கோடிகள் இருக்கின்றன."
- id: treaty
  word: "ஒப்பந்தம்"
  meaning: "நாடுகள் பின்பற்றுவதாக உறுதி அளிக்கும், அவற்றுக்கு இடையே எழுதப்பட்ட உடன்படிக்கை."
- id: tributary
  word: "துணையாறு"
  meaning: "பெரிய ஆற்றில் வந்து கலக்கும் சிறிய ஆறு. காவிரியில் கலக்கும் பவானி போல."
- id: trickster
  word: "தந்திரக் கதாபாத்திரம்"
  meaning: "தன்னைவிட வலிமையான எதிரிகளைத் தந்திரத்தால் வெல்லும், கதைகளில் வரும் புத்திசாலிக் கதாபாத்திரம். தெனாலிராமன் போல."
- id: tropical
  word: "வெப்பமண்டல"
  meaning: "நிலநடுக்கோட்டுக்கு அருகே உள்ள வெப்பமான பகுதிகளைச் சேர்ந்த."
- id: tsunami
  word: "சுனாமி"
  meaning: "பெரும்பாலும் கடலுக்கடியில் நிகழும் நிலநடுக்கத்தால் உண்டாகும், அடுத்தடுத்து வரும் மிகப் பெரிய கடல் அலைகள்."
- id: tuber
  word: "கிழங்கு"
  meaning: "உருளைக்கிழங்கு போல, உணவைச் சேமித்து வைக்கும், தாவரத்தின் மண்ணுக்கடியில் உள்ள பருத்த பகுதி."
- id: tundra
  word: "தூந்திரப் பகுதி"
  meaning: "அடியில் உள்ள நிலம் எப்போதும் உறைந்தே இருக்கும், மரங்கள் இல்லாத குளிர் நிலப்பகுதி."
- id: turbine
  word: "டர்பைன்"
  meaning: "நகரும் காற்று, நீர் அல்லது நீராவியால் சுழற்றப்படும், இறக்கைகள் கொண்ட சக்கரம்."
- id: ultrasound
  word: "மீயொலி"
  meaning: "மனிதர்களுக்குக் கேட்க முடியாத அளவுக்கு உச்சமான ஒலி. உடலுக்குள் பார்க்கவும் இது பயன்படுகிறது."
- id: ultraviolet
  word: "புற ஊதாக் கதிர்"
  meaning: "நம் கண்களுக்குத் தெரியாத, சூரியனிடமிருந்து வரும் ஒருவகை ஒளி. இது அளவுக்கு மீறினால் வெயிலில் தோல் கருகிப் புண்ணாகும்."
- id: vaccine
  word: "தடுப்பூசி"
  meaning: "ஒரு கிருமியை அடையாளம் கண்டுகொள்ள உங்கள் உடலுக்குக் கற்றுக்கொடுக்கும் மருந்து. அதனால், உண்மையான கிருமியைச் சந்தித்தால் உடல் அதை வேகமாக முறியடிக்கும்."
- id: vacuum
  word: "வெற்றிடம்"
  meaning: "காற்றோ வேறு பொருளோ ஏறக்குறைய எதுவுமே இல்லாத இடம்."
- id: vein
  word: "சிரை"
  meaning: "ரத்தத்தை மீண்டும் இதயத்துக்குக் கொண்டு செல்லும் குழாய்."
- id: velocity
  word: "திசைவேகம்"
  meaning: "ஒரு குறிப்பிட்ட திசையில் உள்ள வேகம்."
- id: venom
  word: "நஞ்சு"
  meaning: "ஒரு விலங்கு தன் கோரைப்பற்கள், கொடுக்குகள் அல்லது முட்கள் வழியே இன்னொரு விலங்கின் உடலுக்குள் செலுத்தும் தீங்கான திரவம்."
- id: verdict
  word: "தீர்ப்பு"
  meaning: "ஒருவர் குற்றவாளியா இல்லையா என்பது போல, வழக்கு விசாரணையின் முடிவில் அறிவிக்கப்படும் முடிவு."
- id: vertebrate
  word: "முதுகெலும்பி"
  meaning: "மீன், பறவை, மனிதர் போல, முதுகெலும்பு கொண்ட விலங்கு."
- id: veto
  word: "ரத்து அதிகாரம்"
  meaning: "ஒரு முடிவையோ முன்மொழியப்பட்ட சட்டத்தையோ நிராகரிக்கும் அதிகாரம். ‘நான் தடுக்கிறேன்’ என்று பொருள்படும் லத்தீன் சொல்லிலிருந்து இது வந்தது."
- id: vibration
  word: "அதிர்வு"
  meaning: "வேகமாக முன்னும் பின்னும் நடுங்கும் அசைவு."
- id: virus
  word: "வைரஸ்"
  meaning: "பாக்டீரியாவைவிட மிக மிகச் சிறிய கிருமி. ஒரு உயிரினத்தின் செல்களுக்குள் மட்டுமே இது தன்னைப் போலப் பிரதிகளை உருவாக்க முடியும்."
- id: vitamin
  word: "வைட்டமின்"
  meaning: "ஆரோக்கியமாக இருக்க உங்கள் உடலுக்குக் கொஞ்சமாகத் தேவைப்படும், உணவில் உள்ள பொருள்."
- id: volume
  word: "கனஅளவு"
  meaning: "ஒன்று எவ்வளவு இடத்தை அடைத்துக்கொள்கிறது என்பது. ஒலி எவ்வளவு சத்தமாக இருக்கிறது என்பதையும் இது குறிக்கும் (வால்யூம்)."
- id: vortex
  word: "சுழல்"
  meaning: "நீர்ச்சுழல் போல, அல்லது தொட்டியின் துளை வழியே தண்ணீர் சுழன்று இறங்குவது போல, சுழன்றடிக்கும் காற்று அல்லது நீர்."
- id: wavelength
  word: "அலைநீளம்"
  meaning: "ஒரு அலையின் உச்சியிலிருந்து அடுத்த அலையின் உச்சி வரை உள்ள தூரம். ஒளியில், அலைநீளம் மாறினால் நிறமும் மாறும்."
- id: weathering
  word: "வானிலைச் சிதைவு"
  meaning: "மழை, வெப்பம், குளிர், பனிக்கட்டி, தாவரங்கள், பிற உயிரினங்களால் பாறை மெல்ல மெல்ல உடைந்து சிதைவது."
- id: weaving
  word: "நெசவு"
  meaning: "நூல்களை ஒன்றின் மேலும் கீழுமாகக் குறுக்கே பின்னித் துணி உருவாக்குவது."
- id: wetland
  word: "ஈரநிலம்"
  meaning: "சதுப்பு நிலம், சேற்று நிலம், அலையாத்திக் காடு போல, ஆண்டின் ஒரு பகுதியாவது தண்ணீரில் ஊறிக் கிடக்கும் நிலம்."
- id: yeast
  word: "ஈஸ்ட்"
  meaning: "சர்க்கரையை உண்டு கார்பன் டை ஆக்சைடு வாயுவை வெளிவிடும், ஒற்றை செல்லாலான சின்னஞ்சிறு பூஞ்சை. ரொட்டி உப்பி வர பேக்கரிகளில் இதைப் பயன்படுத்துகிறார்கள்."
- id: zodiac
  word: "ராசி மண்டலம்"
  meaning: "ஆண்டு முழுவதும் சூரியனும் சந்திரனும் கோள்களும் கடந்து செல்வது போலத் தெரியும், பன்னிரண்டு நட்சத்திரக் கூட்டங்களின் பட்டை."
