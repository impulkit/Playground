# Tamil dictionary: same ids as content/dictionary.yml.
- id: abstract
  word: "அரூப ஓவியம்"
  meaning: "பொருட்களை அவை தோன்றும்படியே வரையாமல், வடிவங்கள், வண்ணங்கள், கோடுகளை மட்டும் வைத்து உருவாக்கும் ஓவியக் கலை."
- id: abugida
  word: "அபுகிடா"
  meaning: "ஒவ்வொரு மெய்யெழுத்திலும் ஒரு உயிரொலி சேர்ந்தே இருக்கும் எழுத்துமுறை. க, கா, கி என்பது போலச் சின்னக் குறிகளைச் சேர்த்து அந்த உயிரொலியை மாற்றலாம்."
- id: acceleration
  word: "முடுக்கம்"
  meaning: "ஒரு பொருள் எவ்வளவு சீக்கிரமாகத் தன் வேகத்தைக் கூட்டுகிறது அல்லது மாற்றுகிறது என்பது."
- id: acid
  word: "அமிலம்"
  meaning: "எலுமிச்சைச் சாறு, வினிகர் போலப் புளிப்புச் சுவை கொண்ட பொருள். வீரியமான அமிலங்கள் சுட்டுப் புண்ணாக்கக்கூடும்."
- id: adaptation
  word: "தகவமைப்பு"
  meaning: "ஒரு உயிரினம் தான் வாழும் இடத்தில் பிழைத்திருக்க உதவும் உடல் உறுப்பு அல்லது பழக்கம்."
- id: adrenaline
  word: "அட்ரினலின்"
  meaning: "உடலைச் செயலுக்குத் தயார்ப்படுத்தும் ஒரு ஹார்மோன். பயப்படும்போதோ பரபரப்பாக இருக்கும்போதோ இது இதயத்தை வேகமாகத் துடிக்க வைக்கிறது, மூச்சையும் வேகமாக்குகிறது."
- id: aerial-root
  word: "காற்று வேர்"
  meaning: "மண்ணுக்கு அடியில் இல்லாமல், செடியின் தண்டிலிருந்தோ கிளைகளிலிருந்தோ திறந்த காற்றில் வளரும் வேர். ஆலமர விழுது இதற்கு நல்ல எடுத்துக்காட்டு."
- id: aerodynamics
  word: "காற்றியக்கவியல்"
  meaning: "விமானம், கார், பந்து போன்றவற்றைச் சுற்றிக் காற்று எப்படி நகர்கிறது என்று ஆராயும் அறிவியல்."
- id: ahimsa
  word: "அகிம்சை"
  meaning: "எந்த உயிருக்கும் தீங்கு செய்யாமல் இருப்பதைக் குறிக்கும் சமஸ்கிருதச் சொல். சமணம், பௌத்தம், இந்து மதம் மூன்றிலும் இது மையமான கருத்து; காந்தியின் போராட்ட வழிகளுக்கும் இதுவே அடிப்படை."
- id: algae
  word: "பாசி"
  meaning: "சூரிய ஒளியிலிருந்து உணவு தயாரிக்கும் எளிய உயிரினங்கள். ஒற்றை செல் முதல் மிகப் பெரிய கடற்பாசிகள் வரை பல வகை உண்டு."
- id: algorithm
  word: "அல்காரிதம்"
  meaning: "ஒரு சிக்கலைத் தீர்க்கப் பின்பற்ற வேண்டிய துல்லியமான படிகளின் வரிசை. கம்ப்யூட்டர்கள் அல்காரிதங்களைப் பின்பற்றித்தான் வேலை செய்கின்றன."
- id: alkali
  word: "காரம்"
  meaning: "அமிலத்துக்கு நேர் எதிரான வேதிப்பொருள். சோப்பு, சமையல் சோடா போன்றவை எடுத்துக்காட்டுகள்."
- id: allergen
  word: "ஒவ்வாமைப் பொருள்"
  meaning: "சிலருக்கு ஒவ்வாமையை (அலர்ஜி) தூண்டிவிடும் பொருள். பெரும்பாலும் இது உணவிலோ மகரந்தத்திலோ உள்ள ஒரு புரதம்."
- id: alloy
  word: "உலோகக் கலவை"
  meaning: "இரண்டு அல்லது அதற்கு மேற்பட்ட உலோகங்களை உருக்கிச் சேர்த்து உருவாக்கும் உலோகம். செம்பும் வெள்ளீயமும் சேர்ந்தால் வெண்கலம் கிடைக்கும்."
- id: alluvium
  word: "வண்டல் மண்"
  meaning: "வெள்ளம் வடிந்த பிறகு ஆறுகள் விட்டுச் செல்லும், நுண்ணிய சேறும் மணலும் கலந்த மென்மையான, வளமான மண்."
- id: alveoli
  word: "காற்று நுண்ணறைகள்"
  meaning: "நுரையீரல் குழாய்களின் முனைகளில் உள்ள பல கோடி சின்னஞ்சிறு காற்றுப் பைகள். இங்குதான் ஆக்சிஜன் ரத்தத்துக்குள் செல்கிறது."
- id: amber
  word: "அம்பர்"
  meaning: "சில மரங்களிலிருந்து கசியும் பிசுபிசுப்பான பிசின், மில்லியன் கணக்கான ஆண்டுகளில் கெட்டியாகித் தங்க நிறக் கல்லாக மாறியது."
- id: amendment
  word: "சட்டத் திருத்தம்"
  meaning: "சிறப்பு விதிமுறைகளின்படி ஒரு சட்டத்திலோ அரசியலமைப்பிலோ செய்யப்படும் மாற்றம் அல்லது சேர்க்கை."
- id: amphibian
  word: "இருவாழ்வி"
  meaning: "தவளை, நியூட் போன்ற விலங்கு. பொதுவாக நீரில் வாழ்க்கையைத் தொடங்கி, பிறகு நிலத்திலும் வாழும்."
- id: amplitude
  word: "வீச்சு"
  meaning: "ஒரு அலை எவ்வளவு பெரியது என்பது. ஒலியில், வீச்சு பெரிதானால் சத்தமும் அதிகமாகும்."
- id: amygdala
  word: "அமிக்டலா"
  meaning: "மூளையின் ஆழத்தில் உள்ள, பாதாம் அளவிலான இரண்டு பகுதிகள். ஆபத்தைக் கவனிக்கவும், பயம் போன்ற உணர்வுகளை உண்டாக்கவும் இவை உதவுகின்றன."
- id: anaesthesia
  word: "மயக்க மருந்து"
  meaning: "அறுவை சிகிச்சையின்போது வலி தெரியாமல் இருக்கக் கொடுக்கப்படும் மருந்து."
- id: anatomy
  word: "உடற்கூறியல்"
  meaning: "உடல் உள்ளும் வெளியும் எப்படி அமைந்திருக்கிறது என்று படிக்கும் துறை."
- id: ancestor
  word: "மூதாதையர்"
  meaning: "நீங்கள் யாருடைய வழிவந்தவரோ, அந்த நெடுங்காலத்துக்கு முந்தைய மனிதர் அல்லது விலங்கு."
- id: antibiotic
  word: "ஆன்டிபயாட்டிக்"
  meaning: "பாக்டீரியாவைக் கொல்லும் அல்லது அவை வளர்வதைத் தடுக்கும் மருந்து. வைரஸ்களிடம் இது வேலை செய்யாது."
- id: antibody
  word: "எதிர்ப்பொருள்"
  meaning: "நோய் எதிர்ப்பு மண்டலம் உருவாக்கும் Y வடிவப் புரதம். இது ஒரு குறிப்பிட்ட கிருமியின் மேல் ஒட்டிக்கொண்டு, அதை அழிக்க வேண்டும் என்று அடையாளம் காட்டுகிறது."
- id: antigen
  word: "ஆன்டிஜென்"
  meaning: "ஒரு செல் அல்லது கிருமியின் மேற்பரப்பில் இருக்கும் அடையாளக் குறி. உடலின் பாதுகாப்புப் படை இதை வைத்து அதைக் கண்டுகொள்கிறது."
- id: antler
  word: "மான் கொம்பு"
  meaning: "மானின் தலையில் கிளை கிளையாக வளரும் எலும்புக் கொம்பு. இது ஒவ்வொரு ஆண்டும் உதிர்ந்து மீண்டும் வளரும்."
- id: apartheid
  word: "இன ஒதுக்கல் கொள்கை"
  meaning: "1948 முதல் 1990களின் தொடக்கம் வரை தென்னாப்பிரிக்காவில் இருந்த சட்டங்களின் அமைப்பு. இனத்தின் அடிப்படையில் மக்களைப் பிரித்து வைத்து, சமமற்றவர்களாக நடத்தியது."
- id: aqueduct
  word: "நீர்வழிப் பாலம்"
  meaning: "நீண்ட தூரத்துக்குத் தண்ணீரைக் கொண்டு செல்லக் கட்டப்படும் பாலம் அல்லது கால்வாய்."
- id: aquifer
  word: "நிலத்தடி நீர்ப்படுகை"
  meaning: "பூமிக்கடியில் தண்ணீரைத் தேக்கி வைத்து, அதைத் தன் வழியே ஓடவும் விடும் பாறை, மணல் அல்லது சரளைக்கல் அடுக்கு."
- id: arch
  word: "வளைவு"
  meaning: "ஒரு திறப்புக்கு மேலே எடையைத் தாங்கி நிற்கும் வளைந்த அமைப்பு."
- id: archaeologist
  word: "தொல்லியலாளர்"
  meaning: "மக்கள் விட்டுச் சென்ற பொருட்களைத் தோண்டி எடுத்து ஆராய்ந்து, கடந்த காலத்தைப் படிக்கும் அறிவியலாளர்."
- id: archaeology
  word: "தொல்லியல்"
  meaning: "பழைய பொருட்களையும் கட்டடங்களையும் தோண்டி எடுத்து ஆராய்ந்து, கடந்த காலத்தைப் படிக்கும் துறை."
- id: archipelago
  word: "தீவுக்கூட்டம்"
  meaning: "ஒன்றுக்கொன்று அருகருகே இருக்கும் தீவுகளின் குழு அல்லது வரிசை."
- id: architecture
  word: "கட்டடக்கலை"
  meaning: "கட்டடங்களை வடிவமைக்கும் கலையும் அறிவியலும்."
- id: artery
  word: "தமனி"
  meaning: "இதயத்திலிருந்து உடலின் மற்ற பகுதிகளுக்கு ரத்தத்தைக் கொண்டு செல்லும் குழாய்."
- id: asteroid
  word: "சிறுகோள்"
  meaning: "சூரியனைச் சுற்றி வரும் பாறைப் பொருள். கோளைவிட மிகச் சிறியது; கூழாங்கல் அளவிலிருந்து நூற்றுக்கணக்கான கிலோமீட்டர் அகலம் வரை இருக்கும்."
- id: asteroidbelt
  word: "சிறுகோள் பட்டை"
  meaning: "செவ்வாய், வியாழன் கோள்களின் சுற்றுப்பாதைகளுக்கு இடையே உள்ள, சிறுகோள்களின் அகலமான வளையம்."
- id: astronomer
  word: "வானியலாளர்"
  meaning: "நட்சத்திரங்கள், கோள்கள், விண்வெளி பற்றி ஆராயும் அறிவியலாளர்."
- id: atmosphere
  word: "வளிமண்டலம்"
  meaning: "ஒரு கோளைச் சுற்றியுள்ள வாயுக்களின் அடுக்கு; அந்தக் கோளின் ஈர்ப்பு விசை அதைப் பிடித்து வைத்திருக்கிறது. பூமியின் வளிமண்டலம்தான் நாம் சுவாசிக்கும் காற்று."
- id: atmospheric-pressure
  word: "வளிமண்டல அழுத்தம்"
  meaning: "நம்மைச் சுற்றியுள்ள எல்லாவற்றின் மீதும் கீழ்நோக்கி அழுத்தும் காற்றின் எடை."
- id: atoll
  word: "பவள வளையத் தீவு"
  meaning: "ஆழமில்லாத ஒரு காயலைச் சுற்றி வளைய வடிவில் அமைந்த பவளப்பாறை, அல்லது சின்னச் சின்னப் பவளத் தீவுகளின் வரிசை."
- id: atom
  word: "அணு"
  meaning: "எல்லாப் பொருட்களும் உருவாகியிருக்கும் சின்னஞ்சிறு கட்டுமானத் துண்டுகள். சாதாரண நுண்ணோக்கியால்கூடப் பார்க்க முடியாத அளவுக்குச் சிறியவை."
- id: autobiography
  word: "தன்வரலாறு"
  meaning: "ஒருவர் தன் சொந்த வாழ்க்கையைப் பற்றித் தானே எழுதும் நூல்."
- id: axis
  word: "அச்சு"
  meaning: "சுழலும் ஒரு பொருளின் நடுவே செல்வதாகக் கற்பனை செய்யப்படும் கோடு. பூமி தன் அச்சில் நாளுக்கு ஒருமுறை சுழல்கிறது."
- id: bacteria
  word: "பாக்டீரியா"
  meaning: "ஒரே ஒரு செல்லால் ஆன நுண்ணுயிரிகள். சில நோயை உண்டாக்கும்; ஆனால் பெரும்பாலானவை தீங்கற்றவை, பல நமக்கு உதவுபவை."
- id: ballast
  word: "நிலைப்பாரம்"
  meaning: "கப்பலோ நீர்மூழ்கிக் கப்பலோ நீரில் எப்படி நிற்கிறது, எவ்வளவு மூழ்குகிறது என்பதைக் கட்டுப்படுத்த அது சுமந்து செல்லும் எடை. பெரும்பாலும் இது தண்ணீர்."
- id: barometer
  word: "காற்றழுத்தமானி"
  meaning: "காற்றின் அழுத்தத்தை அளக்கும் கருவி. வானிலையை முன்கூட்டியே கணிக்க இது பயன்படுகிறது."
- id: basalt
  word: "பசால்ட்"
  meaning: "எரிமலைக் குழம்பு குளிர்ந்து உருவாகும் கருமையான, கடினமான பாறை."
- id: bhakti
  word: "பக்தி"
  meaning: "கடவுள் மீதான அன்பு நிறைந்த ஈடுபாடு. சாதி எதுவாக இருந்தாலும், அன்பின் வழியே யார் வேண்டுமானாலும் கடவுளை அடையலாம் என்று பக்தி இயக்கம் கற்பித்தது."
- id: bill
  word: "சட்ட மசோதா"
  meaning: "சட்டமாவதற்கு முன் சட்டம் இயற்றுபவர்கள் விவாதித்து ஓட்டுப் போடும், முன்மொழியப்பட்ட சட்டம்."
- id: binary
  word: "பைனரி"
  meaning: "0, 1 என்ற இரண்டு இலக்கங்களை மட்டும் வைத்து எண்களை எழுதும் முறை. கம்ப்யூட்டர்கள் எல்லாவற்றையும் இப்படித்தான் சேமிக்கின்றன."
- id: biodiversity
  word: "பல்லுயிர்ப் பெருக்கம்"
  meaning: "ஒரு இடத்தில் உள்ள உயிரினங்களின் பலவகைமை: அங்குள்ள எல்லாவிதத் தாவரங்கள், விலங்குகள், பூஞ்சைகள், நுண்ணுயிரிகள்."
- id: biography
  word: "வாழ்க்கை வரலாறு"
  meaning: "ஒரு உண்மையான மனிதரின் வாழ்க்கைக் கதை, வேறொருவர் எழுதியது."
- id: biologist
  word: "உயிரியலாளர்"
  meaning: "உயிரினங்களைப் பற்றி ஆராயும் அறிவியலாளர்."
- id: bioluminescence
  word: "உயிரொளிர்வு"
  meaning: "உயிரினங்கள் தங்கள் உடலுக்குள் நடக்கும் ஒரு வேதிவினையால் உண்டாக்கும் ஒளி."
- id: biomagnification
  word: "உயிரிப் பெருக்கம்"
  meaning: "உணவுச் சங்கிலியில் ஒவ்வொரு படி மேலே போகப் போக, விலங்குகளின் உடலில் ஒரு நச்சு மேலும் மேலும் செறிவாகச் சேர்வது."
- id: biometric
  word: "பயோமெட்ரிக்"
  meaning: "ஒருவரை அடையாளம் காணப் பயன்படும் அவருடைய உடல் அளவீடுகள்: கைரேகை, முக வடிவம், கண்ணில் உள்ள வடிவமைப்பு போன்றவை."
- id: botanist
  word: "தாவரவியலாளர்"
  meaning: "தாவரங்களைப் பற்றி ஆராயும் அறிவியலாளர்."
- id: buoyancy
  word: "மிதப்பு விசை"
  meaning: "நீரோ காற்றோ தனக்குள் இருக்கும் எந்தப் பொருளையும் மேல்நோக்கித் தள்ளும் விசை."
- id: buttress
  word: "முட்டுச்சுவர்"
  meaning: "ஒரு சுவர் வெளிப்புறமாகத் தள்ளப்படாமல் இருக்க, அதை ஒட்டிக் கட்டப்படும் தாங்கு அமைப்பு."
- id: caldera
  word: "கால்டெரா"
  meaning: "எரிமலை வெடித்த பிறகு அதன் உச்சி உள்வாங்கிச் சரியும்போது உண்டாகும், கிண்ண வடிவ மிகப் பெரிய பள்ளம்."
- id: calligraphy
  word: "அழகெழுத்துக் கலை"
  meaning: "அழகாகக் கையால் எழுதும் கலை."
- id: calorie
  word: "கலோரி"
  meaning: "உணவில் சேமிக்கப்பட்டிருக்கும் ஆற்றலை அளக்கும் அலகு."
- id: camouflage
  word: "உருமறைப்பு"
  meaning: "ஒரு விலங்கு தன்னைச் சுற்றியுள்ள இடத்தோடு கலந்து மறைந்திருக்க உதவும் நிறங்கள் அல்லது வடிவங்கள்."
- id: canopy
  word: "மேல்விதானம்"
  meaning: "மரங்களின் உச்சிகள் ஒன்றோடொன்று சேரும், காட்டின் மேல் அடுக்கு."
- id: capacitance
  word: "மின்தேக்குத் திறன்"
  meaning: "ஒரு பொருள் எவ்வளவு மின்னூட்டத்தைச் சேமிக்க முடியும் என்பது. உங்கள் உடலுக்கும் இந்தத் திறன் கணிசமாகவே உண்டு."
- id: capillary
  word: "தந்துகி"
  meaning: "முடியைவிட மெல்லிய, மிக நுண்ணிய ரத்தக்குழாய். இங்குதான் ரத்தம் உடலுக்கு ஆக்சிஜனைக் கொடுக்கிறது."
- id: capsaicin
  word: "கேப்சைசின்"
  meaning: "வாய் எரிவது போல உணர வைக்கும், மிளகாயில் உள்ள வேதிப்பொருள்."
- id: caravan
  word: "வணிகர் கூட்டம்"
  meaning: "நீண்ட பயணத்தில் பாதுகாப்புக்காக ஒன்றாகச் செல்லும் வணிகர்களும் அவர்களுடைய ஒட்டகம் போன்ற விலங்குகளும் அடங்கிய குழு."
- id: carbohydrate
  word: "கார்போஹைட்ரேட்"
  meaning: "அரிசி, ரொட்டி, சர்க்கரை போன்றவற்றில் உள்ள, உடலுக்கு ஆற்றல் தரும் ஊட்டச்சத்து."
- id: carbon-dioxide
  word: "கார்பன் டை ஆக்சைடு"
  meaning: "நாம் வெளியே விடும் மூச்சில் உள்ள வாயு. தாவரங்கள் இதை உள்ளிழுத்து உணவு தயாரிக்கின்றன."
- id: carcass
  word: "சடலம்"
  meaning: "இறந்த விலங்கின் உடல்."
- id: carnivore
  word: "ஊனுண்ணி"
  meaning: "பெரும்பாலும் இறைச்சியையே உண்ணும் விலங்கு."
- id: cartilage
  word: "குருத்தெலும்பு"
  meaning: "மூட்டுகளுக்கு மெத்தையாக இருந்து, காதுகளுக்கும் மூக்கு நுனிக்கும் வடிவம் தரும் உறுதியான, வளையக்கூடிய திசு."
- id: catalyst
  word: "வினையூக்கி"
  meaning: "தான் செலவழியாமலேயே ஒரு வேதிவினையை வேகப்படுத்தும் பொருள்."
- id: cell
  word: "செல்"
  meaning: "ஒவ்வொரு தாவரத்துக்கும் விலங்குக்கும் அடிப்படையான, உயிருள்ள சின்னஞ்சிறு கட்டுமானத் துண்டு. பெரும்பாலானவை கண்ணுக்குத் தெரியாத அளவுக்குச் சிறியவை."
- id: cellulose
  word: "செல்லுலோஸ்"
  meaning: "தாவர செல்களின் சுவர்கள் உருவாகியிருக்கும் கடினமான பொருள். மரம், பருத்தி, காகிதம் எல்லாம் பெரும்பாலும் செல்லுலோஸ்தான்."
- id: census
  word: "மக்கள்தொகைக் கணக்கெடுப்பு"
  meaning: "ஒரு நாட்டில் உள்ள எல்லா மக்களையும் அதிகாரபூர்வமாக எண்ணுவது."
- id: centre-of-mass
  word: "நிறை மையம்"
  meaning: "ஒரு பொருளின் சமநிலைப் புள்ளி. அதன் எடை முழுவதும் அந்த ஒரே இடத்தில் குவிந்திருப்பது போலச் செயல்படும்."
- id: centrifugal
  word: "மையவிலக்கு"
  meaning: "வட்டமாகச் சுற்றும்போது வெளிப்புறமாகத் தள்ளப்படுவது போல நாம் உணரும் உந்துதலைக் குறிக்கும் சொல்."
- id: cephalopod
  word: "தலைக்காலி"
  meaning: "தலையைச் சுற்றிக் கைகள் கொண்ட கடல் விலங்கு. ஆக்டோபஸ், கணவாய், ஓட்டுக் கணவாய் போன்றவை."
- id: charge
  word: "மின்னூட்டம்"
  meaning: "ஒரு பொருள் சுமந்திருக்கும் மின்சாரத்தின் அளவு."
- id: chiaroscuro
  word: "கியாரோஸ்குரோ"
  meaning: "ஓவியத்திலோ வரைபடத்திலோ ஒளிக்கும் இருளுக்கும் இடையே காட்டப்படும் கூர்மையான வித்தியாசம். வடிவங்கள் திடமாகத் தெரிய இது உதவுகிறது."
- id: chlorophyll
  word: "பச்சையம்"
  meaning: "இலைகளில் உள்ள பச்சை நிறமி. தாவரம் உணவு தயாரிக்கச் சூரிய ஒளியை இது உறிஞ்சிக்கொள்கிறது."
- id: chromosome
  word: "குரோமோசோம்"
  meaning: "செல்லுக்குள் இறுக்கமாகச் சுருண்டிருக்கும் டிஎன்ஏ இழை. பெரும்பாலான மனித செல்களில் 23 இணைகளாக, மொத்தம் 46 குரோமோசோம்கள் உண்டு."
- id: cilia
  word: "குற்றிழைகள்"
  meaning: "சில செல்களின் மேல் உள்ள நுண்ணிய முடிகள். இவை முன்னும் பின்னும் அசைந்து, திரவத்தையோ சளியையோ நகர்த்துகின்றன."
- id: cipher
  word: "மறைக்குறியீடு"
  meaning: "சாவி தெரிந்தவர்கள் மட்டும் படிக்க முடியும்படி ஒரு செய்தியை ரகசியமாக எழுதும் முறை."
- id: circadian
  word: "சர்க்காடியன்"
  meaning: "தூங்குவதும் விழிப்பதுமான தினசரித் தாளம் போல, சுமார் 24 மணி நேரச் சுழற்சியில் நடப்பது."
- id: circuit
  word: "மின்சுற்று"
  meaning: "மின்சாரம் சுற்றி ஓடக்கூடிய, முழுமையான ஒரு வளையப் பாதை."
- id: circumnavigation
  word: "உலகச் சுற்றுப் பயணம்"
  meaning: "ஒன்றை முழுவதுமாகச் சுற்றி வரும் பயணம், குறிப்பாக முழு பூமியையும் சுற்றி வருவது."
- id: citizen
  word: "குடிமக்கள்"
  meaning: "ஒரு நாட்டைச் சேர்ந்தவர்களாக, அங்கே உரிமைகள் பெற்றிருப்பவர்கள்."
- id: civilisation
  word: "நாகரிகம்"
  meaning: "நகரங்கள், சட்டங்கள், எழுத்து, வணிகம் எல்லாம் கொண்ட, பெரிய, ஒழுங்கமைந்த சமூகம்."
- id: classify
  word: "வகைப்படுத்துதல்"
  meaning: "பொதுவான பண்புகளை வைத்துப் பொருட்களைக் குழுக்களாகப் பிரிப்பது."
- id: climate
  word: "காலநிலை"
  meaning: "ஒரு இடத்தில் பல ஆண்டுகளாக வழக்கமாக நிலவும் வானிலை. இன்று மழை பெய்வது வானிலை; ‘ஒவ்வொரு நவம்பரிலும் மழை கொட்டும்’ என்பது காலநிலை."
- id: cnidocyte
  word: "கொட்டும் செல்"
  meaning: "ஜெல்லிமீன், பவளம், கடல் அனிமோன் இவற்றில் உள்ள கொட்டும் செல். இது நஞ்சு கொண்ட ஒரு சின்ன நூலை வேகமாகப் பாய்ச்சுகிறது."
- id: cochlea
  word: "காக்ளியா"
  meaning: "உள்காதில் உள்ள, நத்தை ஓடு வடிவிலான, திரவம் நிறைந்த குழாய். இது ஒலியை நரம்புச் சமிக்ஞைகளாக மாற்றுகிறது."
- id: cocoon
  word: "பட்டுக்கூடு"
  meaning: "சில கம்பளிப்பூச்சிகள் அந்துப்பூச்சியாக மாறும் முன், தங்களைச் சுற்றிப் பின்னிக்கொள்ளும் பட்டு போன்ற கூடு."
- id: collagen
  word: "கொலாஜன்"
  meaning: "தோல், எலும்பு, தசைகளை ஒன்றாகப் பிணைத்து வைக்கும் உறுதியான, நார் போன்ற புரதம். மெதுவாக நெடுநேரம் சமைத்தால் இது மென்மையான ஜெலட்டினாக மாறும்."
- id: colonial
  word: "காலனிய"
  meaning: "ஒரு நாடு தொலைவில் உள்ள இன்னொரு நாட்டை ஆண்ட காலத்தோடு தொடர்புடையது."
- id: colony
  word: "காலனி"
  meaning: "தாய்நாட்டிலிருந்து தொலைவில் மக்கள் அமைக்கும் நகரம் அல்லது குடியிருப்பு. தாங்கள் வந்த இடத்தோடு அது தொடர்பு வைத்திருக்கும்."
- id: combustion
  word: "எரிதல் வினை"
  meaning: "எரிவதை அறிவியலில் இப்படி அழைக்கிறோம்: எரிபொருளுக்கும் ஆக்சிஜனுக்கும் இடையே நடக்கும் வேகமான வினை. இது வெப்பத்தையும் ஒளியையும் தருகிறது."
- id: comet
  word: "வால் நட்சத்திரம்"
  meaning: "சூரியக் குடும்பத்தின் விளிம்பிலிருந்து வரும் பனியும் தூசும் கலந்த உருண்டை. சூரியனை நெருங்கும்போது அதற்கு ஒளிரும் வால் முளைக்கும்."
- id: compost
  word: "மட்கு உரம்"
  meaning: "உணவுக் கழிவுகள், இலைகள், சாணம் இவை மட்கிப்போய் உருவாகும், கரிய, உதிரும் மண் போன்ற பொருள். இது தாவரங்களுக்கு உணவாகிறது."
- id: compound
  word: "சேர்மம்"
  meaning: "இரண்டு அல்லது அதற்கு மேற்பட்ட தனிமங்கள் இணைந்து உருவான பொருள். தண்ணீர் ஒரு சேர்மம்."
- id: condensation
  word: "ஆவி சுருங்குதல்"
  meaning: "நீராவி போன்ற ஒரு வாயு குளிர்ந்து திரவமாக மாறுவது. குளிர்ந்த தம்ளரின் வெளியே நீர்த்துளிகள் படிவது இதனால்தான்."
- id: conductor
  word: "கடத்தி"
  meaning: "செம்பு போல, வெப்பத்தையோ மின்சாரத்தையோ எளிதாகத் தன் வழியே கடத்தும் பொருள்."
- id: conservator
  word: "கலைப்பொருள் பாதுகாப்பாளர்"
  meaning: "பழைய பொருட்களையும் கலைப்படைப்புகளையும் பத்திரமாக வைத்திருக்க, அவற்றை ஆராய்ந்து, சுத்தம் செய்து, சீர்செய்யும் பயிற்சி பெற்ற நிபுணர்."
- id: constellation
  word: "விண்மீன் கூட்டம்"
  meaning: "வானில் ஒரு படம் போல மக்கள் கற்பனை செய்யும் நட்சத்திரங்களின் குழு."
- id: constitution
  word: "அரசியலமைப்பு"
  meaning: "ஒரு நாடு எப்படி நடத்தப்பட வேண்டும் என்று சொல்லும் அடிப்படை விதிகளின் தொகுப்பு."
- id: contaminate
  word: "மாசுபடுத்துதல்"
  meaning: "தேவையில்லாத ஒன்றைச் சேர்த்து, ஒரு பொருளை அழுக்காகவோ தீங்கானதாகவோ ஆக்குவது."
- id: continent
  word: "கண்டம்"
  meaning: "ஆசியா, ஆப்பிரிக்கா போல, பூமியில் உள்ள ஏழு மிகப் பெரிய நிலப்பரப்புகளில் ஒன்று."
- id: cooperative
  word: "கூட்டுறவு"
  meaning: "உறுப்பினர்களே சேர்ந்து உரிமையாளர்களாக இருந்து நடத்தி, வரும் வருமானத்தைப் பகிர்ந்துகொள்ளும் தொழில் அமைப்பு."
- id: coprolite
  word: "மலப் புதைபடிவம்"
  meaning: "புதைபடிவமாகிப்போன மலம். அது கல்லாக மாறிவிட்டதால் கவலைப்பட வேண்டாம், நாற்றம் அடிக்காது."
- id: core
  word: "உட்கரு"
  meaning: "பூமியின் நடுப்பகுதி. வெளி உட்கரு திரவமாகவும் உள் உட்கரு திடமாகவும் இருக்கும்; இரண்டிலும் பெரும்பாலும் இரும்புதான்."
- id: cornea
  word: "கார்னியா"
  meaning: "உங்கள் கண்ணின் முன்பக்கம் உள்ள தெளிவான ஜன்னல்."
- id: couplet
  word: "ஈரடி"
  meaning: "ஒன்றாகச் சேர்ந்து வரும் இரண்டு கவிதை வரிகள்; பெரும்பாலும் ஒரே தாளமோ எதுகையோ கொண்டிருக்கும். திருக்குறளின் ஒவ்வொரு குறளும் ஈரடிதான்."
- id: crater
  word: "குழிப்பள்ளம்"
  meaning: "ஏதாவது ஒன்று தரையில் வந்து மோதும்போது உண்டாகும் கிண்ண வடிவக் குழி. எரிமலையின் உச்சியிலும் இப்படி ஒன்று இருக்கும்."
- id: crust
  word: "புவி மேலோடு"
  meaning: "பூமியின் மெல்லிய, பாறையாலான வெளி அடுக்கு."
- id: crystal
  word: "படிகம்"
  meaning: "தன் சின்னஞ்சிறு கட்டுமானத் துண்டுகள் ஒழுங்காக, திரும்பத் திரும்ப வரும் வடிவத்தில் அடுக்கப்பட்ட திடப்பொருள். உப்பு, சர்க்கரைத் துகள்கள் போல."
- id: currency
  word: "செலாவணி"
  meaning: "ரூபாய், டாலர் போல, ஒரு நாடு பயன்படுத்தும் பண வகை."
- id: current
  word: "ஓட்டம்"
  meaning: "நீர், காற்று அல்லது மின்சாரம் ஒரே திசையில் பாய்ந்து செல்வது. நீரோட்டம், மின்னோட்டம் என்கிறோமே, அதுதான்."
- id: customs
  word: "சுங்கத் துறை"
  meaning: "ஒரு நாட்டுக்குள் மக்கள் கொண்டுவரும் பொருட்களை எல்லையில் சோதித்து, அவற்றுக்கு வரி ஏதும் இருந்தால் வசூலிக்கும் அதிகாரிகள்."
- id: cyclone
  word: "புயல்"
  meaning: "மிகப் பெரிய சுழல் புயல். இந்தியாவுக்கு அருகே உருவாகும் இத்தகைய புயலை ஆங்கிலத்தில் ‘சைக்ளோன்’ என்கிறார்கள்."
- id: decibel
  word: "டெசிபல்"
  meaning: "ஒலி எவ்வளவு சத்தமாக இருக்கிறது என்று அளக்கும் அலகு. 10 டெசிபல் கூடும் ஒவ்வொரு முறையும் ஒலி ஆற்றல் பத்து மடங்கு ஆகிறது."
- id: decimal
  word: "தசம எண்"
  meaning: "பாதியை 0.5 என்று எழுதுவது போல, புள்ளி வைத்து ஒரு முழுமையின் பகுதிகளை எழுதும் முறை."
- id: deforestation
  word: "காடழிப்பு"
  meaning: "பெரிய பரப்பில் காடுகளை வெட்டி அழிப்பது."
- id: delta
  word: "டெல்டா"
  meaning: "ஆறு கடலை அடையும் இடத்தில், அது கொண்டுவந்து போடும் சேறும் மணலும் சேர்ந்து உருவாகும் சமதள நிலம். காவிரி டெல்டா இதற்கு நல்ல எடுத்துக்காட்டு."
- id: democracy
  word: "மக்களாட்சி"
  meaning: "மக்கள் ஓட்டுப் போட்டுத் தலைவர்களைத் தேர்ந்தெடுக்கும் ஆட்சிமுறை."
- id: density
  word: "அடர்த்தி"
  meaning: "ஒரு இடத்துக்குள் எவ்வளவு பொருள் அடைக்கப்பட்டிருக்கிறது என்பது. ஒரே அளவுள்ள செங்கல்லுக்கும் கடற்பஞ்சுக்கும் அடர்த்தி மிகவும் வேறுபடும்."
- id: descendant
  word: "வழித்தோன்றல்"
  meaning: "பேரக்குழந்தை போல, ஒரு மூதாதையருக்குப் பின் வரும் மனிதர் அல்லது விலங்கு."
- id: dialect
  word: "வட்டார வழக்கு"
  meaning: "தனக்கே உரிய சில சொற்கள், ஒலிகள் அல்லது இலக்கணம் கொண்ட, ஒரு மொழியின் உள்ளூர் வடிவம். மதுரைத் தமிழும் கோவைத் தமிழும் போல."
- id: diameter
  word: "விட்டம்"
  meaning: "ஒரு வட்டத்தின் நடுவழியாக, ஒரு பக்கத்திலிருந்து மறுபக்கம் செல்லும் நேர்கோடு."
- id: diaphragm
  word: "உதரவிதானம்"
  meaning: "நுரையீரலுக்குக் கீழே உள்ள குவிமாட வடிவத் தசைத் தகடு. அது இறுகித் தட்டையாகும்போது காற்று நுரையீரலுக்குள் இழுக்கப்படுகிறது."
- id: digestion
  word: "செரிமானம்"
  meaning: "உடல் பயன்படுத்தும்படி உணவை உடைத்துச் சிதைக்கும் செயல்."
- id: dissolve
  word: "கரைதல்"
  meaning: "டீயில் சர்க்கரை போல, ஒரு திடப்பொருள் திரவத்தில் கலந்து மறைந்துவிட்டது போலத் தெரிவது."
- id: distillation
  word: "காய்ச்சி வடித்தல்"
  meaning: "ஒரு திரவத்தைக் கொதிக்கவைத்து, அதன் ஆவியைக் குளிரவைத்து, அதைத் தூய்மையாக்கும் முறை."
- id: distributary
  word: "கிளையாறு"
  meaning: "ஆற்றிலிருந்து பிரிந்து, அதை விட்டு விலகி ஓடும் சிறிய நீர்வழி. பெரும்பாலும் டெல்டாவில் காணப்படும்."
- id: dna
  word: "டிஎன்ஏ"
  meaning: "ஒவ்வொரு செல்லுக்குள்ளும் இருக்கும் வேதிக் குறியீடு. ஒரு உயிரினம் எப்படி வளர வேண்டும் என்ற கட்டளைகளை இது சுமந்திருக்கிறது."
- id: dome
  word: "குவிமாடம்"
  meaning: "பாதிப் பந்து வடிவிலான உருண்டையான கூரை."
- id: domesticate
  word: "பழக்கப்படுத்துதல்"
  meaning: "காட்டுத் தாவரத்தையோ விலங்கையோ பல தலைமுறைகளாகப் பழக்கி, மனிதர்களோடு சேர்ந்து வாழவும் வளரவும் செய்வது."
- id: dopamine
  word: "டோபமைன்"
  meaning: "மகிழ்ச்சி, ஆசை, வெகுமதி இவற்றோடு தொடர்புடைய, மூளையில் உள்ள ஒரு வேதித் தூதுவன்."
- id: doping
  word: "ஊக்கமருந்து பயன்பாடு"
  meaning: "விளையாட்டில் திறனைக் கூட்டத் தடைசெய்யப்பட்ட மருந்துகளையோ வழிமுறைகளையோ பயன்படுத்துவது. இது ஏமாற்று வேலை; உடல்நலத்தையும் கெடுக்கும்."
- id: downforce
  word: "கீழ்நோக்கு விசை"
  meaning: "காரின் இறக்கைகள் மீது பாயும் காற்றால் உண்டாகும் விசை. இது காரைச் சாலையோடு அழுத்தி, பிடிப்பைக் கூட்டுகிறது."
- id: drag
  word: "இழுவிசை"
  meaning: "ஒரு பொருள் காற்றிலோ நீரிலோ நகரும்போது, அதை எதிர்த்துத் தள்ளி வேகத்தைக் குறைக்கும் விசை."
- id: drought
  word: "வறட்சி"
  meaning: "வழக்கத்தைவிட மிகக் குறைவாக மழை பெய்யும் நீண்ட காலம்."
- id: dynasty
  word: "அரச வம்சம்"
  meaning: "ஆட்சி அதிகாரம் பெற்றோரிடமிருந்து பிள்ளைகளுக்குக் கைமாறும் அரச குடும்பம். பெரும்பாலும் இது பல தலைமுறைகளுக்குத் தொடரும்."
- id: echinoderm
  word: "முட்தோலி"
  meaning: "நட்சத்திர மீன், கடல் முள்ளெலி, கடல் வெள்ளரி போன்ற, முள் நிறைந்த தோல் கொண்ட கடல் விலங்கு."
- id: echolocation
  word: "எதிரொலி இடமறிதல்"
  meaning: "ஒலியை எழுப்பி, மோதித் திரும்பி வரும் எதிரொலியைக் கேட்டுப் பொருட்களைக் கண்டுபிடிப்பது."
- id: eclipse
  word: "கிரகணம்"
  meaning: "சந்திரன் சூரியனை மறைப்பது, அல்லது பூமியின் நிழல் சந்திரன் மீது விழுவது."
- id: economy
  word: "பொருளாதாரம்"
  meaning: "ஒரு நாடு பொருட்களை எப்படி உற்பத்தி செய்கிறது, வாங்குகிறது, விற்கிறது, பணம் ஈட்டுகிறது என்பது."
- id: ecosystem
  word: "சூழல் மண்டலம்"
  meaning: "ஒரு இடத்தில் உள்ள எல்லா உயிரினங்களும், அவை ஒன்றை ஒன்று எப்படிச் சார்ந்து வாழ்கின்றன என்பதும்."
- id: edict
  word: "அரசாணை"
  meaning: "ஒரு அரசர் வெளியிடும் அதிகாரபூர்வ ஆணை அல்லது அறிவிப்பு. பேரரசர் அசோகர் தன் அரசாணைகளைப் பாறைகளிலும் தூண்களிலும் செதுக்கச் செய்தார்."
- id: electrolyte
  word: "மின்பகுபொருள்"
  meaning: "பேட்டரிக்குள் இருக்கும் பொருள். அதன் இரண்டு முனைகளுக்கு இடையே மின்னூட்டம் கொண்ட துகள்கள் நகர இது உதவுகிறது."
- id: electron
  word: "எலக்ட்ரான்"
  meaning: "ஒவ்வொரு அணுவிலும் இருக்கும், எதிர் மின்னூட்டம் கொண்ட சின்னஞ்சிறு துகள். எலக்ட்ரான்கள் நகரும்போது மின்னோட்டம் உண்டாகிறது."
- id: element
  word: "தனிமம்"
  meaning: "தங்கம், ஆக்சிஜன் போல, ஒரே வகை அணுக்களால் மட்டுமே ஆன தூய பொருள்."
- id: embroidery
  word: "பூத்தையல்"
  meaning: "நூலால் வடிவங்களைத் தைத்துத் துணியை அலங்கரிப்பது."
- id: emperor
  word: "பேரரசர்"
  meaning: "ஒரு பேரரசை ஆள்பவர். பொதுவாக அரசரைவிட அதிக அதிகாரம் கொண்டவர்."
- id: empire
  word: "பேரரசு"
  meaning: "ஒரே ஆட்சியாளரின் அல்லது ஒரே நாட்டின் கீழ் ஆளப்படும் பல நாடுகள் அல்லது நிலப்பகுதிகள்."
- id: enamel
  word: "பல் எனாமல்"
  meaning: "பல்லின் கடினமான, பளபளப்பான வெளிப்பூச்சு. மனித உடலிலேயே மிகக் கடினமான பொருள் இதுதான்."
- id: enclave
  word: "சூழ்நிலப் பகுதி"
  meaning: "முழுவதும் இன்னொரு நாட்டால் சூழப்பட்டிருக்கும், ஒரு நாட்டின் நிலப்பகுதி."
- id: encryption
  word: "மறையாக்கம்"
  meaning: "சரியான சாவி உள்ளவர் மட்டுமே படிக்க முடியும்படி, ஒரு ரகசியச் சாவியை வைத்து ஒரு செய்தியைக் கலைத்து மாற்றுவது."
- id: endangered
  word: "அழிவின் விளிம்பில்"
  meaning: "காடுகளில் மிகச் சிலவே மிஞ்சியிருப்பதால், அந்த இனமே முழுவதுமாக அழிந்துபோகும் ஆபத்தில் இருப்பது."
- id: endemic
  word: "ஓரிடவாழ் உயிரி"
  meaning: "உலகின் ஒரே ஒரு பகுதியில் மட்டும் இயற்கையாக வாழ்வது; வேறு எங்கும் காண முடியாது."
- id: endurance
  word: "தாங்குதிறன்"
  meaning: "நீண்ட நேரம் சோர்ந்துவிடாமல் தொடர்ந்து செயல்படும் திறன்."
- id: energy
  word: "ஆற்றல்"
  meaning: "பொருட்களை நகர வைக்கும், சூடாக்கும், மாற்றும் சக்தி."
- id: engineer
  word: "பொறியாளர்"
  meaning: "இயந்திரங்கள், பாலங்கள் போன்ற அமைப்புகளை வடிவமைத்து உருவாக்குபவர்."
- id: enzyme
  word: "நொதி"
  meaning: "உணவைச் சின்னத் துண்டுகளாக உடைப்பது போல, ஒரு உயிரினத்துக்குள் நடக்கும் வேதிமாற்றத்தை வேகப்படுத்தும் புரதம்."
- id: epic
  word: "காப்பியம்"
  meaning: "வீரர்கள், கடவுளர், பெரும் சாதனைகள் பற்றிய மிக நீண்ட கவிதை அல்லது கதை."
- id: epidemic
  word: "கொள்ளைநோய்"
  meaning: "ஒரு பகுதியில் ஒரே நேரத்தில் பலருக்கு ஒரு நோய் பரவுவது."
- id: equator
  word: "நிலநடுக்கோடு"
  meaning: "இரண்டு துருவங்களுக்கும் நடுவே, பூமியின் நடுப்பகுதியைச் சுற்றிச் செல்வதாகக் கற்பனை செய்யப்படும் கோடு."
- id: equinox
  word: "சம இரவு நாள்"
  meaning: "ஆண்டுக்கு இருமுறை வரும், பகலும் இரவும் ஏறக்குறைய சம நீளம் கொண்ட நாள்."
- id: erosion
  word: "அரிப்பு"
  meaning: "நீர், காற்று அல்லது பனியால் பாறைகளும் மண்ணும் தேய்ந்து அரிக்கப்படுவது."
- id: estuary
  word: "கழிமுகம்"
  meaning: "ஆறு கடலைச் சந்தித்து, நன்னீரும் உப்புநீரும் கலக்கும் இடம்."
- id: ethics
  word: "அறவியல்"
  meaning: "எது சரி, எது தவறு, மக்கள் ஒருவரை ஒருவர் எப்படி நடத்த வேண்டும் என்று ஆராயும் துறை."
- id: evaporation
  word: "ஆவியாதல்"
  meaning: "வெயிலில் மழைநீர்க் குட்டை காய்வது போல, ஒரு திரவம் மெல்ல மெல்ல வாயுவாக மாறுவது."
- id: evolution
  word: "பரிணாம வளர்ச்சி"
  meaning: "பல பல தலைமுறைகளாக உயிரினங்கள் மெல்ல மாறும் விதம். தங்கள் சூழலுக்கு மிகப் பொருத்தமானவை அதிகச் சந்ததிகளை உருவாக்குவதால் இது நடக்கிறது."
- id: evolve
  word: "பரிணமித்தல்"
  meaning: "பல தலைமுறைகளில் மெல்ல மெல்ல மாறுவது."
- id: exoplanet
  word: "புறக்கோள்"
  meaning: "நம் சூரியனைத் தவிர வேறொரு நட்சத்திரத்தைச் சுற்றி வரும் கோள்."
- id: expedition
  word: "ஆய்வுப் பயணம்"
  meaning: "புதிய இடங்களை ஆராய்வது போன்ற ஒரு சிறப்பு நோக்கத்துக்காக மேற்கொள்ளப்படும் நீண்ட பயணம்."
- id: export
  word: "ஏற்றுமதி"
  meaning: "வேறொரு நாட்டுக்குப் பொருட்களை விற்பது."
- id: extinct
  word: "அழிந்துபோன"
  meaning: "ஒரு உயிரின வகையில் கடைசி ஒன்றுவரை எல்லாமே இறந்துவிட்டால், அந்த இனம் அழிந்துவிட்டது என்கிறோம். நிரந்தரமாக மறைந்துவிட்டது."
- id: fable
  word: "நீதிக்கதை"
  meaning: "பெரும்பாலும் விலங்குகளைக் கதாபாத்திரங்களாகக் கொண்டு, ஒரு பாடம் சொல்லும் சிறுகதை. பஞ்சதந்திரக் கதைகள் போல."
- id: famine
  word: "பஞ்சம்"
  meaning: "பலருக்குப் போதுமான உணவு கிடைக்காத காலம்."
- id: federal
  word: "கூட்டாட்சி"
  meaning: "தேசிய அரசுக்கும் மாநில அல்லது மாகாண அரசுகளுக்கும் இடையே அதிகாரம் பகிர்ந்தளிக்கப்படும் முறை."
- id: fermentation
  word: "நொதித்தல்"
  meaning: "ஈஸ்ட் போன்ற நுண்ணுயிரிகள் சர்க்கரையை வாயுவாகவோ அமிலமாகவோ ஆல்கஹாலாகவோ மாற்றுவது."
- id: fertile
  word: "வளமான"
  meaning: "தாவரங்கள் செழித்து வளர ஏற்ற, அல்லது குட்டிகளை ஈனும் திறன் கொண்ட."
- id: fertiliser
  word: "உரம்"
  meaning: "தாவரங்கள் நன்றாக வளர மண்ணில் சேர்க்கப்படும் பொருள்."
- id: feudalism
  word: "நிலப்பிரபுத்துவம்"
  meaning: "இடைக்காலத்தில் சமூகத்தை அமைத்திருந்த முறை. பிரபுக்கள் தங்களைப் பின்பற்றுபவர்களுக்கு நிலம் கொடுத்தார்கள்; பதிலுக்கு அவர்கள் பிரபுக்களுக்காகப் போரிட்டார்கள் அல்லது உழைத்தார்கள்."
- id: filter-feeder
  word: "வடிகட்டி உண்ணி"
  meaning: "தண்ணீரிலிருந்து சின்னஞ்சிறு உணவுத் துகள்களைச் சலித்து எடுத்து உண்ணும் விலங்கு."
- id: foley
  word: "ஃபோலி"
  meaning: "காலடிச் சத்தம், உடை சரசரக்கும் ஒலி போன்ற அன்றாட ஒலிகளை ஸ்டுடியோவில் பதிவுசெய்து திரைப்படத்தில் சேர்ப்பது."
- id: folklore
  word: "நாட்டுப்புற மரபு"
  meaning: "வாய்மொழியாகவே தலைமுறை தலைமுறையாகக் கைமாறி வரும் பழைய கதைகள், நம்பிக்கைகள், பழக்கவழக்கங்கள்."
- id: follicle
  word: "மயிர்க்கால்"
  meaning: "ஒரு முடி வளர்ந்து வெளியே வரும், தோலில் உள்ள சின்னஞ்சிறு பை."
- id: foodchain
  word: "உணவுச் சங்கிலி"
  meaning: "யார் யாரை உண்கிறார்கள் என்பது. சூரிய ஒளி தாவரங்களுக்கு உணவு, தாவரங்கள் தாவர உண்ணிகளுக்கு, தாவர உண்ணிகள் ஊனுண்ணிகளுக்கு. ஒரு கண்ணி அறுந்தாலும், அதற்குப் பின் உள்ள எல்லாமே பாதிக்கப்படும்."
- id: force
  word: "விசை"
  meaning: "ஒரு தள்ளல் அல்லது ஒரு இழுப்பு."
- id: fortress
  word: "கோட்டை"
  meaning: "தாக்குதலிலிருந்து மக்களைக் காக்க, உறுதியான சுவர்களோடு கட்டப்பட்ட பெரிய கட்டடம்."
- id: fossil
  word: "புதைபடிவம்"
  meaning: "பாறையில் பாதுகாக்கப்பட்ட பழங்கால உயிரின் எந்தச் சுவடும்: எலும்புகள், ஓடுகள், இலைகள், கால்தடங்கள், ஏன், மலம்கூட."
- id: fraction
  word: "பின்னம்"
