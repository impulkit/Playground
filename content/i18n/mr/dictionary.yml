- id: caravan
  word: काफिला
  meaning: लांबच्या प्रवासात सुरक्षिततेसाठी एकत्र प्रवास करणारा व्यापाऱ्यांचा आणि त्यांच्या उंटांसारख्या जनावरांचा गट.
- id: carbohydrate
  word: कर्बोदक
  meaning: भात, पाव आणि साखर यांत असणारा अन्नघटक. तो तुला ऊर्जा देतो.
- id: carbon-dioxide
  word: कार्बन डायऑक्साइड
  meaning: आपण श्वासातून बाहेर सोडतो तो वायू. वनस्पती तो आत घेऊन अन्न तयार करतात.
- id: carcass
  word: मृत प्राण्याचं शरीर
  meaning: मेलेल्या प्राण्याचं शरीर.
- id: carnivore
  word: मांसाहारी प्राणी
  meaning: मुख्यतः मांस खाणारा प्राणी.
- id: cartilage
  word: कूर्चा
  meaning: कणखर पण लवचीक ऊती. ती सांध्यांना गादीसारखा आधार देते आणि कानांना व नाकाच्या टोकाला आकार देते.
- id: catalyst
  word: कॅटॅलिस्ट (उत्प्रेरक)
  meaning: स्वतः न संपता रासायनिक अभिक्रियेचा वेग वाढवणारा पदार्थ.
- id: cell
  word: पेशी
  meaning: प्रत्येक वनस्पती आणि प्राणी ज्यांपासून बनतो ते अगदी बारीक जिवंत घटक. बहुतेक पेशी डोळ्यांना दिसत नाहीत इतक्या लहान असतात.
- id: cellulose
  word: सेल्युलोज
  meaning: वनस्पतींच्या पेशींच्या भिंती ज्यापासून बनतात तो कणखर पदार्थ. लाकूड, कापूस आणि कागद मुख्यतः सेल्युलोजचेच बनलेले असतात.
- id: census
  word: जनगणना
  meaning: देशातल्या सगळ्या लोकांची अधिकृत मोजणी.
- id: centre-of-mass
  word: वस्तुमानाचा मध्य
  meaning: वस्तूचा तोल सांभाळणारा बिंदू. तिचं सगळं वजन जणू त्या एकाच ठिकाणी एकवटलं आहे, अशा रीतीने ते काम करतं.
- id: centrifugal
  word: केंद्रोत्सारी
  meaning: गोल गोल फिरताना जाणवणाऱ्या, बाहेरच्या दिशेने ढकलणाऱ्या जोराचं वर्णन करणारा शब्द.
- id: cephalopod
  word: शीर्षपाद
  meaning: डोक्याभोवती बाहू असलेला समुद्री प्राणी, जसे ऑक्टोपस, स्क्विड किंवा कटलफिश.
- id: charge
  word: विद्युतभार
  meaning: एखाद्या वस्तूत असलेलं विजेचं प्रमाण.
- id: chiaroscuro
  word: किआरोस्क्युरो
  meaning: चित्रात किंवा रेखाटनात प्रकाश आणि अंधार यांचा ठळक विरोधाभास. त्यामुळे आकार भरीव दिसतात.
- id: chlorophyll
  word: हरितद्रव्य
  meaning: पानांतला हिरवा रंग. तो सूर्यप्रकाश शोषून घेतो, म्हणून वनस्पती अन्न तयार करू शकतात.
- id: chromosome
  word: गुणसूत्र
  meaning: पेशीच्या आत घट्ट गुंडाळलेला डीएनएचा धागा. माणसाच्या बहुतेक पेशींत अशी 46 गुणसूत्रं असतात, 23 जोड्यांमध्ये.
- id: cilia
  word: रोमके
  meaning: काही पेशींवरचे सूक्ष्म केस. ते पुढे-मागे हलून द्रव किंवा श्लेष्मा पुढे सरकवतात.
- id: cipher
  word: सांकेतिक लिपी
  meaning: संदेश असा गुप्तपणे लिहिण्याची पद्धत की ज्यांना किल्ली माहीत आहे तेच तो वाचू शकतील.
- id: circadian
  word: दैनिक लय
  meaning: सुमारे 24 तासांच्या चक्राप्रमाणे चालणारं, जसं झोपण्याचं आणि जागं होण्याचं रोजचं चक्र.
- id: circuit
  word: विद्युत परिपथ
  meaning: वीज ज्यातून गोल फिरू शकते असा पूर्ण, बंद मार्ग.
- id: circumnavigation
  word: प्रदक्षिणा
  meaning: एखाद्या गोष्टीभोवती, विशेषतः संपूर्ण पृथ्वीभोवती, पूर्ण फेरी मारणारा प्रवास.
- id: citizen
  word: नागरिक
  meaning: एखाद्या देशाची असलेली आणि तिथे हक्क असलेली व्यक्ती.
- id: civilisation
  word: संस्कृती
  meaning: शहरं, कायदे, लिपी आणि व्यापार असलेला मोठा, सुव्यवस्थित समाज.
- id: classify
  word: वर्गीकरण
  meaning: वस्तूंमध्ये काय साम्य आहे त्यानुसार त्यांचे गट पाडणं.
- id: climate
  word: हवामान
  meaning: एखाद्या ठिकाणी अनेक वर्षं साधारणपणे असणारी हवा. आजचा पाऊस म्हणजे हवा, तर ‘दर जुलैत पाऊस’ म्हणजे हवामान.
- id: cnidocyte
  word: दंशपेशी
  meaning: जेलीफिश, प्रवाळ आणि सी ॲनिमोनमध्ये आढळणारी डंख मारणारी पेशी. ती विषाने भरलेला एक सूक्ष्म धागा सोडते.
- id: cochlea
  word: कर्णावर्त
  meaning: आतल्या कानातली गोगलगायीच्या आकाराची, द्रवाने भरलेली नळी. ती आवाजाचं रूपांतर चेतासंदेशांत करते.
- id: cocoon
  word: कोश
  meaning: पतंग (मॉथ) बनण्याआधी काही सुरवंट स्वतःभोवती विणतात ते रेशमी घर.
- id: collagen
  word: कोलॅजन
  meaning: त्वचा, हाडं आणि स्नायू एकत्र धरून ठेवणारं चिवट, धाग्यासारखं प्रथिन. मंद आचेवर बराच वेळ शिजवल्यावर त्याचं मऊ जिलेटिन होतं.
- id: colonial
  word: वसाहतकालीन
  meaning: एखाद्या देशाने खूप दूरच्या दुसऱ्या देशावर राज्य केलं, त्या काळाशी संबंधित.
- id: colony
  word: वसाहत
  meaning: आपल्या मायभूमीपासून दूर लोकांनी वसवलेलं गाव किंवा वस्ती. ती मूळ ठिकाणाशी आपले संबंध टिकवून ठेवते.
- id: combustion
  word: ज्वलन
  meaning: जळण्यासाठीचा शास्त्रीय शब्द. इंधन आणि ऑक्सिजन यांच्यात होणारी वेगवान अभिक्रिया, ज्यातून उष्णता आणि प्रकाश बाहेर पडतो.
- id: comet
  word: धूमकेतू
  meaning: सूर्यमालेच्या टोकाकडून येणारा बर्फ आणि धुळीचा गोळा. सूर्याजवळ आल्यावर त्याला चमकणारी शेपटी फुटते.
- id: compost
  word: कंपोस्ट खत
  meaning: उरलेलं अन्न, पानं आणि शेण कुजून तयार होणारा काळा, भुसभुशीत, मातीसारखा पदार्थ. तो वनस्पतींना पोषण देतो.
- id: compound
  word: संयुग
  meaning: दोन किंवा अधिक मूलद्रव्यं एकत्र जोडून बनलेला पदार्थ, जसं पाणी.
- id: condensation
  word: संघनन
  meaning: पाण्याच्या वाफेसारखा वायू थंड होऊन द्रव बनतो ती क्रिया. थंड ग्लासवर जमणारे थेंब हे त्याचंच उदाहरण.
- id: conductor
  word: वाहक
  meaning: उष्णता किंवा वीज सहज आरपार जाऊ देणारा पदार्थ, जसं तांबं.
- id: conservator
  word: संवर्धक
  meaning: जुन्या वस्तू आणि कलाकृती सुरक्षित राहाव्यात म्हणून त्यांचा अभ्यास, स्वच्छता आणि दुरुस्ती करणारे प्रशिक्षित तज्ज्ञ.
- id: constellation
  word: तारकासमूह
  meaning: ताऱ्यांचा असा गट ज्यात लोक आकाशातलं एखादं चित्र पाहतात.
- id: constitution
  word: राज्यघटना
  meaning: देश कसा चालवायचा हे सांगणाऱ्या मूलभूत नियमांचा संच.
- id: contaminate
  word: दूषित करणं
  meaning: नको असलेलं काहीतरी मिसळून एखादी गोष्ट घाण किंवा हानिकारक करणं.
- id: continent
  word: खंड
  meaning: पृथ्वीवरच्या सात प्रचंड भूभागांपैकी एक, जसं आशिया किंवा आफ्रिका.
- id: cooperative
  word: सहकारी संस्था
  meaning: सभासद मिळून चालवतात आणि ज्याची मालकीही त्यांचीच असते असा व्यवसाय. त्याच्या कमाईत सगळे वाटेकरी असतात.
- id: coprolite
  word: कोप्रोलाइट
  meaning: जीवाश्म बनलेली शी. ती पार दगड झाली आहे, त्यामुळे काळजी करू नकोस, तिचा वास येत नाही.
- id: core
  word: गाभा
  meaning: पृथ्वीचा मध्यभाग. त्यात द्रवरूप बाह्य गाभा आणि घन आंतरगाभा असतो, दोन्ही मुख्यतः लोखंडाचे.
- id: cornea
  word: पारपटल
  meaning: डोळ्याच्या पुढची पारदर्शक खिडकी.
- id: couplet
  word: द्विपदी
  meaning: एकमेकांना जोडून येणाऱ्या कवितेच्या दोन ओळी. बहुधा त्यांची लय किंवा यमक सारखं असतं.
- id: crater
  word: विवर
  meaning: एखादी वस्तू जमिनीवर आदळल्याने तयार होणारा वाडग्यासारखा खड्डा. ज्वालामुखीच्या माथ्यावरच्या खड्ड्यालाही विवर म्हणतात.
- id: crust
  word: भूकवच
  meaning: पृथ्वीचा पातळ, खडकाळ बाहेरचा थर.
- id: crystal
  word: स्फटिक
  meaning: असा घन पदार्थ ज्याचे सूक्ष्म घटक नीटनेटक्या, पुन्हा पुन्हा येणाऱ्या रचनेत रचलेले असतात, जसे मिठाचे किंवा साखरेचे कण.
- id: currency
  word: चलन
  meaning: एखादा देश वापरतो ते पैशाचं स्वरूप, जसं रुपया किंवा डॉलर.
- id: current
  word: प्रवाह
  meaning: पाणी, हवा किंवा वीज यांचं एकाच दिशेने वाहणं.
- id: customs
  word: कस्टम्स (सीमाशुल्क विभाग)
  meaning: सीमेवर लोक देशात कोणता माल आणतात ते तपासणारे आणि त्यावरचा कर वसूल करणारे अधिकारी.
- id: cyclone
  word: चक्रीवादळ
  meaning: गरगर फिरणारं प्रचंड वादळ. भारताजवळ अशा वादळाला सायक्लोन म्हणतात.
- id: decibel
  word: डेसिबल
  meaning: आवाज किती मोठा आहे हे मोजण्याचं एकक. प्रत्येक 10 डेसिबल वाढले की ध्वनिऊर्जा दहापट होते.
- id: decimal
  word: दशांश
  meaning: पूर्ण वस्तूचे भाग टिंब वापरून लिहिण्याची पद्धत, जसं अर्ध्यासाठी 0.5.
- id: deforestation
  word: जंगलतोड
  meaning: जंगलांचे मोठमोठे पट्टे तोडून टाकणं.
- id: delta
  word: त्रिभुज प्रदेश
  meaning: नदी समुद्राला मिळते तिथे, नदीने वाहून आणलेल्या चिखल आणि वाळूपासून तयार झालेली सपाट जमीन.
- id: democracy
  word: लोकशाही
  meaning: लोक मतदान करून नेते निवडतात अशी देश चालवण्याची पद्धत.
- id: density
  word: घनता
  meaning: एखाद्या जागेत किती पदार्थ ठासून भरलेला आहे, ते. एकाच आकाराच्या विटेची आणि स्पंजची घनता खूप वेगळी असते.
- id: descendant
  word: वंशज
  meaning: पूर्वजांनंतर येणारी व्यक्ती किंवा प्राणी, जसं नातवंड.
- id: dialect
  word: बोलीभाषा
  meaning: एखाद्या भाषेचं स्थानिक रूप. त्यात काही शब्द, उच्चार किंवा व्याकरण वेगळं असतं.
- id: diameter
  word: व्यास
  meaning: वर्तुळाच्या मध्यातून जाणारी, एका कडेपासून दुसऱ्या कडेपर्यंतची सरळ रेषा.
- id: diaphragm
  word: श्वासपटल
  meaning: फुफ्फुसांच्या खाली असलेला घुमटाच्या आकाराचा स्नायूंचा पडदा. तो आकुंचन पावून सपाट होतो तेव्हा हवा फुफ्फुसांत ओढली जाते.
- id: digestion
  word: पचन
  meaning: शरीर अन्नाचे तुकडे करून ते वापरण्याजोगं बनवतं, ती क्रिया.
- id: dissolve
  word: विरघळणं
  meaning: घन पदार्थ द्रवात मिसळून जणू नाहीसा होतो, जशी चहात साखर.
- id: distillation
  word: डिस्टिलेशन (ऊर्ध्वपातन)
  meaning: द्रव उकळून आणि त्याची वाफ थंड करून तो अधिक शुद्ध करणं.
- id: distributary
  word: शाखानदी
  meaning: नदीतून फुटून तिच्यापासून दूर वाहत जाणारा लहान प्रवाह. बहुतेक वेळा तो त्रिभुज प्रदेशात दिसतो.
- id: dna
  word: डीएनए
  meaning: प्रत्येक पेशीतला रासायनिक संकेत. सजीवाने कसं वाढायचं याच्या सूचना त्यात लिहिलेल्या असतात.
- id: dome
  word: घुमट
  meaning: अर्ध्या चेंडूसारखं गोलाकार छत.
- id: domesticate
  word: माणसाळवणं
  meaning: जंगली वनस्पती किंवा प्राण्याला अनेक पिढ्यांच्या काळात हळूहळू पाळीव करणं, म्हणजे तो माणसांसोबत राहील आणि वाढेल.
- id: dopamine
  word: डोपामाइन
  meaning: मेंदूतला एक रासायनिक संदेशवाहक. आनंद, काहीतरी हवंसं वाटणं आणि बक्षीस यांच्याशी तो जोडलेला आहे.
- id: doping
  word: डोपिंग
  meaning: खेळातली कामगिरी सुधारण्यासाठी बंदी असलेली औषधं किंवा पद्धती वापरणं. ही फसवणूक आहे आणि तब्येतीला घातकही ठरू शकते.
- id: downforce
  word: डाउनफोर्स
