- id: pitch
  word: पट्टी
  meaning: आवाज किती वरच्या किंवा किती खालच्या सुरात आहे, ते.
- id: pixel
  word: पिक्सेल
  meaning: स्क्रीनवरचं चित्र ज्यांपासून बनतं, त्या रंगांच्या सूक्ष्म ठिपक्यांपैकी एक.
- id: placenta
  word: वार
  meaning: गर्भधारणेच्या काळात गर्भाशयात वाढणारा अवयव. तो आईच्या रक्तातून बाळाला ऑक्सिजन आणि अन्न पोहोचवतो.
- id: plankton
  word: प्लवक
  meaning: पाण्यात तरंगणाऱ्या आणि प्रवाहांबरोबर वाहत जाणाऱ्या सूक्ष्म वनस्पती आणि प्राणी.
- id: plaque
  word: प्लाक
  meaning: दातांवर जमणारा जीवाणूंचा चिकट थर. घासून काढला नाही तर दात किडू शकतात.
- id: plasma
  word: प्लाझ्मा
  meaning: पदार्थाची अतिशय उष्ण, चमकणारी अवस्था. तिच्यात अणू तुटून भारित तुकडे होतात. तारे आणि आकाशातली वीज याच अवस्थेत असतात.
- id: plate
  word: भूपट्ट
  meaning: पृथ्वीच्या खडकाळ बाहेरच्या कवचाच्या प्रचंड, हळूहळू सरकणाऱ्या तुकड्यांपैकी एक. भारत अशाच एका भूपट्टावर वसला आहे.
- id: platelet
  word: प्लेटलेट
  meaning: रक्तातला पेशीचा सूक्ष्म तुकडा. जखमेच्या जागी प्लेटलेट एकत्र गोळा होतात आणि रक्त वाहणं थांबवायला मदत करतात.
- id: pneumatophore
  word: श्वसनमूळ
  meaning: चिखलातून वर डोकावणारं, श्वास घेणारं मूळ. काही खारफुटीच्या झाडांना अशी मुळं असतात.
- id: pollen
  word: परागकण
  meaning: फुलांनी तयार केलेली बारीक पूड. ती दुसऱ्या फुलापर्यंत पोहोचली की बिया तयार व्हायला मदत होते.
- id: pollination
  word: परागीभवन
  meaning: बिया तयार व्हाव्यात म्हणून परागकण एका फुलावरून दुसऱ्या फुलावर पोहोचणं.
- id: pollution
  word: प्रदूषण
  meaning: धूर, प्लॅस्टिक किंवा रसायनं यांसारख्या हानिकारक गोष्टी, ज्या हवा, पाणी किंवा जमीन घाण करतात.
- id: polyhedron
  word: बहुपृष्ठक
  meaning: सपाट पृष्ठं आणि सरळ कडा असलेला घनाकार, जसा घन किंवा पिरॅमिड.
- id: polymer
  word: बहुवारिक
  meaning: अनेक छोटे घटक लांब साखळीत जोडून बनलेला महाकाय रेणू. प्लॅस्टिक, रेशीम, रबर आणि डीएनए हे सगळे बहुवारिकच आहेत.
- id: polyp
  word: पॉलिप
  meaning: नळीसारख्या आकाराचा, तोंडाभोवती स्पर्शिका असलेला सूक्ष्म, मऊ प्राणी, जसा प्रवाळ.
- id: potential-energy
  word: स्थितिज ऊर्जा
  meaning: एखाद्या वस्तूच्या स्थानामुळे किंवा आकारामुळे तिच्यात साठलेली ऊर्जा.
- id: precipitation
  word: वृष्टी
  meaning: पाऊस, हिमवर्षाव, बर्फमिश्रित पाऊस किंवा गारा अशा रूपांत आकाशातून पडणारं पाणी.
- id: predator
  word: शिकारी प्राणी
  meaning: इतर प्राण्यांची शिकार करून त्यांना खाणारा प्राणी.
- id: prehistoric
  word: प्रागैतिहासिक
  meaning: माणसं लिहू लागण्यापूर्वीच्या काळातलं.
- id: pressure
  word: दाब
  meaning: एखादी गोष्ट एखाद्या भागावर किती जोराने दाबते, ते. समुद्रात खोलवर, वरच्या सगळ्या पाण्याचं वजन खूप जोराने दाबतं.
- id: prism
  word: लोलक
  meaning: पांढऱ्या प्रकाशाचं इंद्रधनुष्यात विभाजन करणारा कोनदार, पारदर्शक ठोकळा.
- id: probability
  word: संभाव्यता
  meaning: एखादी गोष्ट घडण्याची किती शक्यता आहे, ते.
- id: projection
  word: नकाशा प्रक्षेपण
  meaning: गोल पृथ्वी सपाट नकाशावर काढण्याची पद्धत. प्रत्येक प्रक्षेपणात काही ना काही ताणलं जातंच.
- id: propeller
  word: प्रॉपेलर
  meaning: बोट किंवा विमान पुढे ढकलणारी, गरगर फिरणारी पाती.
- id: protein
  word: प्रथिन
  meaning: सजीवांच्या मुख्य बांधकाम साहित्यांपैकी एक. स्नायू, त्वचा, केस आणि कोळ्याचं रेशीम हे सगळं मुख्यतः प्रथिनांचंच बनलेलं असतं.
- id: proton
  word: प्रोटॉन
  meaning: अणूच्या मध्यभागी असलेला, धन विद्युतभार असलेला सूक्ष्म कण.
- id: provenance
  word: मालकीचा इतिहास
  meaning: एखादी वस्तू बनली तेव्हापासून आजपर्यंत ती कोणाकोणाच्या मालकीची होती, याची नोंदलेली हकीकत.
- id: proverb
  word: म्हण
  meaning: सल्ला देणारं, सगळ्यांच्या ओळखीचं छोटंसं वचन.
- id: pulley
  word: कप्पी
  meaning: भोवती दोर गुंडाळलेलं चाक. जड वस्तू सहज उचलण्यासाठी ते वापरतात.
- id: pupa
  word: कोशावस्था
  meaning: अळी आणि प्रौढ यांच्या मधली अवस्था, जेव्हा कीटक एका कवचाच्या आत बदलतो.
- id: pupil
  word: बाहुली
  meaning: तुझ्या डोळ्याच्या मधोमध असलेलं, प्रकाश आत येऊ देणारं काळं छिद्र.
- id: pyramid
  word: पिरॅमिड
  meaning: चौकोनी तळ आणि वर एका टोकाला मिळणाऱ्या त्रिकोणी बाजू असलेला आकार किंवा इमारत.
- id: quarantine
  word: विलगीकरण
  meaning: रोग पसरू नये म्हणून लोकांना किंवा प्राण्यांना काही काळ इतरांपासून वेगळं ठेवणं.
- id: radiation
  word: प्रारण
  meaning: किरणांच्या किंवा अतिवेगवान सूक्ष्म कणांच्या रूपात प्रवास करणारी ऊर्जा. तीव्र अतिनील किरण किंवा सूर्याकडून येणारे कण यांसारखे काही प्रकार सजीवांना इजा करू शकतात.
- id: radioactive
  word: किरणोत्सारी
  meaning: आपोआप ऊर्जा आणि सूक्ष्म कण बाहेर टाकणारा. काही अणूंचे केंद्रक अस्थिर असतात आणि हळूहळू तुटत जातात, म्हणून असं घडतं.
- id: radius
  word: त्रिज्या
  meaning: वर्तुळाच्या केंद्रापासून कडेपर्यंतचं अंतर. ते वर्तुळाच्या रुंदीच्या निम्मं असतं.
- id: raga
  word: राग
  meaning: भारतीय शास्त्रीय संगीत ज्यावर उभं आहे, असा स्वरांचा आणि नियमांचा संच.
- id: rainforest
  word: वर्षावन
  meaning: उष्ण, दमट प्रदेशातलं घनदाट जंगल, जिथे जवळजवळ रोज पाऊस पडतो.
- id: receptor
  word: ग्राही
  meaning: पेशीचा असा भाग जो एखादं विशिष्ट रसायन किंवा संदेश पकडतो, जसं ठरावीक किल्ल्यांनीच उघडणारं कुलूप.
- id: recycle
  word: पुनर्वापर
  meaning: वापरलेल्या वस्तू फेकून न देता त्यांपासून नव्या वस्तू बनवणं.
- id: referendum
  word: सार्वमत
  meaning: अशी मतदान प्रक्रिया ज्यात एखाद्या ठिकाणचे सगळे मतदार एका प्रश्नावर थेट निर्णय घेतात, बहुधा हो किंवा नाही असा.
- id: refraction
  word: अपवर्तन
  meaning: प्रकाश एका पदार्थातून दुसऱ्या पदार्थात जाताना वाकतो, जसं हवेतून पाण्यात किंवा काचेत जाताना. त्याला अपवर्तन म्हणतात.
- id: refrigerant
  word: शीतक
  meaning: फ्रिज किंवा एसीमधला खास द्रव. तो कमी तापमानाला उकळतो आणि उष्णता वाहून नेतो.
- id: refugee
  word: निर्वासित
  meaning: युद्ध, हिंसा किंवा धोक्यापासून वाचण्यासाठी आपलं घर किंवा देश सोडायला भाग पडलेली व्यक्ती.
- id: renewable
  word: नवीकरणीय ऊर्जा
  meaning: सूर्यप्रकाश किंवा वारा यांसारखी कधीही न संपणारी ऊर्जा.
- id: reptile
  word: सरपटणारे प्राणी
  meaning: खवले असलेले आणि बहुतेक अंडी घालणारे प्राणी, जसे पाली, साप, कासवं आणि मगरी.
- id: republic
  word: प्रजासत्ताक
  meaning: राजा किंवा राणीऐवजी निवडून आलेला नेता असलेला देश.
- id: reservoir
  word: जलाशय
  meaning: पाणी साठवण्यासाठी वापरलं जाणारं मोठं तळं. बहुधा धरण बांधून ते तयार केलं जातं.
- id: retina
  word: दृष्टिपटल
  meaning: डोळ्याच्या मागच्या बाजूचा पातळ पडदा. त्यातल्या पेशी प्रकाश ओळखतात.
- id: revolution
  word: क्रांती
  meaning: मोठा आणि अचानक झालेला बदल. बहुधा लोक सरकार उलथून टाकतात तेव्हा असं होतं.
- id: rhizome
  word: भूमिगत खोड
  meaning: जमिनीखाली आडवं वाढणारं आणि वर नवे कोंब पाठवणारं खोड, जसं बांबू, आलं आणि हळदीचं.
- id: rhythm
  word: लय
  meaning: संगीत, कविता किंवा हालचालीतला ठेक्यांचा नियमित नमुना.
- id: ritual
  word: विधी
  meaning: दरवेळी एकाच पद्धतीने केल्या जाणाऱ्या कृती, बहुधा एखाद्या धर्माचा किंवा समारंभाचा भाग म्हणून.
- id: rotor
  word: रोटर
  meaning: यंत्राचा गोल फिरणारा भाग. हेलिकॉप्टरचा रोटर म्हणजे त्याला वर उचलण्यासाठी गरगर फिरणाऱ्या लांब पात्यांचा संच.
- id: rover
  word: रोव्हर
  meaning: दुसऱ्या ग्रहावर किंवा चंद्रावर फिरणारं रोबोट वाहन.
- id: saliva
  word: लाळ
  meaning: तोंडातला पाण्यासारखा द्रव. अन्न गिळायला आणि पचवायला तो मदत करतो.
- id: sample
  word: नमुना
  meaning: मोठ्या गटातून निवडलेला छोटा गट. त्यामुळे प्रत्येक सदस्य न तपासताही संपूर्ण गटाबद्दल कळतं.
- id: sanctuary
  word: अभयारण्य
  meaning: सुरक्षित जागा, विशेषतः जिथे वन्य प्राण्यांचं संरक्षण केलं जातं.
- id: satyagraha
  word: सत्याग्रह
  meaning: अन्यायाला हिंसा न करता विरोध करणं, यासाठी गांधीजींनी वापरलेला शब्द. त्याचा अर्थ सत्याला घट्ट धरून राहणं.
- id: sauropod
  word: सॉरोपॉड
  meaning: लांब मान आणि लांब शेपटी असलेले, चार पायांवर चालणारे महाकाय शाकाहारी डायनासोर.
- id: savanna
  word: सव्हाना
  meaning: विखुरलेली झाडं असलेला विस्तीर्ण, उबदार गवताळ प्रदेश. तिथे वर्षाचा काही काळ पाऊस असतो आणि बाकी काळ कोरडा.
- id: script
  word: लिपी
  meaning: एखादी भाषा लिहिण्यासाठी वापरली जाणारी अक्षरं किंवा चिन्हं.
- id: scripture
  word: धर्मग्रंथ
  meaning: एखाद्या धर्माचे पवित्र ग्रंथ.
- id: sculpture
  word: शिल्प
  meaning: कोरून, घडवून किंवा जोडून बनवलेली कला, जसा पुतळा.
- id: sediment
  word: गाळ
  meaning: वाळू, चिखल आणि खडकांचे कण, जे थरांमध्ये साचतात. बहुधा नद्या, तलाव आणि समुद्र यांच्या तळाशी.
- id: sensor
  word: सेन्सर
  meaning: प्रकाश, उष्णता किंवा हालचाल अशी एखादी गोष्ट ओळखणारं आणि तिचं रूपांतर यंत्राला वापरता येईल अशा संकेतात करणारं उपकरण.
- id: sepoy
  word: शिपाई
  meaning: युरोपीय लोक चालवत असलेल्या सैन्यात, विशेषतः ईस्ट इंडिया कंपनीच्या सैन्यात, काम करणारा भारतीय सैनिक. हा शब्द ‘सिपाही’ या फारसी शब्दावरून आला, ज्याचा अर्थ सैनिक.
- id: series
  word: श्रेणी
  meaning: गणितात, एका नियमानुसार येणाऱ्या संख्यांची बेरीज, जसं 1 + 1/2 + 1/4 + 1/8. काही श्रेणी कधीच संपत नाहीत.
- id: server
  word: सर्व्हर
  meaning: सतत चालू राहणारा संगणक. तो माहिती साठवतो आणि इतर संगणकांनी मागितली की त्यांना पाठवतो.
- id: simile
  word: उपमा
  meaning: दोन गोष्टींची ‘सारखा’ किंवा ‘जसा’ हे शब्द वापरून केलेली तुलना, जसं ‘सिंहासारखा शूर’.
- id: skeleton
  word: सांगाडा
  meaning: शरीराला आधार देणारी हाडांची चौकट.
- id: solar-system
  word: सूर्यमाला
  meaning: सूर्य आणि त्याच्याभोवती फिरणारं सगळं काही, म्हणजे ग्रह, उपग्रह, लघुग्रह आणि धूमकेतू.
- id: solstice
  word: अयनदिन
  meaning: वर्षातल्या अशा दोन दिवसांपैकी एक, जेव्हा दुपारी सूर्य सगळ्यात उंच किंवा सगळ्यात खाली पोहोचतो. त्यामुळे तो वर्षातला सगळ्यात मोठा किंवा सगळ्यात लहान दिवस ठरतो.
- id: solution
  word: द्रावण
