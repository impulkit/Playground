- id: tectonic-plates
  word: टेक्टॉनिक प्लेट्स
  meaning: पृथ्वीचा पृष्ठभाग ज्यांपासून बनला आहे आणि जे हळूहळू सरकतात, असे खडकांचे प्रचंड तुकडे.
- id: telegraph
  word: तारयंत्र
