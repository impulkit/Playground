# Subject names and taglines in Telugu. Keys = subject ids from content/subjects.yml.
lost:
  name: "మాయమైన లోకాలు"
  tagline: "డైనోసార్లు, శిలాజాలు, ఆకాశం విరిగిపడిన ఆ రోజు"
earth:
  name: "కదిలే భూమి"
  tagline: "కదిలే ఖండాలు, పెరిగే పర్వతాలు, విచిత్రమైన వాతావరణం"
space:
  name: "అంతరిక్షం"
  tagline: "గ్రహశకలాలు, చంద్రులు, నక్షత్రాలు, అంతరిక్ష యాత్రలు"
sky:
  name: "రెక్కలు, ఆకాశం"
  tagline: "పక్షులు, గబ్బిలాలు, విమానాలు, సుదూర ప్రయాణాలు"
ocean:
  name: "లోతైన సముద్రాలు"
  tagline: "మెరిసే చేపలు, భారీ తిమింగలాలు, చిమ్మచీకటి లోతులు"
wild:
  name: "అడవి లోకం"
  tagline: "పులులు, మర్రిచెట్లు, మిణుగురులు, మన పక్కనే ఉండే జీవులు"
how:
  name: "ఇవి ఎలా పనిచేస్తాయి"
  tagline: "యంత్రాలు, పదార్థాలు, శబ్దం, రోజువారీ సైన్స్"
art:
  name: "కళ, సంగీతం"
  tagline: "గుహ చిత్రాలు, రంగులు, రాగాలు, ముగ్గులు"
people:
  name: "మనుషులు, సమాజం"
  tagline: "ప్రభుత్వాలు, హక్కులు, ఓట్లు, మనం కలిసి ఎలా బతుకుతాం"
numbers:
  name: "అంకెలు, అమరికలు"
  tagline: "సున్నా, కోడ్‌లు, కోట్లు, తేనెపట్లు"
pop:
  name: "కథలు, పాటలు, ఆటలు"
  tagline: "క్రీడలు, సినిమాలు, సంగీతం, ఆటలు, పండుగలు"
body:
  name: "మన శరీరం"
  tagline: "మెదడు, ఎముకలు, సూక్ష్మక్రిములు, ఎక్కిళ్లు ఎందుకొస్తాయి"
tech:
  name: "ఆవిష్కరణలు, టెక్నాలజీ"
  tagline: "కంప్యూటర్లు, ఆవిష్కర్తలు, అన్నిటినీ మార్చేసిన యంత్రాలు"
history:
  name: "చరిత్ర"
  tagline: "సామ్రాజ్యాలు, అన్వేషకులు, ప్రపంచాన్ని మార్చిన మనుషులు"
places:
  name: "దేశాలు, సంస్కృతులు"
  tagline: "నగరాలు, దేశాలు, ప్రపంచమంతటా మనుషులు ఎలా జీవిస్తారు"
words:
  name: "పుస్తకాలు, భాష"
  tagline: "అక్షరమాలలు, ఇతిహాసాలు, కవులు, ఎప్పటికీ నిలిచే కథలు"
food:
  name: "ఆహారం, రోజువారీ జీవితం"
  tagline: "మనం తినేవి, వేసుకునేవి, వాడేవి, అవి ఎక్కడి నుంచి వస్తాయి"

explained:
  name: "వార్తల్లో"
  tagline: "ఈరోజు వార్తల్లో"
