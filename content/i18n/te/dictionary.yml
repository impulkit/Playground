- id: ultrasound
  word: "అల్ట్రాసౌండ్"
  meaning: "మనుషులకు వినిపించనంత ఎక్కువ శ్రుతి ఉండే శబ్దం. శరీరం లోపల చూడటానికి కూడా దీన్ని వాడతారు."
- id: ultraviolet
  word: "అతినీలలోహిత కాంతి"
  meaning: "సూర్యుడి నుంచి వచ్చే, మన కళ్లకు కనిపించని ఒక రకం కాంతి. ఇది ఎక్కువైతే ఎండకు చర్మం కమిలిపోతుంది."
- id: vaccine
  word: "టీకా"
  meaning: "ఒక సూక్ష్మక్రిమిని గుర్తుపట్టడం నీ శరీరానికి నేర్పించే మందు. దాంతో నిజమైన క్రిమి ఎప్పుడైనా ఎదురైతే శరీరం దాన్ని త్వరగా ఎదుర్కొంటుంది."
- id: vacuum
  word: "శూన్యం"
  meaning: "గాలి గానీ ఇంకే పదార్థం గానీ దాదాపు లేని ప్రదేశం."
- id: vein
  word: "సిర"
  meaning: "రక్తాన్ని తిరిగి గుండెకు తీసుకెళ్లే నాళం."
- id: velocity
  word: "వేగం (దిశతో)"
  meaning: "ఒక నిర్దిష్ట దిశలో వేగం."
- id: venom
  word: "విషం"
  meaning: "కోరలు, కొండెలు లేదా ముళ్లతో ఒక జంతువు ఇంకో జంతువులోకి ఎక్కించే హానికరమైన ద్రవం."
- id: verdict
  word: "తీర్పు"
  meaning: "విచారణ చివరలో తీసుకునే నిర్ణయం. ఉదాహరణకు ఎవరైనా దోషా నిర్దోషా అని."
- id: vertebrate
  word: "సకశేరుకం"
  meaning: "చేప, పక్షి, మనిషి లాగా వెన్నెముక ఉండే జంతువు."
- id: veto
  word: "వీటో"
  meaning: "ఒక నిర్ణయాన్ని లేదా ప్రతిపాదిత చట్టాన్ని తిరస్కరించే అధికారం. ‘నేను నిషేధిస్తున్నాను’ అని అర్థం వచ్చే లాటిన్ పదం నుంచి ఇది వచ్చింది."
- id: vibration
  word: "కంపనం"
  meaning: "వేగంగా అటూ ఇటూ వణికే కదలిక."
- id: virus
  word: "వైరస్"
  meaning: "బ్యాక్టీరియం కంటే ఎంతో చిన్న సూక్ష్మక్రిమి. ఇది జీవి కణాల లోపల మాత్రమే తన నకళ్లను తయారుచేసుకోగలదు."
- id: vitamin
  word: "విటమిన్"
  meaning: "ఆరోగ్యంగా ఉండటానికి నీ శరీరానికి కొద్ది మొత్తంలో కావాల్సిన, ఆహారంలోని పదార్థం."
- id: volume
  word: "ఘనపరిమాణం"
  meaning: "ఒక వస్తువు ఎంత చోటు ఆక్రమిస్తుందో అది. శబ్దం ఎంత గట్టిగా ఉందో చెప్పడానికి కూడా ఈ పదం (వాల్యూమ్) వాడతారు."
- id: vortex
  word: "సుడి"
  meaning: "సుడిగుండం లాగా, లేదా సింకు గొట్టంలోకి గిరగిరా తిరుగుతూ వెళ్లే నీటి లాగా, తిరిగే గాలి లేదా నీటి సుడి."
- id: wavelength
  word: "తరంగదైర్ఘ్యం"
  meaning: "ఒక అల శిఖరం నుంచి తర్వాతి అల శిఖరం వరకు దూరం. కాంతి విషయంలో తరంగదైర్ఘ్యం మారితే రంగు మారుతుంది."
- id: weathering
  word: "శిలాశైథిల్యం"
  meaning: "వాన, వేడి, చలి, మంచు, మొక్కలు, జీవుల వల్ల రాయి నెమ్మదిగా విరిగిపోవడం."
- id: weaving
  word: "నేత"
  meaning: "దారాలను ఒకదాని పైనుంచి ఒకటి, కింది నుంచి ఒకటి దాటిస్తూ బట్ట తయారుచేయడం."
- id: wetland
  word: "చిత్తడి నేల"
  meaning: "ఏడాదిలో కనీసం కొంతకాలం నీటితో నానిపోయి ఉండే భూమి. బురద నేలలు, చిత్తడులు, మడ అడవులు ఇలాంటివే."
- id: yeast
  word: "ఈస్ట్"
  meaning: "చక్కెరను తిని కార్బన్ డయాక్సైడ్ వాయువును విడుదల చేసే, ఒకే కణం ఉండే చిన్న శిలీంధ్రం. బేకర్లు రొట్టె పొంగడానికి దీన్ని వాడతారు."
- id: zodiac
  word: "రాశిచక్రం"
  meaning: "ఏడాది పొడవునా సూర్యుడు, చంద్రుడు, గ్రహాలు దాని గుండా వెళ్తున్నట్టు కనిపించే పన్నెండు నక్షత్ర నమూనాల పట్టీ."
